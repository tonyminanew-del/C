<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استكمال بيانات الخادم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    h2 { color: #38bdf8; margin-bottom: 10px; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    .input-box, select {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      text-align: right;
      margin-bottom: 15px;
    }
    select option { background: #0b0f19; color: #fff; }
    .input-box:focus, select:focus { border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>أهلاً بك يا <span id="userNameSpan">...</span> 👋</h2>
    <p>من فضلك أكمل بياناتك الشخصية للمتابعة</p>

    <input type="text" id="phoneInput" class="input-box" placeholder="رقم الهاتف">
    
    <select id="titleSelect" class="input-box">
      <option value="" disabled selected>اختر اللقب</option>
      <option value="أخ">أخ</option>
      <option value="لا تسوني">لا تسوني</option>
      <option value="أب كاهن">أب كاهن</option>
    </select>

    <button class="btn" onclick="saveUserData()">حفظ والانتقال للرئيسية 🚀</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const currentUsername = localStorage.getItem("currentAdminUser");

    window.addEventListener('DOMContentLoaded', () => {
      if (!currentUsername) {
        window.location.href = "admin.html";
        return;
      }
      document.getElementById('userNameSpan').innerText = currentUsername;
    });

    async function saveUserData() {
      const phone = document.getElementById('phoneInput').value.trim();
      const userTitle = document.getElementById('titleSelect').value;
      const errorMsg = document.getElementById('errorMsg');

      if (!phone || !userTitle) {
        errorMsg.innerText = "يرجى إدخال رقم الهاتف واختيار اللقب ❌";
        return;
      }

      try {
        await db.collection('users').doc(currentUsername).set({
          phone: phone,
          title: userTitle
        }, { merge: true });

        window.location.href = "admin/home.html";

      } catch (err) {
        console.error(err);
        errorMsg.innerText = "حدث خطأ أثناء الحفظ في قاعدة البيانات ❌";
      }
    }
  </script>
</body>
</html>
