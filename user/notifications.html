<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - تطبيق الكنيسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0f111a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 95px 20px; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-card { background: #1a1c29; border: 1px solid #2a2e43; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .header-card h2 { color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 1.4rem; }

        #notificationsList { display: flex; flex-direction: column; gap: 15px; }

        .notif-card {
            background: #1a1c29;
            border: 1px solid #2a2e43;
            border-right: 5px solid #00e676;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .notif-card:hover {
            border-color: #00e676;
            transform: translateY(-3px);
        }
        .notif-title { font-size: 1.05rem; font-weight: bold; color: #00e676; margin-bottom: 6px; }
        .notif-body { font-size: 0.95rem; color: #d1d5db; line-height: 1.5; margin-bottom: 10px; }
        .notif-date { font-size: 0.75rem; color: #a0aec0; text-align: left; }

        .no-notifs { text-align: center; color: #a0aec0; padding: 40px; font-size: 1rem; }

        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: #1a1c29; backdrop-filter: blur(20px); border: 1px solid #2a2e43; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #a0aec0; font-size: 0.75rem; font-weight: 600; gap: 4px; transition: all 0.3s ease; width: 23%; }
        .nav-item .nav-icon { font-size: 20px; }
        .nav-item:hover, .nav-item.active { color: #00e676; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h2>سجل الإشعارات 🔔</h2>
        </div>

        <div id="notificationsList">
            <div class="no-notifs">جاري تحميل الإشعارات...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span><span>الرئيسية</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>البروفايل</span></a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span><span>المعرض</span></a>
        <a href="notifications.html" class="nav-item active"><span class="nav-icon">🔔</span><span>الإشعارات</span></a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
            authDomain: "church-7afe1.firebaseapp.com",
            projectId: "church-7afe1",
            storageBucket: "church-7afe1.firebasestorage.app",
            messagingSenderId: "1072334615357",
            appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
            measurementId: "G-E7Q76Z53SB"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.firestore();
        const currentUsername = localStorage.getItem("currentUsername");
        const notificationsList = document.getElementById('notificationsList');

        async function loadAllNotifications() {
            if (!currentUsername) {
                window.location.href = "../index.html";
                return;
            }

            try {
                const userDoc = await db.collection('users').doc(currentUsername).get();
                let userStage = userDoc.exists && userDoc.data().stage ? userDoc.data().stage : "";

                const snapshot = await db.collection("myNewCollection").orderBy("createdAt", "desc").get();
                
                notificationsList.innerHTML = "";
                let count = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // شروط العرض: لو الإشعار موجه للجميع (all) أو يخص مرحلة المستخدم أو موجه له بالاسم
                    const target = data.targetType || 'all';
                    const isForEveryone = (target === 'all' || target === '');
                    const isForStage = (target === userStage);
                    const isForSpecificUser = (target === 'specific' && data.targetUserId === currentUsername);

                    if (isForEveryone || isForStage || isForSpecificUser) {
                        count++;
                        const dateObj = data.createdAt?.toDate ? data.createdAt.toDate() : new Date();
                        const formattedDate = dateObj.toLocaleString('ar-EG');

                        const card = document.createElement('div');
                        card.className = "notif-card";
                        card.innerHTML = `
                            <div class="notif-title">🔔 ${data.title || 'إشعار جديد'}</div>
                            <div class="notif-body">${data.body || ''}</div>
                            <div class="notif-date">${formattedDate}</div>
                        `;
                        notificationsList.appendChild(card);
                    }
                });

                if (count === 0) {
                    notificationsList.innerHTML = '<div class="no-notifs">لا توجد إشعارات مسجلة تخصك حتى الآن.</div>';
                }

            } catch (error) {
                console.error("Error loading notifications:", error);
                notificationsList.innerHTML = '<div class="no-notifs" style="color: #ff5252;">حدث خطأ أثناء تحميل الإشعارات.</div>';
            }
        }

        loadAllNotifications();
    </script>
</body>
</html>
