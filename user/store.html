<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الهدايا - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس فايراستور فقط -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* الهيدر العلوي ونقاط المستخدم */
    .store-header {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.6));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .store-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }

    .user-points-badge {
      background: #38bdf8;
      color: #0b0f19;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
    }

    /* شبكة الهدايا */
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .gift-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .gift-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-3px);
    }

    .gift-img-box {
      width: 100%;
      height: 120px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gift-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gift-img-placeholder {
      font-size: 40px;
    }

    .gift-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .gift-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .gift-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .gift-price {
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 700;
      text-align: center;
    }

    .buy-btn {
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      padding: 8px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .buy-btn:hover {
      opacity: 0.9;
    }

    .buy-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .empty-store {
      grid-column: span 2;
      text-align: center;
      color: #94a3b8;
      padding: 50px 0;
      font-size: 0.95rem;
    }

    /* الشريط السفلي للتنقل */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      gap: 4px;
      transition: all 0.3s ease;
      width: 23%;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- الهيدر وعرض النقاط -->
    <div class="store-header">
      <div class="store-title">🎁 معرض الهدايا</div>
      <div class="user-points-badge" id="userPointsBadge">⭐ 0 نقطة</div>
    </div>

    <!-- شبكة الهدايا -->
    <div class="gifts-grid" id="giftsGrid">
      <div class="empty-store">جاري تحميل الهدايا...</div>
    </div>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>
    <a href="store.html" class="nav-item active">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>
    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentUserPoints = 0;
    const currentUsername = localStorage.getItem("currentUsername");

    // التحقق من تسجيل الدخول عبر الـ localStorage
    if (!currentUsername) {
      window.location.href = "../index.html";
    } else {
      listenToUserData(currentUsername);
      loadStoreGifts();
    }

    // الاستماع لنقاط المستخدم من كولكشن users عبر الـ username
    function listenToUserData(username) {
      db.collection('users').doc(username).onSnapshot((doc) => {
        if (doc.exists) {
          currentUserPoints = Number(doc.data().points) || 0;
          document.getElementById('userPointsBadge').innerText = `⭐ ${currentUserPoints} نقطة`;
          loadStoreGifts();
        }
      });
    }

    // جلب الهدايا ودمج المتشابهة بالاسم في المعرض
    function loadStoreGifts() {
      const giftsGrid = document.getElementById('giftsGrid');

      db.collection('gifts').onSnapshot((snapshot) => {
        giftsGrid.innerHTML = '';

        if (snapshot.empty) {
          giftsGrid.innerHTML = '<div class="empty-store">لا توجد هدايا متاحة في المعرض حالياً.</div>';
          return;
        }

        const groupedGifts = {};

        snapshot.forEach((doc) => {
          const gift = doc.data();
          const giftId = doc.id;
          const giftName = gift.name || 'هدايا الكنيسة';
          const giftPrice = Number(gift.points) || 0;
          const giftQuantity = Number(gift.quantity) || 0;
          
          if (giftQuantity <= 0) return;

          // تجميع الهدايا التي تحمل نفس الاسم معاً
          if (!groupedGifts[giftName]) {
            groupedGifts[giftName] = {
              name: giftName,
              points: giftPrice,
              image: gift.image || '',
              totalQuantity: 0,
              ids: []
            };
          }

          groupedGifts[giftName].totalQuantity += giftQuantity;
          groupedGifts[giftName].ids.push(giftId);
        });

        let hasVisibleGifts = false;

        Object.values(groupedGifts).forEach((gift) => {
          hasVisibleGifts = true;
          const hasEnoughPoints = currentUserPoints >= gift.points;

          const card = document.createElement('div');
          card.className = 'gift-card';

          const imgHTML = gift.image 
            ? `<img src="${gift.image}" alt="${gift.name}">` 
            : `<div class="gift-img-placeholder">🎁</div>`;

          let btnText = 'شراء 🛒';
          let isDisabled = false;

          if (!hasEnoughPoints) {
            btnText = 'نقاط غير كافية 🔒';
            isDisabled = true;
          }

          card.innerHTML = `
            <div class="gift-img-box">${imgHTML}</div>
            <div class="gift-name">${gift.name}</div>
            <div class="gift-footer">
              <div class="gift-info-row">
                <span>المتبقي: ${gift.totalQuantity}</span>
                <span class="gift-price">⭐ ${gift.points} نقطة</span>
              </div>
              <button class="buy-btn" ${isDisabled ? 'disabled' : ''} onclick="buyGroupedGift('${escapeHtml(JSON.stringify(gift.ids))}', '${escapeHtml(gift.name)}', ${gift.points}, '${gift.image}')">
                ${btnText}
              </button>
            </div>
          `;

          giftsGrid.appendChild(card);
        });

        if (!hasVisibleGifts) {
          giftsGrid.innerHTML = '<div class="empty-store">لا توجد هدايا متاحة في المعرض حالياً.</div>';
        }
      }, (err) => {
        console.error("Error loading gifts:", err);
        giftsGrid.innerHTML = '<div class="empty-store">حدث خطأ أثناء تحميل المعرض.</div>';
      });
    }

    // شراء الهدية المجمعة وخصم الكمية من أول مستند متاح وإزالته عند النفاد
    async function buyGroupedGift(idsJson, giftName, giftPrice, giftImage) {
      if (!currentUsername) return;

      if (currentUserPoints < giftPrice) {
        alert("عذراً، لا تمتلك نقاط كافية لشراء هذه الهدية.");
        return;
      }

      const confirmBuy = confirm(`هل تريد بالتأكيد شراء هذه الهدية (${giftName}) مقابل ${giftPrice} نقطة؟`);
      if (!confirmBuy) return;

      const idsList = JSON.parse(idsJson);
      if (idsList.length === 0) return;

      const giftId = idsList[0]; // أخذ أول ID متوفر للخصم منه

      try {
        const userRef = db.collection('users').doc(currentUsername);
        const giftRef = db.collection('gifts').doc(giftId);
        const basketRef = userRef.collection('basket');

        const basketSnapshot = await basketRef
          .where("giftId", "==", giftId)
          .where("isApproved", "==", false)
          .where("isDelivered", "==", false)
          .get();

        let existingBasketDocRef = null;
        let existingBasketCount = 0;

        basketSnapshot.forEach(doc => {
          if (!existingBasketDocRef) {
            existingBasketDocRef = doc.ref;
            existingBasketCount = Number(doc.data().count) || 1;
          }
        });

        await db.runTransaction(async (transaction) => {
          const userDoc = await transaction.get(userRef);
          if (!userDoc.exists) throw new Error("مستخدم غير موجود!");

          const giftDoc = await transaction.get(giftRef);

          const currentPoints = Number(userDoc.data().points) || 0;
          if (currentPoints < giftPrice) {
            throw new Error("نقاطك غير كافية!");
          }

          let currentQty = 0;
          if (giftDoc && giftDoc.exists) {
            currentQty = Number(giftDoc.data().quantity) || 0;
            if (currentQty <= 0) {
              throw new Error("عذراً، هذه الهدية نفدت من المتجر!");
            }
          } else {
            throw new Error("هذه الهدية لم تعد موجودة!");
          }

          // 1. خصم النقاط من المستخدم
          transaction.update(userRef, {
            points: currentPoints - giftPrice,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          // 2. خصم الكمية أو حذف المستند إذا نفد
          const newQty = currentQty - 1;
          if (newQty <= 0) {
            transaction.delete(giftRef);
          } else {
            transaction.update(giftRef, {
              quantity: newQty,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }

          // 3. دمج أو إضافة الهدية في السلة
          if (existingBasketDocRef) {
            transaction.update(existingBasketDocRef, {
              count: existingBasketCount + 1,
              addedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            const newDocRef = basketRef.doc();
            transaction.set(newDocRef, {
              giftId: giftId,
              name: giftName,
              points: giftPrice,
              image: giftImage,
              count: 1,
              isDelivered: false,
              isApproved: false,
              addedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        });

        alert("تم شراء الهدية بنجاح وإضافتها إلى سلتك! 🎉");
      } catch (error) {
        console.error("Transaction failed: ", error);
        alert("❌ حدث خطأ أثناء إتمام عملية الشراء: " + error.message);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
