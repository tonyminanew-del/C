<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الهدايا - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* كارت النقاط العلوي */
    .top-points-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(2, 132, 199, 0.05));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .points-info h4 {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .points-info div {
      font-size: 1.6rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .store-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* شبكة المنتجات والهدايا */
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .gift-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      position: relative;
    }

    .gift-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
    }

    .gift-img-box {
      width: 100%;
      height: 120px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gift-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gift-img-placeholder {
      font-size: 40px;
    }

    .gift-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .gift-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .gift-price {
      color: #38bdf8;
      font-weight: 800;
    }

    .gift-qty {
      color: #94a3b8;
    }

    .add-to-cart-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .add-to-cart-btn:hover {
      opacity: 0.9;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      grid-column: 1 / -1;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      gap: 4px;
      transition: all 0.3s ease;
      width: 23%;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- رصيد النقاط العلوي -->
    <div class="top-points-card">
      <div class="store-title">🎁 معرض الهدايا</div>
      <div class="points-info">
        <h4>نقاطك الحالية</h4>
        <div id="userPoints">0</div>
      </div>
    </div>

    <!-- شبكة المنتجات والهدايا -->
    <div class="gifts-grid" id="giftsContainer">
      <div class="empty-msg">جاري تحميل الهدايا...</div>
    </div>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>
    <a href="store.html" class="nav-item active">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>
    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentUserPoints = 0;

    // متابعة المستخدم وجلب نقاطه والهدايا
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        loadUserPoints(user.uid);
        loadGifts();
      } else {
        window.location.href = "user.html";
      }
    });

    // جلب نقاط المخدوم المباشرة
    function loadUserPoints(uid) {
      db.collection('servants').doc(uid).onSnapshot((doc) => {
        if (doc.exists) {
          currentUserPoints = doc.data().points || 0;
          document.getElementById('userPoints').innerText = currentUserPoints;
        }
      });
    }

    // جلب الهدايا المتاحة فقط (إخفاء الهدية إذا أصبحت كميتها 0 أو أقل)
    function loadGifts() {
      const giftsContainer = document.getElementById('giftsContainer');

      db.collection('gifts').onSnapshot((snapshot) => {
        giftsContainer.innerHTML = '';

        let availableGiftsCount = 0;

        snapshot.forEach((doc) => {
          const gift = doc.data();
          const giftId = doc.id;

          // تخطي الهدية وعدم عرضها إذا نفدت كميتها
          if (!gift.quantity || gift.quantity <= 0) {
            return;
          }

          availableGiftsCount++;

          const giftCard = document.createElement('div');
          giftCard.className = 'gift-card';

          const imgHTML = gift.image 
            ? `<img src="${gift.image}" alt="${gift.name}">` 
            : `<div class="gift-img-placeholder">🎁</div>`;

          giftCard.innerHTML = `
            <div class="gift-img-box">${imgHTML}</div>
            <div class="gift-name">${gift.name}</div>
            <div class="gift-details">
              <span class="gift-price">⭐ ${gift.points} نقطة</span>
              <span class="gift-qty">المتاح: ${gift.quantity}</span>
            </div>
            <button class="add-to-cart-btn" 
              onclick="addToBasket('${giftId}', '${gift.name}', ${gift.points}, ${gift.quantity}, '${gift.image || ''}')">
              إضافة للسلة 🛒
            </button>
          `;

          giftsContainer.appendChild(giftCard);
        });

        if (availableGiftsCount === 0) {
          giftsContainer.innerHTML = '<div class="empty-msg">لا توجد هدايا متاحة حالياً 🎁</div>';
        }
      });
    }

    // شراء الهدية (خصم النقاط، تقليل الكمية، والإضافة للسلة)
    async function addToBasket(giftId, name, points, quantity, image) {
      if (!currentUser) return;

      if (currentUserPoints < points) {
        alert("النقاط غير كافية للشراء ❌");
        return;
      }

      if (quantity <= 0) {
        alert("عذراً، نفدت الكمية! ❌");
        return;
      }

      try {
        const userRef = db.collection('servants').doc(currentUser.uid);
        const basketRef = userRef.collection('basket').doc(giftId);
        const giftRef = db.collection('gifts').doc(giftId);

        const doc = await basketRef.get();

        // 1. خصم النقاط من حساب المخدوم
        await userRef.update({
          points: firebase.firestore.FieldValue.increment(-points)
        });

        // 2. تقليل الكمية المتاحة في المخزن بمقدار 1
        await giftRef.update({
          quantity: firebase.firestore.FieldValue.increment(-1)
        });

        // 3. إضافة الهدية للسلة
        if (doc.exists) {
          const currentCount = doc.data().count || 1;
          await basketRef.update({ count: currentCount + 1 });
        } else {
          await basketRef.set({
            giftId: giftId,
            name: name,
            points: points,
            image: image,
            count: 1,
            addedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        alert("تم الخصم والإضافة إلى السلة بنجاح! 🛒✨");

      } catch (err) {
        console.error("Error adding to basket:", err);
        alert("حدث خطأ أثناء تنفيذ العملية!");
      }
    }
  </script>

</body>
</html>
