<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* الهيدر العلوي */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .welcome-box h3 {
      font-size: 1.2rem;
      color: #38bdf8;
    }

    .welcome-box p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .church-logo {
      font-size: 32px;
    }

    /* كارت النقاط 3D */
    .points-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(2, 132, 199, 0.05));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .points-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .points-title {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .points-value {
      font-size: 3rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      line-height: 1;
      margin-bottom: 6px;
    }

    .points-sub {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* شبكة الويدجتس */
    .widgets-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
    }

    .widget-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px 15px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .widget-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
      border-color: #38bdf8;
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.2);
    }

    .widget-icon {
      font-size: 36px;
    }

    .widget-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .widget-desc {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* الشريط السفلي Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      gap: 4px;
      transition: all 0.3s ease;
      width: 23%;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- الهيدر العلوي -->
    <header class="top-header">
      <div class="welcome-box">
        <h3 id="userNameDisplay">أهلاً بك 👋</h3>
        <p>مرحباً بك في خدمة الكنيسة</p>
      </div>
      <div class="church-logo">⛪</div>
    </header>

    <!-- كارت النقاط -->
    <div class="points-card">
      <div class="points-title">رصيد النقاط الحالي</div>
      <div class="points-value" id="pointsDisplay">0</div>
      <div class="points-sub">نقطة تشجيعية</div>
    </div>

    <!-- شبكة الويدجتس الرئيسية -->
    <main class="widgets-container">

      <a href="profile.html" class="widget-card">
        <div class="widget-icon">👤</div>
        <div class="widget-title">الملف الشخصي</div>
        <div class="widget-desc">عرض بياناتك</div>
      </a>

      <a href="store.html" class="widget-card">
        <div class="widget-icon">🎁</div>
        <div class="widget-title">معرض الهدايا</div>
        <div class="widget-desc">استبدل نقاطك</div>
      </a>

      <a href="basket.html" class="widget-card">
        <div class="widget-icon">🛒</div>
        <div class="widget-title">سلة الهدايا</div>
        <div class="widget-desc">طلباتك الحالية</div>
      </a>

    </main>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    
    <a href="home.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>

    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>

    <a href="store.html" class="nav-item">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>

    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>

  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const userNameDisplay = document.getElementById('userNameDisplay');
    const pointsDisplay = document.getElementById('pointsDisplay');

    // قراءة بيانات المستخدم والنقاط من الفايربيس
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const doc = await db.collection('servants').doc(user.uid).get();
          
          if (doc.exists) {
            const data = doc.data();
            userNameDisplay.innerText = `أهلاً يا ${data.fullName || user.displayName}`;
            pointsDisplay.innerText = data.points !== undefined ? data.points : 0;
          } else {
            userNameDisplay.innerText = `أهلاً يا ${user.displayName}`;
            pointsDisplay.innerText = 0;
          }
        } catch (error) {
          console.error("Error fetching user data:", error);
          userNameDisplay.innerText = `أهلاً يا ${user.displayName}`;
        }
      } else {
        window.location.href = "user.html";
      }
    });
  </script>

</body>
</html>
