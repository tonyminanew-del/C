<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0f111a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 95px 20px; overflow-x: hidden; }

    #notifications-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 450px;
    }

    .notif-box {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-right: 6px solid #00e676;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      animation: slideIn 0.4s ease;
      transform: perspective(1000px);
    }

    .notif-box h4 { margin: 0 0 6px 0; color: #00e676; font-size: 1.05rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .notif-box p { margin: 0; color: #d1d5db; font-size: 0.95rem; line-height: 1.4; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; background: #1a1c29; border: 1px solid #2a2e43; padding: 18px 20px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
    .welcome-box h3 { font-size: 1.15rem; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .welcome-box p { font-size: 0.85rem; color: #a0aec0; margin-top: 3px; }
    .church-logo { font-size: 32px; }

    .points-card { background: #1a1c29; border: 1px solid #2a2e43; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
    .points-card:hover { border-color: #00e676; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 230, 118, 0.2); }
    .points-title { font-size: 0.95rem; color: #a0aec0; font-weight: 600; margin-bottom: 8px; }
    .points-value { font-size: 3rem; font-weight: 900; color: #00e676; text-shadow: 0 0 20px rgba(0, 230, 118, 0.4); line-height: 1; margin-bottom: 6px; }
    .points-sub { font-size: 0.8rem; color: #a0aec0; }

    .widgets-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
    .widget-card { background: #1a1c29; border: 1px solid #2a2e43; border-radius: 20px; padding: 20px 15px; text-align: center; text-decoration: none; color: #fff; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .widget-card:hover { transform: translateY(-5px); border-color: #00e676; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 230, 118, 0.2); }
    .widget-icon { font-size: 36px; }
    .widget-title { font-size: 1rem; font-weight: 700; }
    .widget-desc { font-size: 0.75rem; color: #a0aec0; }

    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: #1a1c29; backdrop-filter: blur(20px); border: 1px solid #2a2e43; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #a0aec0; font-size: 0.75rem; font-weight: 600; gap: 4px; transition: all 0.3s ease; width: 23%; }
    .nav-item .nav-icon { font-size: 20px; }
    .nav-item:hover, .nav-item.active { color: #00e676; }
  </style>
</head>
<body>

  <div id="notifications-container"></div>

  <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <div class="container">
    <header class="top-header">
      <div class="welcome-box">
        <h3 id="userNameDisplay">جاري التحميل... 👋</h3>
        <p>كل بياناتك مظبوطة وكاملة</p>
      </div>
      <div class="church-logo">⛪</div>
    </header>

    <div class="points-card">
      <div class="points-title">رصيد النقاط الحالي</div>
      <div class="points-value" id="pointsDisplay">0</div>
      <div class="points-sub">نقطة تشجيعية</div>
    </div>

    <main class="widgets-container">
      <a href="profile.html" class="widget-card">
        <div class="widget-icon">👤</div>
        <div class="widget-title">الملف الشخصي</div>
        <div class="widget-desc">عرض بياناتك</div>
      </a>
      <a href="store.html" class="widget-card">
        <div class="widget-icon">🎁</div>
        <div class="widget-title">معرض الهدايا</div>
        <div class="widget-desc">استبدل نقاطك</div>
      </a>
      <a href="basket.html" class="widget-card">
        <div class="widget-icon">🛒</div>
        <div class="widget-title">سلة الهدايا</div>
        <div class="widget-desc">طلباتك الحالية</div>
      </a>
      <a href="notifications.html" class="widget-card">
        <div class="widget-icon">🔔</div>
        <div class="widget-title">الإشعارات</div>
        <div class="widget-desc">سجل التنبيهات</div>
      </a>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active"><span class="nav-icon">🏠</span><span>الرئيسية</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>البروفايل</span></a>
    <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span><span>المعرض</span></a>
    <a href="notifications.html" class="nav-item"><span class="nav-icon">🔔</span><span>الإشعارات</span></a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.firestore();
    const userNameDisplay = document.getElementById('userNameDisplay');
    const pointsDisplay = document.getElementById('pointsDisplay');
    const notifSound = document.getElementById('notifSound');
    const currentUsername = localStorage.getItem("currentUsername");

    let currentUserStage = "primary";

    async function loadUserData() {
      if (!currentUsername) {
        window.location.href = "../index.html";
        return;
      }

      try {
        const docRef = db.collection('users').doc(currentUsername);
        const doc = await docRef.get();
        
        if (doc.exists) {
          const data = doc.data();
          userNameDisplay.innerText = `أهلاً يا ${data.fullName || currentUsername} 👋`;
          pointsDisplay.innerText = data.points !== undefined ? data.points : 0;
          if (data.stage) currentUserStage = data.stage;
        } else {
          userNameDisplay.innerText = `أهلاً يا ${currentUsername} 👋`;
          pointsDisplay.innerText = 0;
        }
        initRealtimeNotifications();
      } catch (error) {
        console.error("Error:", error);
        userNameDisplay.innerText = `أهلاً يا ${currentUsername} 👋`;
        initRealtimeNotifications();
      }
    }

    function initRealtimeNotifications() {
      db.collection("myNewCollection")
        .orderBy("createdAt", "desc")
        .limit(1)
        .onSnapshot((snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
              const data = change.doc.data();
              const isForEveryone = data.targetType === 'all';
              const isForStage = data.targetType === currentUserStage;
              const isForSpecificUser = data.targetType === 'specific' && data.targetUserId === currentUsername;

              if (isForEveryone || isForStage || isForSpecificUser) {
                showNotificationUI(data.title, data.body);
                // تشغيل صوت التنبيه
                notifSound.play().catch(e => console.log("Audio play blocked by browser:", e));
              }
            }
          });
        });
    }

    function showNotificationUI(title, body) {
      const container = document.getElementById("notifications-container");
      const alertBox = document.createElement("div");
      alertBox.className = "notif-box";
      alertBox.innerHTML = `<h4>🔔 ${title}</h4><p>${body}</p>`;
      container.appendChild(alertBox);

      setTimeout(() => {
        alertBox.remove();
      }, 6000);
    }

    loadUserData();
  </script>
</body>
</html>
