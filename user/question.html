<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيانات المخدوم</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Firebase Firestore Only -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
    .main-card { background: rgba(255,255,255,.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 550px; box-shadow: 0 30px 60px rgba(0,0,0,.6); }
    .header-box { text-align: center; margin-bottom: 25px; }
    .icon-badge { font-size: 45px; margin-bottom: 10px; }
    h2 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 5px; }
    .sub-title { color: #94a3b8; font-size: .9rem; }
    form { display: flex; flex-direction: column; gap: 15px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: .85rem; color: #cbd5e1; font-weight: 600; }
    .custom-input { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: .95rem; outline: none; transition: .3s; width: 100%; }
    .custom-input:focus { border-color: #38bdf8; background: rgba(255,255,255,.08); box-shadow: 0 0 15px rgba(56,189,248,.2); }
    .custom-input option { background: #0f172a; color: #fff; }
    .submit-btn { margin-top: 10px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: .3s; box-shadow: 0 10px 20px rgba(2,132,199,.3); }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(2,132,199,.5); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .status-msg { text-align: center; margin-top: 15px; font-weight: 600; font-size: .95rem; }
    .loading-overlay { text-align: center; color: #38bdf8; font-weight: 600; margin-bottom: 15px; }
  </style>
</head>

<body>

  <div class="main-card">
    <div class="header-box">
      <div class="icon-badge">📋</div>
      <h2 id="welcomeText">أهلاً بك...</h2>
      <p class="sub-title">جاري التحقق من قاعدة البيانات وسحب بياناتك...</p>
    </div>

    <div id="loadingIndicator" class="loading-overlay">جاري الاتصال بقاعدة البيانات... 🔄</div>

    <form id="userDataForm" style="display: none;">
      <div class="input-group">
        <label>الاسم بالكامل:</label>
        <input type="text" id="fullName" class="custom-input" placeholder="أدخل اسمك" required>
      </div>

      <div class="row">
        <div class="input-group">
          <label>رقم التليفون الشخصي:</label>
          <input type="tel" id="userPhone" class="custom-input" placeholder="01XXXXXXXXX" required>
        </div>
        <div class="input-group">
          <label>رقم تليفون الأب:</label>
          <input type="tel" id="fatherPhone" class="custom-input" placeholder="01XXXXXXXXX" required>
        </div>
      </div>

      <div class="input-group">
        <label>رقم تليفون الأم:</label>
        <input type="tel" id="motherPhone" class="custom-input" placeholder="01XXXXXXXXX" required>
      </div>

      <div class="row">
        <div class="input-group">
          <label>العنوان بالكامل:</label>
          <input type="text" id="address" class="custom-input" placeholder="المنطقة - الشارع - رقم العقار" required>
        </div>
        <div class="input-group">
          <label>تاريخ الميلاد:</label>
          <input type="date" id="birthDate" class="custom-input" required>
        </div>
      </div>

      <div class="row">
        <div class="input-group">
          <label>المرحلة الدراسية:</label>
          <select id="stage" class="custom-input" required onchange="updateGrades()">
            <option value="" disabled selected>اختر المرحلة</option>
            <option value="primary">ابتدائي</option>
            <option value="prep">إعدادي</option>
            <option value="sec">ثانوي</option>
          </select>
        </div>
        <div class="input-group">
          <label>الصف الدراسي:</label>
          <select id="grade" class="custom-input" required disabled>
            <option value="" disabled selected>اختر المرحلة أولاً</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitButton">حفظ البيانات</button>
    </form>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();

    // جلب اسم المستخدم من الـ localStorage (المستخدم حالياً في الجلسة فقط لمعرفة من صاحب الحساب)
    const currentUsername = localStorage.getItem("currentUsername");

    if (!currentUsername) {
      window.location.href = "../index.html"; // العودة لصفحة الدخول إذا لم يوجد مستخدم مسجل
    }

    const welcomeText = document.getElementById("welcomeText");
    const fullNameInput = document.getElementById("fullName");
    const statusMsg = document.getElementById("statusMessage");
    const submitButton = document.getElementById("submitButton");
    const loadingIndicator = document.getElementById("loadingIndicator");
    const userDataForm = document.getElementById("userDataForm");

    welcomeText.innerText = `أهلاً يا ${currentUsername}`;

    // البحث في قاعدة البيانات (Firestore) مباشرة عن مستند هذا المستخدم
    async function fetchUserDataFromDatabase() {
      try {
        const userDocRef = db.collection("users").doc(currentUsername);
        const userDoc = await userDocRef.get();

        // إخفاء مؤشر التحميل وإظهار النموذج
        loadingIndicator.style.display = "none";
        userDataForm.style.display = "flex";

        if (userDoc.exists) {
          const data = userDoc.data();
          
          // إذا كانت البيانات مكتملة بالفعل، يمكنك تحويله مباشرة لصفحة home.html (اختياري)
          if (data.fullName && data.userPhone && data.stage && data.grade) {
            // window.location.href = "home.html";
          }

          // تعبئة الحقول بالبيانات القادمة من قاعدة البيانات (Database)
          fullNameInput.value = data.fullName || "";
          document.getElementById("userPhone").value = data.userPhone || "";
          document.getElementById("fatherPhone").value = data.fatherPhone || "";
          document.getElementById("motherPhone").value = data.motherPhone || "";
          document.getElementById("address").value = data.address || "";
          document.getElementById("birthDate").value = data.birthDate || "";
          
          if (data.stage) {
            document.getElementById("stage").value = data.stage;
            updateGrades();
            document.getElementById("grade").value = data.grade || "";
          }
        } else {
          console.log("المستخدم ليس لديه بيانات مخزنة مسبقاً في قاعدة البيانات.");
        }
      } catch (error) {
        console.error("خطأ في جلب البيانات من قاعدة البيانات:", error);
        loadingIndicator.style.color = "#f87171";
        loadingIndicator.innerText = "فشل الاتصال بقاعدة البيانات. تأكد من اتصال الإنترنت.";
      }
    }

    // استدعاء دالة الفحص في قاعدة البيانات عند تحميل الصفحة
    fetchUserDataFromDatabase();

    function updateGrades() {
      const stage = document.getElementById("stage").value;
      const gradeSelect = document.getElementById("grade");
      gradeSelect.innerHTML = '<option value="" disabled selected>اختر الصف</option>';
      gradeSelect.disabled = false;
      let options = [];

      if (stage === "primary") {
        options = ["الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي", "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي"];
      } else if (stage === "prep") {
        options = ["الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"];
      } else if (stage === "sec") {
        options = ["الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"];
      }

      options.forEach((grade) => {
        const option = document.createElement("option");
        option.value = grade;
        option.textContent = grade;
        gradeSelect.appendChild(option);
      });
    }

    // حفظ أو تحديث البيانات مباشرة في قاعدة البيانات (Firestore)
    userDataForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitButton.disabled = true;
      submitButton.innerText = "جاري الحفظ في قاعدة البيانات...";
      statusMsg.style.color = "#38bdf8";
      statusMsg.innerText = "يرجى الانتظار...";

      try {
        const userRef = db.collection("users").doc(currentUsername);

        const dataToSave = {
          fullName: fullNameInput.value.trim(),
          userPhone: document.getElementById("userPhone").value.trim(),
          fatherPhone: document.getElementById("fatherPhone").value.trim(),
          motherPhone: document.getElementById("motherPhone").value.trim(),
          address: document.getElementById("address").value.trim(),
          birthDate: document.getElementById("birthDate").value,
          stage: document.getElementById("stage").value,
          grade: document.getElementById("grade").value,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // حفظ البيانات في Firestore (باستخدام set مع merge لتحديث المستند الخاص باسم المستخدم)
        await userRef.set(dataToSave, { merge: true });

        statusMsg.style.color = "#4ade80";
        statusMsg.innerText = "تم حفظ بياناتك في قاعدة البيانات بنجاح! ✨";

        setTimeout(() => {
          window.location.href = "home.html"; // الانتقال لصفحة الهوم داخل مجلد user
        }, 1000);

      } catch (error) {
        console.error("خطأ أثناء الحفظ في قاعدة البيانات:", error);
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "حدث خطأ: " + error.message;
        submitButton.disabled = false;
        submitButton.innerText = "حفظ البيانات";
      }
    });
  </script>

</body>
</html>
