<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* كارت الهيدر الرئيسي للمستخدم */
    .user-header-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.6));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      background: rgba(56, 189, 248, 0.2);
      border: 2px solid #38bdf8;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      margin: 0 auto 12px auto;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .user-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .user-email {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* شبكة تفاصيل البيانات */
    .details-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(10px);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
      text-align: left;
    }

    /* زر تسجيل الخروج */
    .logout-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 14px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }

    /* الشريط السفلي Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      gap: 4px;
      transition: all 0.3s ease;
      width: 23%;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- الهيدر الشخصي -->
    <div class="user-header-card">
      <div class="avatar-circle">👤</div>
      <div class="user-name" id="profileName">جاري التحميل...</div>
      <div class="user-email" id="profileEmail">...</div>
    </div>

    <!-- التفاصيل والبيانات -->
    <div class="details-box">
      
      <div class="info-row">
        <span class="info-label">📱 رقم التليفون:</span>
        <span class="info-value" id="userPhone">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">👨‍👦 رقم تليفون الأب:</span>
        <span class="info-value" id="fatherPhone">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">👩‍👦 رقم تليفون الأم:</span>
        <span class="info-value" id="motherPhone">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">📍 العنوان:</span>
        <span class="info-value" id="address">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">🎂 تاريخ الميلاد:</span>
        <span class="info-value" id="birthDate">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">🎓 المرحلة الدراسية:</span>
        <span class="info-value" id="stage">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">🏫 الصف الدراسي:</span>
        <span class="info-value" id="grade">-</span>
      </div>

    </div>

    <!-- زر تسجيل الخروج -->
    <button class="logout-btn" id="logoutBtn">تسجيل الخروج 🚪</button>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>

    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>

    <a href="store.html" class="nav-item">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>

    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>

  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // جلب بيانات البروفايل من الفايربيس
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('profileEmail').innerText = user.email || "";

        try {
          const doc = await db.collection('servants').doc(user.uid).get();
          if (doc.exists) {
            const data = doc.data();
            
            document.getElementById('profileName').innerText = data.fullName || user.displayName;
            document.getElementById('userPhone').innerText = data.userPhone || "غير مسجل";
            document.getElementById('fatherPhone').innerText = data.fatherPhone || "غير مسجل";
            document.getElementById('motherPhone').innerText = data.motherPhone || "غير مسجل";
            document.getElementById('address').innerText = data.address || "غير مسجل";
            document.getElementById('birthDate').innerText = data.birthDate || "غير مسجل";

            // ترجمة المرحلة
            let stageArabic = "غير مسجل";
            if(data.stage === "primary") stageArabic = "ابتدائي";
            else if(data.stage === "prep") stageArabic = "إعدادي";
            else if(data.stage === "sec") stageArabic = "ثانوي";

            document.getElementById('stage').innerText = stageArabic;
            document.getElementById('grade').innerText = data.grade || "غير مسجل";
          } else {
            document.getElementById('profileName').innerText = user.displayName;
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
        }
      } else {
        window.location.href = "user.html";
      }
    });

    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = "user.html";
      });
    });
  </script>

</body>
</html>
