<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة الهدايا - تطبيق الكنيسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* الهيدر العلوي */
    .basket-header {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.6));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .basket-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .basket-count-badge {
      background: #38bdf8;
      color: #0b0f19;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    /* قائمة الطلبات والهدايا */
    .basket-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .basket-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      position: relative;
    }

    .basket-item:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .item-img-box {
      width: 75px;
      height: 75px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .item-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-img-placeholder {
      font-size: 32px;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .item-meta {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 700;
      display: flex;
      gap: 10px;
    }

    .item-date {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* شارات حالة التسليم */
    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 10px;
      display: inline-block;
      align-self: flex-start;
      margin-top: 4px;
    }

    .status-badge.delivered {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-badge.pending {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .empty-basket {
      text-align: center;
      color: #94a3b8;
      padding: 50px 0;
      font-size: 0.95rem;
    }

    /* الشريط السفلي للتنقل */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      gap: 4px;
      transition: all 0.3s ease;
      width: 23%;
    }

    .nav-item .nav-icon {
      font-size: 20px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- هيدر السلة -->
    <div class="basket-header">
      <div class="basket-title">🛒 السلة والطلبات</div>
      <div class="basket-count-badge" id="totalItemsCount">0 عنصر</div>
    </div>

    <!-- قائمة المنتجات المشتراة -->
    <div class="basket-list" id="basketList">
      <div class="empty-basket">جاري تحميل الطلبات...</div>
    </div>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>
    <a href="store.html" class="nav-item">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>
    <a href="basket.html" class="nav-item active">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged((user) => {
      if (user) {
        loadBasketItems(user.uid);
      } else {
        window.location.href = "user.html";
      }
    });

    // جلب الهدايا والطلبات من مجموعة Basket الخاصة بالمستخدم
    function loadBasketItems(uid) {
      const basketList = document.getElementById('basketList');
      const totalItemsCount = document.getElementById('totalItemsCount');

      db.collection('servants').doc(uid).collection('basket')
        .orderBy('addedAt', 'desc')
        .onSnapshot((snapshot) => {
          basketList.innerHTML = '';

          if (snapshot.empty) {
            basketList.innerHTML = '<div class="empty-basket">سلتك فارغة، قم بإضافة هدايا من المعرض! 🎁</div>';
            totalItemsCount.innerText = '0 عنصر';
            return;
          }

          totalItemsCount.innerText = `${snapshot.size} عنصر`;

          snapshot.forEach((doc) => {
            const item = doc.data();

            const itemDiv = document.createElement('div');
            itemDiv.className = 'basket-item';

            const imgHTML = item.image 
              ? `<img src="${item.image}" alt="${item.name}">` 
              : `<div class="item-img-placeholder">🎁</div>`;

            // تنسيق التاريخ والوقت
            let formattedDate = 'غير محدد';
            if (item.addedAt && item.addedAt.toDate) {
              const d = item.addedAt.toDate();
              formattedDate = `${d.toLocaleDateString('ar-EG')} - ${d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
            }

            // حالة التسليم
            const isDelivered = item.isDelivered === true;
            const statusClass = isDelivered ? 'delivered' : 'pending';
            const statusText = isDelivered ? 'تم التسليم ✔️' : 'قيد الانتظار ⏳';

            itemDiv.innerHTML = `
              <div class="item-img-box">${imgHTML}</div>
              <div class="item-info">
                <div class="item-name">${item.name}</div>
                <div class="item-meta">
                  <span>⭐ ${item.points || 0} نقطة</span>
                  <span>الكمية: ${item.count || 1}</span>
                </div>
                <div class="item-date">🕒 ${formattedDate}</div>
                <div>
                  <span class="status-badge ${statusClass}">${statusText}</span>
                </div>
              </div>
            `;

            basketList.appendChild(itemDiv);
          });
        }, (err) => {
          console.error("Error loading basket:", err);
          basketList.innerHTML = '<div class="empty-basket">حدث خطأ أثناء تحميل السلة.</div>';
        });
    }
  </script>

</body>
</html>
