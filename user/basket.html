    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Cairo",sans-serif;
}


body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 90% 0%,
            #e0e7ff 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            #f3e8ff 0%,
            transparent 35%
        ),
        #f8fafc;

    color:#172033;

}


/* =========================================================
   HEADER
========================================================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid #e5e7eb;

    box-shadow:
        0 8px 30px rgba(15,23,42,.07);

}


.header-inner{

    width:
        min(1100px,calc(100% - 30px));

    min-height:80px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:13px;

}


.brand-icon{

    width:56px;

    height:56px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:29px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 12px 28px
        rgba(99,102,241,.25);

}


.brand-title{

    font-size:22px;

    font-weight:900;

}


.brand-subtitle{

    color:#64748b;

    font-size:12px;

}


.live-badge{

    display:flex;

    align-items:center;

    gap:8px;

    background:#ecfdf5;

    color:#047857;

    padding:9px 15px;

    border-radius:30px;

    font-size:12px;

    font-weight:800;

}


.live-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#10b981;

    animation:pulse 1.5s infinite;

}


@keyframes pulse{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

}


/* =========================================================
   MAIN
========================================================= */

.container{

    width:
        min(1000px,calc(100% - 25px));

    margin:
        30px auto 60px;

}


.page-title{

    margin-bottom:25px;

}


.page-title h1{

    font-size:30px;

    font-weight:900;

    color:#111827;

}


.page-title p{

    margin-top:4px;

    color:#64748b;

    font-size:14px;

}


/* =========================================================
   USER BOX
========================================================= */

.user-box{

    background:white;

    border:
        1px solid #e5e7eb;

    border-radius:22px;

    padding:18px 20px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.05);

}


.user-info{

    min-width:0;

}


.user-name{

    font-size:17px;

    font-weight:900;

    color:#111827;

}


.user-id{

    margin-top:3px;

    color:#94a3b8;

    font-size:10px;

    direction:ltr;

    text-align:right;

    word-break:break-all;

}


.login-badge{

    flex-shrink:0;

    background:#ecfdf5;

    color:#047857;

    padding:8px 14px;

    border-radius:30px;

    font-size:11px;

    font-weight:800;

}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;

}


.stat-card{

    background:white;

    border:
        1px solid #e5e7eb;

    border-radius:20px;

    padding:19px;

    box-shadow:
        0 10px 28px
        rgba(15,23,42,.055);

}


.stat-title{

    color:#64748b;

    font-size:12px;

    font-weight:700;

}


.stat-number{

    margin-top:3px;

    font-size:29px;

    font-weight:900;

    color:#111827;

}


/* =========================================================
   TABS
========================================================= */

.tabs{

    display:flex;

    gap:6px;

    background:white;

    border:
        1px solid #e5e7eb;

    padding:6px;

    border-radius:18px;

    margin-bottom:20px;

    box-shadow:
        0 8px 25px
        rgba(15,23,42,.05);

}


.tab{

    flex:1;

    border:none;

    background:transparent;

    color:#64748b;

    padding:13px;

    border-radius:13px;

    cursor:pointer;

    font-family:inherit;

    font-size:13px;

    font-weight:800;

    transition:.2s;

}


.tab:hover{

    background:#f1f5f9;

}


.tab.active{

    background:#6366f1;

    color:white;

    box-shadow:
        0 8px 20px
        rgba(99,102,241,.25);

}


/* =========================================================
   REQUESTS
========================================================= */

#requests{

    display:grid;

    gap:17px;

}


.request-card{

    background:white;

    border:
        1px solid #e5e7eb;

    border-radius:23px;

    padding:20px;

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.07);

    animation:cardIn .3s ease;

}


@keyframes cardIn{

    from{

        opacity:0;

        transform:translateY(10px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================================================
   REQUEST TOP
========================================================= */

.request-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;

}


.gift-info{

    display:flex;

    align-items:center;

    gap:13px;

    min-width:0;

}


.gift-image{

    width:72px;

    height:72px;

    border-radius:18px;

    overflow:hidden;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f5f3ff
        );

}


.gift-image img{

    width:100%;

    height:100%;

    object-fit:cover;

}


.gift-details{

    min-width:0;

}


.gift-name{

    font-size:18px;

    font-weight:900;

    color:#111827;

    word-break:break-word;

}


.order-id{

    margin-top:3px;

    color:#94a3b8;

    font-size:10px;

    direction:ltr;

    text-align:right;

    word-break:break-all;

}


/* =========================================================
   STATUS
========================================================= */

.status{

    flex-shrink:0;

    padding:8px 14px;

    border-radius:30px;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

}


.status.pending{

    background:#fef3c7;

    color:#92400e;

}


.status.accepted{

    background:#dcfce7;

    color:#166534;

}


.status.rejected{

    background:#fee2e2;

    color:#b91c1c;

}


.status.delivered{

    background:#dbeafe;

    color:#1d4ed8;

}


/* =========================================================
   DETAILS
========================================================= */

.details-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

}


.detail-box{

    background:#f8fafc;

    border-radius:14px;

    padding:13px;

}


.detail-label{

    color:#64748b;

    font-size:10px;

    font-weight:700;

}


.detail-value{

    margin-top:2px;

    color:#111827;

    font-size:14px;

    font-weight:800;

    word-break:break-word;

}


.points{

    color:#7c3aed;

}


/* =========================================================
   FOOTER
========================================================= */

.request-footer{

    margin-top:16px;

    padding-top:15px;

    border-top:
        1px solid #eef2f7;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.request-date{

    color:#64748b;

    font-size:11px;

    font-weight:600;

}


.admin-note{

    background:#f8fafc;

    color:#475569;

    padding:8px 12px;

    border-radius:10px;

    font-size:11px;

    font-weight:700;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    background:white;

    border:
        1px solid #e5e7eb;

    border-radius:23px;

    padding:60px 20px;

    text-align:center;

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.05);

}


.empty-icon{

    font-size:55px;

    margin-bottom:10px;

}


.empty h3{

    font-size:20px;

    font-weight:900;

    color:#334155;

}


.empty p{

    margin-top:5px;

    color:#64748b;

    font-size:13px;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    background:white;

    border:
        1px solid #e5e7eb;

    border-radius:22px;

    padding:50px 20px;

    text-align:center;

    color:#64748b;

    font-size:14px;

    font-weight:800;

}


.spinner{

    width:34px;

    height:34px;

    margin:
        0 auto 13px;

    border:
        4px solid #e0e7ff;

    border-top-color:#6366f1;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    background:#fff1f2;

    border:
        1px solid #fecdd3;

    color:#be123c;

    border-radius:20px;

    padding:25px;

    text-align:center;

    font-weight:800;

}


.error-details{

    margin-top:12px;

    padding:12px;

    background:white;

    border-radius:10px;

    direction:ltr;

    text-align:left;

    font-family:monospace;

    font-size:11px;

    word-break:break-word;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .stats{

        grid-template-columns:1fr;

    }


    .request-top{

        flex-direction:column;

    }


    .status{

        align-self:flex-start;

    }


    .details-grid{

        grid-template-columns:1fr;

    }


    .request-footer{

        flex-direction:column;

        align-items:stretch;

    }


    .live-badge{

        display:none;

    }


    .user-box{

        align-items:flex-start;

        flex-direction:column;

    }

}


@media(max-width:450px){

    .header-inner{

        min-height:70px;

    }


    .brand-icon{

        width:48px;

        height:48px;

        font-size:24px;

    }


    .brand-title{

        font-size:18px;

    }


    .page-title h1{

        font-size:25px;

    }

}

</style>

</head>


<body>

     HEADER

<header>

<main class="container">

</main>



<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",

    authDomain:
        "church-7afe1.firebaseapp.com",

    projectId:
        "church-7afe1",

    storageBucket:
        "church-7afe1.firebasestorage.app",

    messagingSenderId:
        "1072334615357",

    appId:
        "1:1072334615357:web:c03b199f00ea9d19d40b54",

    measurementId:
        "G-E7Q76Z53SB"

};


/* =========================================================
   FIREBASE INIT
========================================================= */

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();


const auth =
    firebase.auth();



/* =========================================================
   ELEMENTS
========================================================= */

const requestsElement =
    document.getElementById("requests");


const totalCountElement =
    document.getElementById("totalCount");


const pendingCountElement =
    document.getElementById("pendingCount");


const acceptedCountElement =
    document.getElementById("acceptedCount");


const userNameElement =
    document.getElementById("userName");


const userIdElement =
    document.getElementById("userId");


const loginBadgeElement =
    document.getElementById("loginBadge");



/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let allRequests = [];

let currentTab = "current";

let unsubscribeRequests = null;



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



/* =========================================================
   STATUS
========================================================= */

function getStatusInfo(status){

    switch(status){

        case "accepted":

            return {

                text:"✅ تم قبول الطلب",

                className:"accepted"

            };


        case "rejected":

            return {

                text:"❌ تم رفض الطلب",

                className:"rejected"

            };


        case "delivered":

            return {

                text:"📦 تم التسليم",

                className:"delivered"

            };


        case "pending":

        default:

            return {

                text:"⏳ قيد المراجعة",

                className:"pending"

            };

    }

}



/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){

        return "غير محدد";

    }


    try{

        let date;


        if(
            value &&
            typeof value.toDate === "function"
        ){

            date =
                value.toDate();

        }

        else if(
            value &&
            typeof value.toMillis === "function"
        ){

            date =
                new Date(
                    value.toMillis()
                );

        }

        else if(
            value instanceof Date
        ){

            date = value;

        }

        else{

            date =
                new Date(value);

        }


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "غير محدد";

        }


        return new Intl.DateTimeFormat(
            "ar-EG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        ).format(date);

    }

    catch(error){

        return "غير محدد";

    }

}



/* =========================================================
   TIMESTAMP TO NUMBER
========================================================= */

function getTimestamp(value){

    if(!value){

        return 0;

    }


    if(
        value &&
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }


    if(
        value &&
        typeof value.toDate === "function"
    ){

        return value.toDate().getTime();

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return 0;

    }


    return date.getTime();

}



/* =========================================================
   IS OLD
========================================================= */

function isOldRequest(request){

    return (

        request.status === "delivered" ||

        request.status === "rejected"

    );

}



/* =========================================================
   IMAGE
========================================================= */

function renderGiftImage(request){

    const image =

        request.giftImage ||

        request.image ||

        request.photo ||

        request.giftPhoto ||

        "";


    if(image){

        return `

            <div class="gift-image">

                <img

                    src="${escapeHTML(image)}"

                    alt="الهدية"

                    onerror="
                        this.parentElement.innerHTML='🎁';
                    "

                >

            </div>

        `;

    }


    return `

        <div class="gift-image">

            🎁

        </div>

    `;

}



/* =========================================================
   STATS
========================================================= */

function updateStats(){

    totalCountElement.textContent =
        allRequests.length;


    pendingCountElement.textContent =

        allRequests.filter(
            request =>

                !request.status ||

                request.status === "pending"

        ).length;


    acceptedCountElement.textContent =

        allRequests.filter(
            request =>

                request.status === "accepted"

        ).length;

}



/* =========================================================
   RENDER
========================================================= */

function renderRequests(){

    let filtered;


    if(currentTab === "current"){

        filtered =

            allRequests.filter(
                request =>
                    !isOldRequest(request)
            );

    }

    else{

        filtered =

            allRequests.filter(
                request =>
                    isOldRequest(request)
            );

    }



    if(filtered.length === 0){

        requestsElement.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ${
                        currentTab === "current"
                        ? "🎁"
                        : "📦"
                    }

                </div>


                <h3>

                    ${
                        currentTab === "current"

                        ? "لا توجد طلبات حالية"

                        : "لا توجد طلبات قديمة"

                    }

                </h3>


                <p>

                    ${
                        currentTab === "current"

                        ? "عندما تطلب هدية ستظهر هنا"

                        : "الطلبات التي تم تسليمها أو رفضها ستظهر هنا"

                    }

                </p>

            </div>

        `;

        return;

    }



    requestsElement.innerHTML =

        filtered.map(
            request => {

                const status =
                    getStatusInfo(
                        request.status
                    );


                const giftName =

                    request.giftName ||

                    request.name ||

                    "هدية";


                const quantity =
                    Number(
                        request.quantity || 1
                    );


                const points =
                    Number(
                        request.points || 0
                    );


                const totalPoints =

                    Number(

                        request.totalPoints ||

                        (
                            points *
                            quantity
                        )

                    );


                const stage =

                    request.stage ||

                    "غير محددة";


                const grade =

                    request.grade ||

                    "غير محدد";


                const note =

                    request.adminNote ||

                    request.note ||

                    request.rejectionReason ||

                    "";


                return `

                    <article
                        class="request-card">


                        <div
                            class="request-top">


                            <div
                                class="gift-info">


                                ${renderGiftImage(
                                    request
                                )}


                                <div
                                    class="gift-details">


                                    <div
                                        class="gift-name">

                                        ${escapeHTML(
                                            giftName
                                        )}

                                    </div>


                                    <div
                                        class="order-id">

                                        رقم الطلب:

                                        ${escapeHTML(
                                            request.id
                                        )}

                                    </div>


                                </div>


                            </div>


                            <div
                                class="status ${status.className}">

                                ${status.text}

                            </div>


                        </div>



                        <div
                            class="details-grid">


                            <div
                                class="detail-box">

                                <div
                                    class="detail-label">

                                    🔢 الكمية

                                </div>

                                <div
                                    class="detail-value">

                                    ${quantity}

                                </div>

                            </div>



                            <div
                                class="detail-box">

                                <div
                                    class="detail-label">

                                    ⭐ سعر الهدية

                                </div>

                                <div
                                    class="detail-value points">

                                    ${points}

                                    نقطة

                                </div>

                            </div>



                            <div
                                class="detail-box">

                                <div
                                    class="detail-label">

                                    💰 إجمالي النقاط

                                </div>

                                <div
                                    class="detail-value points">

                                    ${totalPoints}

                                    نقطة

                                </div>

                            </div>

/* =========================================================
   LISTEN TO REQUESTS
========================================================= */

function listenToRequests(uid){

    console.log(
        "================================"
    );

    console.log(
        "بدء مراقبة طلبات الهدايا"
    );

    console.log(
        "Firebase UID:",
        uid
    );

    console.log(
        "================================"
    );


    /*
       مهم جدًا:

       هنا نبحث بالـ UID

       giftRequests
            ↓
       servantId
            ==
       Firebase Auth UID
    */


    const requestsQuery =

        db
        .collection("giftRequests")
        .where(
            "servantId",
            "==",
            uid
        );



    unsubscribeRequests =

        requestsQuery.onSnapshot(

            snapshot => {

                console.log(
                    "عدد الطلبات:",
                    snapshot.size
                );


                allRequests =

                    snapshot.docs.map(
                        doc => ({

                            id:
                                doc.id,

                            ...doc.data()

                        })
                    );


                /*
                    الأحدث أولًا
                */

                allRequests.sort(
                    (a,b) =>

                        getTimestamp(
                            b.createdAt
                        )

                        -

                        getTimestamp(
                            a.createdAt
                        )

                );


                updateStats();

                renderRequests();


                console.log(
                    "تم تحديث الطلبات مباشرة."
                );

            },


            error => {

                console.error(
                    "Firestore Error:",
                    error
                );


                requestsElement.innerHTML = `

                    <div class="error-box">

                        ❌ حدث خطأ أثناء تحميل الطلبات

                        <div class="error-details">

                            ${escapeHTML(
                                error.message
                            )}

                        </div>

                    </div>

                `;

            }

        );

}



/* =========================================================
   LOAD USER DATA
========================================================= */

async function loadUserData(user){

    try{

        const userRef =

            db
            .collection("users")
            .doc(user.uid);


        const userDoc =
            await userRef.get();


        if(userDoc.exists){

            const data =
                userDoc.data();


            userNameElement.textContent =

                data.fullName ||

                data.name ||

                user.displayName ||

                "المخدوم";


        }

        else{

            userNameElement.textContent =

                user.displayName ||

                "المخدوم";

        }


        userIdElement.textContent =

            "UID: " +
            user.uid;


        loginBadgeElement.textContent =
            "● مسجل الدخول";


        loginBadgeElement.style.background =
            "#ecfdf5";


        loginBadgeElement.style.color =
            "#047857";

    }

    catch(error){

        console.error(
            "خطأ في جلب بيانات المستخدم:",
            error
        );


        userNameElement.textContent =

            user.displayName ||

            "المخدوم";


        userIdElement.textContent =

            "UID: " +
            user.uid;

    }

}



/* =========================================================
   TABS
========================================================= */

document
.querySelectorAll(".tab")
.forEach(
    tab => {

        tab.addEventListener(
            "click",
            () => {


                document
                .querySelectorAll(".tab")
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                tab.classList.add(
                    "active"
                );


                currentTab =
                    tab.dataset.tab;


                renderRequests();

            }
        );

    }
);



/* =========================================================
   FIREBASE AUTH
========================================================= */

auth.onAuthStateChanged(
    async user => {


        console.log(
            "Firebase Auth User:",
            user
        );


        /* -----------------------------------------
           NOT LOGGED IN
        ----------------------------------------- */

        if(!user){

            currentUser = null;


            userNameElement.textContent =
                "غير مسجل الدخول";


            userIdElement.textContent =
                "";


            loginBadgeElement.textContent =
                "● غير مسجل الدخول";


            loginBadgeElement.style.background =
                "#fee2e2";


            loginBadgeElement.style.color =
                "#b91c1c";


            totalCountElement.textContent =
                "0";


            pendingCountElement.textContent =
                "0";


            acceptedCountElement.textContent =
                "0";


            requestsElement.innerHTML = `

                <div class="error-box">

                    ❌ لم يتم تسجيل الدخول.

                    <br><br>

                    سجل الدخول بحساب المخدوم
                    ثم افتح صفحة طلباتي مرة أخرى.

                </div>

            `;


            if(unsubscribeRequests){

                unsubscribeRequests();

                unsubscribeRequests = null;

            }


            return;

        }



        /* -----------------------------------------
           LOGGED IN
        ----------------------------------------- */

        currentUser = user;


        console.log(
            "المستخدم الحالي:",
            user.uid
        );


        /*
            عرض بيانات المستخدم
        */

        await loadUserData(user);


        /*
            مراقبة طلباته
        */

        listenToRequests(
            user.uid
        );

    }
);
