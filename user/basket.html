<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبي - متابعة الهدايا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 95px 20px; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 18px; }
    .header { background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(2, 132, 199, 0.05)); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 22px; padding: 20px; text-align: center; }
    .header h1 { color: #38bdf8; font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; }
    .header p { color: #94a3b8; font-size: 0.85rem; }
    .user-info-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px; padding: 14px 18px; font-size: 0.85rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 6px; }
    .user-info-box span { color: #38bdf8; font-weight: 700; }
    .order-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; }
    .gift-name { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .gift-info { font-size: 0.8rem; color: #94a3b8; }
    .status-badge { display: inline-block; padding: 5px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800; }
    .status-pending { color: #fbbf24; background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.3); }
    .status-approved { color: #38bdf8; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); }
    .status-delivered { color: #4ade80; background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-rejected { color: #ef4444; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); }
    .details-box { background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 10px 12px; font-size: 0.8rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 5px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .details-box span { color: #38bdf8; font-weight: 600; }
    .empty-state, .loading-state { text-align: center; color: #94a3b8; padding: 40px 20px; font-size: 0.95rem; }
    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px 5px; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #94a3b8; font-size: 0.65rem; font-weight: 600; gap: 3px; width: 25%; }
    .nav-item .nav-icon { font-size: 18px; }
    .nav-item.active { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎁 طلبات الهدايا</h1>
      <p id="userSubtitle">جاري التحقق من قاعدة البيانات...</p>
    </div>

    <!-- خانة بيانات المستخدم المسجل -->
    <div id="userInfoContainer"></div>

    <div id="ordersContainer">
      <div class="loading-state">جاري فحص البيانات وجلب الهدايا...</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span><span>الرئيسية</span>
    </a>
    <a href="store.html" class="nav-item">
      <span class="nav-icon">🎁</span><span>المعرض</span>
    </a>
    <a href="my-orders.html" class="nav-item active">
      <span class="nav-icon">📦</span><span>طلبي</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span><span>بروفايل</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. جلب اسم المستخدم من التخزين المحلي بكل الاحتمالات
      let loggedUser = localStorage.getItem("currentUsername") || 
                       localStorage.getItem("username") || 
                       localStorage.getItem("currentAdminUser") || 
                       localStorage.getItem("currentUser") || 
                       localStorage.getItem("userName") || 
                       localStorage.getItem("user") ||
                       localStorage.getItem("name");

      // إذا لم يكن هناك مسجل، نضعه افتراضياً للتجربة (يمكنك تعديله أو جعله يعتمد على تسجيل الدخول)
      if (!loggedUser) {
        loggedUser = "6tony mim"; 
      }

      console.log("الاسم المراد فحصه في قاعدة البيانات:", loggedUser);
      document.getElementById('userSubtitle').innerText = `حساب المستخدم: ${loggedUser}`;

      // 2. التحقق من وجود المستخدم في قاعدة البيانات وجلب بياناته وسلته
      verifyAndFetchUserData(loggedUser);
    });

    async function verifyAndFetchUserData(userId) {
      const userContainer = document.getElementById('userInfoContainer');
      const ordersContainer = document.getElementById('ordersContainer');

      try {
        // التحقق من وثيقة المستخدم في مجموعة users
        const userDocRef = db.collection("users").doc(userId);
        const userDoc = await userDocRef.get();

        if (!userDoc.exists) {
          // المستخدم غير مسجل في قاعدة البيانات بهذا الاسم
          userContainer.innerHTML = `
            <div class="user-info-box" style="border-color: rgba(239, 68, 68, 0.4);">
              <span>⚠️ تنبيه:</span> هذا المستخدم غير مسجل في قاعدة البيانات (Firestore).
            </div>
          `;
          ordersContainer.innerHTML = `
            <div class="empty-state">
              لا يمكن جلب الطلبات لعدم وجود حساب مطابق في قاعدة البيانات.
            </div>
          `;
          return;
        }

        // المستخدم موجود، جلب بياناته الأساسية
        const userData = userDoc.data();
        const fullName = userData.fullName || userId;
        const grade = userData.grade || "غير محدد";
        const stage = userData.stage || "غير محدد";
        const points = userData.points !== undefined ? userData.points : 0;

        // عرض تفاصيل بيانات المستخدم في الصفحة
        userContainer.innerHTML = `
          <div class="user-info-box">
            <div>👤 الاسم بالكامل: <span>${escapeHtml(fullName)}</span></div>
            <div>📚 الصف الدراسي: <span>${escapeHtml(grade)} (${escapeHtml(stage)})</span></div>
            <div>⭐ النقاط المتاحة: <span>${points} نقطة</span></div>
          </div>
        `;

        // 3. جلب تفاصيل الشراء (الهدايا الموجودة في سلة هذا المستخدم)
        const basketSnapshot = await userDocRef.collection("basket").get();
        
        let ordersList = [];
        if (!basketSnapshot.empty) {
          basketSnapshot.forEach(doc => {
            ordersList.push({ id: doc.id, ...doc.data() });
          });
        }

        if (ordersList.length === 0) {
          ordersContainer.innerHTML = `
            <div class="empty-state">
              المستخدم مسجل، لكن ليس لديه أي طلبات هدايا في السلة حالياً. 🛒<br>
              <a href="store.html" style="color: #38bdf8; text-decoration: underline; margin-top: 10px; display:inline-block;">اذهب إلى المعرض لاختيار هدية</a>
            </div>
          `;
          return;
        }

        // ترتيب الطلبات من الأحدث للأقدم
        ordersList.sort((a, b) => {
          const timeA = a.addedAt?.toMillis ? a.addedAt.toMillis() : 0;
          const timeB = b.addedAt?.toMillis ? b.addedAt.toMillis() : 0;
          return timeB - timeA;
        });

        ordersContainer.innerHTML = "";

        // بناء تفاصيل كل طلب شراء
        ordersList.forEach(order => {
          const giftName = order.name || "هدية بدون اسم";
          const count = order.count || 1;
          const itemPoints = order.points || 0;

          let statusBadge = `<span class="status-badge status-pending">جاري المراجعة 🔄</span>`;
          let detailsHtml = `<div>حالة الطلب: في انتظار مراجعة الخادم.</div>`;

          if (order.isRejected || order.status === 'rejected') {
            statusBadge = `<span class="status-badge status-rejected">تم الرفض ❌</span>`;
            detailsHtml = `<div>⚠️ تم رفض الطلب وإعادة النقاط لحسابك.</div>`;
          } else if (order.isDelivered === true || order.status === 'delivered') {
            statusBadge = `<span class="status-badge status-delivered">تم التسليم ✔️</span>`;
            
            let deliverTime = "وقت غير محدد";
            if (order.deliveredAt && order.deliveredAt.toDate) {
              deliverTime = order.deliveredAt.toDate().toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
            }
            let deliveredByText = order.deliveredByName || order.deliveredBy || "أحد خدام الكنيسة";

            detailsHtml = `
              <div>📅 وقت التسليم: <span>${deliverTime}</span></div>
              <div>👤 بواسطة: <span>${escapeHtml(deliveredByText)}</span></div>
            `;
          } else if (order.isApproved === true || order.approved === true || order.status === 'approved') {
            statusBadge = `<span class="status-badge status-approved">تمت الموافقة 🎁</span>`;
            
            let approveTime = "قريباً";
            if (order.approvedAt && order.approvedAt.toDate) {
              approveTime = order.approvedAt.toDate().toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
            }

            detailsHtml = `
              <div>✅ تمت الموافقة في: <span>${approveTime}</span></div>
              <div>💡 توجه لتستلم هديتك من الخادم المسؤول.</div>
            `;
          }

          const card = document.createElement("div");
          card.className = "order-card";
          card.innerHTML = `
            <div class="order-header">
              <div>
                <div class="gift-name">🎁 ${escapeHtml(giftName)}</div>
                <div class="gift-info">الكمية: ${count} | إجمالي التكلفة: ${itemPoints * count} نقطة ⭐</div>
              </div>
              <div>${statusBadge}</div>
            </div>
            <div class="details-box">
              ${detailsHtml}
            </div>
          `;

          ordersContainer.appendChild(card);
        });

      } catch (error) {
        console.error("خطأ أثناء جلب بيانات المستخدم أو الطلبات:", error);
        ordersContainer.innerHTML = `
          <div class="empty-state" style="color: #ef4444;">⚠️ حدث خطأ أثناء الاتصال بقاعدة البيانات.</div>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
