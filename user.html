<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>بوابة الكنيسة</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      font-family: "Cairo", sans-serif;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(0, 140, 255, .20),
          transparent 35%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(125, 60, 255, .22),
          transparent 35%
        ),

        #050816;
    }


    /* =========================
       BACKGROUND
    ========================= */

    .background {

      position: fixed;

      inset: 0;

      overflow: hidden;

      z-index: -10;
    }


    .orb {

      position: absolute;

      border-radius: 50%;

      filter: blur(80px);

      opacity: .45;

      animation:
        floatOrb 7s ease-in-out infinite;
    }


    .orb1 {

      width: 320px;

      height: 320px;

      background: #0077ff;

      left: -120px;

      top: -120px;
    }


    .orb2 {

      width: 360px;

      height: 360px;

      background: #7c3aed;

      right: -130px;

      bottom: -130px;

      animation-delay: 2s;
    }


    .orb3 {

      width: 180px;

      height: 180px;

      background: #06b6d4;

      right: 30%;

      top: 5%;

      opacity: .18;

      animation-delay: 4s;
    }


    @keyframes floatOrb {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-35px)
          scale(1.08);
      }

    }


    /* =========================
       SCENE
    ========================= */

    .scene {

      width: 440px;

      max-width: 92vw;

      height: 570px;

      perspective: 1400px;

      position: relative;
    }


    /* =========================
       CARD
    ========================= */

    .card {

      width: 100%;

      height: 100%;

      position: relative;

      transform-style: preserve-3d;

      transition:
        transform .25s ease;
    }


    /* =========================
       MAIN BOX
    ========================= */

    .main-box {

      width: 100%;

      height: 100%;

      padding: 45px 38px;

      border-radius: 34px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,.15),
          rgba(255,255,255,.035)
        );

      border:
        1px solid
        rgba(255,255,255,.16);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:

        0 40px 100px
        rgba(0,0,0,.55),

        inset 0 1px 1px
        rgba(255,255,255,.2);

      transform:
        translateZ(0);
    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      width: 100px;

      height: 100px;

      border-radius: 30px;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 48px;

      margin-bottom: 24px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,.25),
          rgba(255,255,255,.05)
        );

      border:
        1px solid
        rgba(255,255,255,.2);

      box-shadow:

        0 20px 45px
        rgba(0,0,0,.35),

        inset 0 2px 5px
        rgba(255,255,255,.2);

      transform:
        translateZ(45px);
    }


    /* =========================
       TITLE
    ========================= */

    h1 {

      font-size: 30px;

      font-weight: 900;

      margin-bottom: 8px;

      transform:
        translateZ(30px);
    }


    .subtitle {

      color: #aeb8d0;

      font-size: 13px;

      line-height: 2;

      margin-bottom: 30px;

      transform:
        translateZ(20px);
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      width: 100%;

      display: flex;

      flex-direction: column;

      gap: 16px;

      transform:
        translateZ(30px);
    }


    .choice {

      width: 100%;

      min-height: 85px;

      padding: 14px 18px;

      border-radius: 21px;

      border:
        1px solid
        rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.055);

      color: white;

      font-family: inherit;

      cursor: pointer;

      display: flex;

      align-items: center;

      text-align: right;

      gap: 16px;

      transition: .3s;

      box-shadow:

        0 12px 30px
        rgba(0,0,0,.18);
    }


    .choice:hover {

      transform:
        translateY(-5px)
        scale(1.015);

      border-color:
        rgba(56,189,248,.45);

      background:
        rgba(255,255,255,.09);

      box-shadow:

        0 20px 40px
        rgba(0,0,0,.30);
    }


    .icon {

      width: 55px;

      height: 55px;

      flex-shrink: 0;

      border-radius: 17px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 27px;

      background:
        rgba(56,189,248,.12);

      border:
        1px solid
        rgba(56,189,248,.15);
    }


    .text {

      flex: 1;
    }


    .title {

      display: block;

      font-size: 16px;

      font-weight: 900;

      margin-bottom: 3px;
    }


    .desc {

      display: block;

      color: #94a3b8;

      font-size: 11px;

      font-weight: 600;
    }


    .arrow {

      color: #38bdf8;

      font-size: 24px;

      transition: .3s;
    }


    .choice:hover .arrow {

      transform:
        translateX(-6px);
    }


    /* =========================
       FLOATING OBJECTS
    ========================= */

    .floating {

      position: absolute;

      width: 75px;

      height: 75px;

      border-radius: 22px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.1);

      backdrop-filter:
        blur(10px);

      box-shadow:

        0 20px 50px
        rgba(0,0,0,.25);

      animation:
        floating 5s ease-in-out infinite;

      pointer-events: none;
    }


    .floating1 {

      left: -105px;

      top: 80px;

      transform:
        rotate(15deg);
    }


    .floating2 {

      right: -105px;

      bottom: 90px;

      transform:
        rotate(-20deg);

      animation-delay: 1.5s;
    }


    @keyframes floating {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -20px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:600px) {

      .scene {

        width: 92vw;

        height: 550px;
      }


      .main-box {

        padding:
          35px 23px;
      }


      h1 {

        font-size: 25px;
      }


      .logo {

        width: 85px;

        height: 85px;

        font-size: 40px;
      }


      .floating {

        display: none;
      }

    }

  </style>

</head>


<body>


  <!-- BACKGROUND -->

  <div class="background">

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

  </div>



  <!-- MAIN -->

  <div class="scene" id="scene">

    <div class="floating floating1"></div>

    <div class="floating floating2"></div>


    <div class="card" id="card">

      <div class="main-box">


        <!-- LOGO -->

        <div class="logo">
          ⛪
        </div>


        <!-- TITLE -->

        <h1>
          أهلاً بك 👋
        </h1>


        <p class="subtitle">

          مرحباً بك في بوابة الكنيسة

          <br>

          اختر الطريقة التي تريد المتابعة بها

        </p>



        <!-- BUTTONS -->

        <div class="buttons">


          <!-- إنشاء حساب -->

          <button
            class="choice"
            id="createAccount"
            type="button"
          >

            <div class="icon">
              ✨
            </div>


            <div class="text">

              <span class="title">
                إنشاء حساب
              </span>

              <span class="desc">
                ليس لديك حساب؟ أنشئ حسابًا جديدًا
              </span>

            </div>


            <div class="arrow">
              ←
            </div>

          </button>



          <!-- لدي حساب -->

          <button
            class="choice"
            id="haveAccount"
            type="button"
          >

            <div class="icon">
              🔐
            </div>


            <div class="text">

              <span class="title">
                لدي حساب بالفعل
              </span>

              <span class="desc">
                سجل الدخول إلى حسابك
              </span>

            </div>


            <div class="arrow">
              ←
            </div>

          </button>


        </div>


      </div>

    </div>

  </div>



  <script>

    /* ================================
       BUTTONS
    ================================= */

    const createAccount =
      document.getElementById(
        "createAccount"
      );


    const haveAccount =
      document.getElementById(
        "haveAccount"
      );



    /* ================================
       إنشاء حساب
       
       ➜ n.html
    ================================= */

    createAccount.addEventListener(
      "click",
      () => {

        window.location.href =
          "n.html";

      }
    );



    /* ================================
       لدي حساب بالفعل
       
       ➜ t.html
    ================================= */

    haveAccount.addEventListener(
      "click",
      () => {

        window.location.href =
          "t.html";

      }
    );



    /* ================================
       3D MOUSE EFFECT
    ================================= */

    const scene =
      document.getElementById(
        "scene"
      );


    const card =
      document.getElementById(
        "card"
      );


    scene.addEventListener(
      "mousemove",
      (event) => {

        const rect =
          scene.getBoundingClientRect();


        const x =
          event.clientX -
          rect.left;


        const y =
          event.clientY -
          rect.top;


        const rotateY =
          ((x / rect.width) - .5)
          * 8;


        const rotateX =
          ((y / rect.height) - .5)
          * -8;


        card.style.transform =
          `
          rotateX(${rotateX}deg)
          rotateY(${rotateY}deg)
          translateZ(10px)
          `;

      }
    );


    scene.addEventListener(
      "mouseleave",
      () => {

        card.style.transform =
          "rotateX(0deg) rotateY(0deg)";

      }
    );

  </script>

</body>

</html>
