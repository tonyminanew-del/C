<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المستخدم - 3D Experience</title>
  <link rel="stylesheet" href="user.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس المباشر والمستقر -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="dark-body">

  <div class="dark-background">
    <div class="glow-orb orb-1 animate-orb"></div>
    <div class="glow-orb orb-2 animate-orb-delay"></div>
    <div class="grid-pattern"></div>
  </div>

  <main class="main-container auth-container 3d-perspective">

    <div class="card-3d-wrapper" id="cardWrapper">
      <div class="glass-auth-card-3d fall-down-3d">
        
        <div class="layer-3d logo-layer">
          <div class="logo-badge-3d">⛪</div>
        </div>

        <div class="layer-3d text-layer">
          <h1>بوابة المستخدم / الخادم</h1>
          <p>سجل دخولك بحساب Google للمتابعة للخدمة والافتقاد</p>
        </div>

        <div class="layer-3d button-layer">
          <button id="googleLoginBtn" class="google-btn-3d">
            <svg class="google-icon" viewBox="0 0 24 24" width="22" height="22">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.19v3.15C3.17 21.36 7.22 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.19C.43 8.15 0 9.89 0 12s.43 3.85 1.19 5.4l4.09-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.64 1.19 6.6l4.09 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
            </svg>
            <span>تسجيل الدخول باستخدام Google</span>
          </button>
        </div>

        <div id="statusMessage" class="status-message"></div>

      </div>
    </div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    // تهيئة فايربيس
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    const loginBtn = document.getElementById('googleLoginBtn');
    const statusMsg = document.getElementById('statusMessage');

    // تأثير حركة الماوس 3D
    const card = document.querySelector('.glass-auth-card-3d');
    const wrapper = document.getElementById('cardWrapper');

    if (wrapper && card) {
      wrapper.addEventListener('mousemove', (e) => {
        const rect = wrapper.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        card.style.transform = `rotateX(${(-y / rect.height) * 25}deg) rotateY(${(x / rect.width) * 25}deg)`;
      });

      wrapper.addEventListener('mouseleave', () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg)`;
      });
    }

    // متابعة حالة تسجيل الدخول تلقائياً
    auth.onAuthStateChanged((user) => {
      if (user) {
        statusMsg.style.color = "#4ade80";
        statusMsg.innerText = `تم الدخول بنجاح! مرحباً ${user.displayName}`;
      }
    });

    // عند الضغط على الزر
    loginBtn.addEventListener('click', () => {
      statusMsg.style.color = "#38bdf8";
      statusMsg.innerText = "جاري البدء...";

      auth.signInWithPopup(provider)
        .then((result) => {
          statusMsg.style.color = "#4ade80";
          statusMsg.innerText = `تم الدخول بنجاح! مرحباً ${result.user.displayName}`;
        })
        .catch((error) => {
          console.warn("Popup blocked/failed, trying redirect...", error);
          // في حال فشل النافذة المنبثقة يتم التحويل تلقائياً
          auth.signInWithRedirect(provider);
        });
    });
  </script>

</body>
</html>
