<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال إشعار - Dark 3D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f111a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .card {
            background: #1a1c29;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid #2a2e43;
            transform: perspective(1000px);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px) perspective(1000px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 
                        0 0 20px rgba(0, 230, 118, 0.2);
            border-color: #00e676;
        }
        h2 {
            margin-top: 0;
            color: #fff;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #a0aec0;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #2a2e43;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background: #12141d;
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #00e676;
            background: #161922;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(0, 230, 118, 0.3);
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
            color: #0f111a;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(0, 230, 118, 0.3);
            transition: all 0.2s ease;
        }
        button:hover {
            opacity: 0.95;
            box-shadow: 0 12px 25px rgba(0, 230, 118, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }
        #status {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إرسال إشعار 3D</h2>
        
        <label for="targetType">إرسال إلى:</label>
        <select id="targetType">
            <option value="all">جميع المخدومين (الكل)</option>
            <option value="primary">إبتدائي</option>
            <option value="prep">إعدادي</option>
            <option value="secondary">ثانوي</option>
            <option value="specific">مخدوم محدد</option>
        </select>

        <div id="specificUserContainer" class="hidden">
            <label for="userSelect">اختر المخدوم:</label>
            <select id="userSelect">
                <option value="">جاري تحميل الأسماء...</option>
            </select>
        </div>

        <label for="titleInput">عنوان الإشعار:</label>
        <input type="text" id="titleInput" placeholder="اكتب العنوان هنا...">

        <label for="bodyInput">نص الإشعار:</label>
        <textarea id="bodyInput" placeholder="اكتب تفاصيل الإشعار هنا..."></textarea>

        <button id="sendBtn">إرسال الإشعار</button>
        <p id="status"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
            authDomain: "church-7afe1.firebaseapp.com",
            projectId: "church-7afe1",
            storageBucket: "church-7afe1.firebasestorage.app",
            messagingSenderId: "1072334615357",
            appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
            measurementId: "G-E7Q76Z53SB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const targetType = document.getElementById('targetType');
        const specificUserContainer = document.getElementById('specificUserContainer');
        const userSelect = document.getElementById('userSelect');
        const sendBtn = document.getElementById('sendBtn');
        const titleInput = document.getElementById('titleInput');
        const bodyInput = document.getElementById('bodyInput');
        const status = document.getElementById('status');

        targetType.addEventListener('change', (e) => {
            if (e.target.value === 'specific') {
                specificUserContainer.classList.remove('hidden');
                loadUsers();
            } else {
                specificUserContainer.classList.add('hidden');
            }
        });

        async function loadUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                userSelect.innerHTML = "";
                
                if (querySnapshot.empty) {
                    userSelect.innerHTML = '<option value="">لا يوجد مخدومين مسجلين</option>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const displayName = data.fullName || data.username || doc.id;
                    
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = displayName;
                    userSelect.appendChild(option);
                });
            } catch (error) {
                console.error("خطأ في جلب المستخدمين: ", error);
                userSelect.innerHTML = '<option value="">خطأ في تحميل الأسماء</option>';
            }
        }

        sendBtn.addEventListener('click', async () => {
            const targetValue = targetType.value;
            const titleValue = titleInput.value.trim();
            const bodyValue = bodyInput.value.trim();
            let selectedUserId = null;
            let selectedUserName = null;

            if (!titleValue || !bodyValue) {
                status.style.color = "#ff5252";
                status.textContent = "الرجاء إدخال العنوان ونَص الإشعار معاً!";
                return;
            }

            if (targetValue === 'specific') {
                selectedUserId = userSelect.value;
                const selectedOption = userSelect.options[userSelect.selectedIndex];
                selectedUserName = selectedOption ? selectedOption.textContent : "";

                if (!selectedUserId) {
                    status.style.color = "#ff5252";
                    status.textContent = "الرجاء اختيار مخدوم محدد!";
                    return;
                }
            }

            try {
                await addDoc(collection(db, "myNewCollection"), {
                    targetType: targetValue,
                    targetUserId: selectedUserId,
                    targetUserName: selectedUserName,
                    title: titleValue,
                    body: bodyValue,
                    createdAt: new Date()
                });

                status.style.color = "#00e676";
                status.textContent = "تم إرسال وحفظ الإشعار بنجاح! 🚀";
                
                titleInput.value = "";
                bodyInput.value = "";
            } catch (error) {
                console.error("خطأ أثناء الإرسال: ", error);
                status.style.color = "#ff5252";
                status.textContent = "حدث خطأ، تحقق من الصلاحيات أو الـ Console.";
            }
        });
    </script>

</body>
</html>
