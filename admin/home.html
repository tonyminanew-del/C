<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الرئيسية - لوحة الخادم</title>

  <!-- Cairo -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px;
      overflow-x: hidden;
    }

    /* =====================================================
       الإشعارات
    ===================================================== */

    #notifications-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      width: 92%;
      max-width: 450px;
      pointer-events: none;
    }

    .notif-box {
      position: relative;

      background: rgba(15, 23, 42, 0.97);

      border: 1px solid #00b894;
      border-right: 6px solid #00b894;

      padding: 16px 18px;

      margin-bottom: 12px;

      border-radius: 16px;

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(0, 184, 148, 0.15);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      animation: notificationIn 0.45s ease;

      pointer-events: auto;
    }

    .notif-box h4 {
      color: #00d6a7;
      font-size: 17px;
      font-weight: 900;
      margin: 0 0 7px;
    }

    .notif-box p {
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.8;
      margin: 0;
    }

    .notif-close {
      position: absolute;
      top: 7px;
      left: 9px;

      width: 28px;
      height: 28px;

      border: none;
      background: transparent;

      color: #94a3b8;

      font-size: 18px;
      cursor: pointer;
    }

    .notif-close:hover {
      color: white;
    }

    @keyframes notificationIn {
      from {
        opacity: 0;
        transform: translateY(-35px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes notificationOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-25px);
      }
    }

    /* =====================================================
       الحاوية
    ===================================================== */

    .container {
      width: 100%;
      max-width: 500px;

      display: flex;
      flex-direction: column;

      gap: 20px;
    }

    /* =====================================================
       كارت الترحيب
    ===================================================== */

    .welcome-card {
      background:
        linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.15),
          rgba(2, 132, 199, 0.05)
        );

      border: 1px solid rgba(56, 189, 248, 0.3);

      border-radius: 24px;

      padding: 20px;

      display: flex;
      align-items: center;

      gap: 15px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .avatar-box {
      width: 60px;
      height: 60px;

      border-radius: 50%;

      background: rgba(56, 189, 248, 0.2);

      border: 2px solid #38bdf8;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 28px;

      overflow: hidden;

      flex-shrink: 0;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .welcome-info h3 {
      font-size: 0.85rem;

      color: #94a3b8;

      font-weight: 600;
    }

    .welcome-info h2 {
      font-size: 1.2rem;

      font-weight: 800;

      color: #38bdf8;

      margin-top: 2px;
    }

    /* =====================================================
       الاختصارات
    ===================================================== */

    .quick-access-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;
    }

    .shortcut-card {
      background:
        rgba(255, 255, 255, 0.04);

      border:
        1px solid rgba(255, 255, 255, 0.12);

      border-radius: 20px;

      padding: 20px 15px;

      text-align: center;

      text-decoration: none;

      color: #fff;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        all 0.3s ease;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;
    }

    .shortcut-card.full-width {
      grid-column: span 2;

      flex-direction: row;

      justify-content: center;

      padding: 16px 20px;

      gap: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.08),
          rgba(255, 255, 255, 0.03)
        );
    }

    .shortcut-card:hover {
      transform: translateY(-3px);

      border-color: #38bdf8;

      box-shadow:
        0 10px 20px
        rgba(56, 189, 248, 0.15);
    }

    .shortcut-icon {
      font-size: 32px;
    }

    .shortcut-card.full-width .shortcut-icon {
      font-size: 26px;
    }

    .shortcut-title {
      font-size: 0.95rem;

      font-weight: 700;
    }

    /* =====================================================
       الشريط السفلي
    ===================================================== */

    .bottom-nav {
      position: fixed;

      bottom: 15px;

      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 30px);

      max-width: 450px;

      background:
        rgba(15, 23, 42, 0.9);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border:
        1px solid rgba(255, 255, 255, 0.15);

      border-radius: 25px;

      display: flex;

      justify-content: space-around;

      align-items: center;

      padding: 10px 5px;

      box-shadow:
        0 20px 40px
        rgba(0, 0, 0, 0.7);

      z-index: 100;
    }

    .nav-item {
      display: flex;

      flex-direction: column;

      align-items: center;

      text-decoration: none;

      color: #94a3b8;

      font-size: 0.65rem;

      font-weight: 600;

      gap: 3px;

      transition:
        all 0.3s ease;

      width: 20%;
    }

    .nav-item .nav-icon {
      font-size: 18px;

      transition:
        transform 0.3s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon,
    .nav-item.active .nav-icon {
      transform:
        translateY(-3px);
    }

    /* =====================================================
       رسالة الخطأ
    ===================================================== */

    .firebase-error {
      position: fixed;

      bottom: 90px;

      left: 50%;

      transform: translateX(-50%);

      width: 90%;

      max-width: 450px;

      background: #7f1d1d;

      border: 1px solid #ef4444;

      color: white;

      padding: 12px;

      border-radius: 12px;

      text-align: center;

      z-index: 999999;

      display: none;
    }
  </style>
</head>

<body>

      </div>

    </div>


    <!-- الاختصارات -->

    <div class="quick-access-grid">

      <a

        <span class="shortcut-icon">

      <a

      <a

      <a
        href="notifications-user.html"

        <span class="shortcut-icon">
          🔔
        </span>

        <span class="shortcut-title">

      </a>


      <a
        href="notifications.html"

        style="

          linear-gradient(

            rgba(0,184,148,0.08),

          border-color:
          rgba(0,184,148,0.3);

        <span class="shortcut-icon">

        </span>

        <span class="shortcut-title">
          إشعار المستخدم

  <!-- =====================================================

  <nav class="bottom-nav">

      <span class="nav-icon">

  <!-- =====================================================
       JavaScript
  ====================================================== -->

  <script>

    /* =====================================================
       Firebase Config
    ====================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",

      authDomain:
        "church-7afe1.firebaseapp.com",

      projectId:
        "church-7afe1",

      storageBucket:
        "church-7afe1.firebasestorage.app",

      messagingSenderId:
        "1072334615357",

      appId:
        "1:1072334615357:web:c03b199f00ea9d19d40b54",

      measurementId:
        "G-E7Q76Z53SB"
    };


    /* =====================================================
       تشغيل Firebase
    ====================================================== */

    try {

      if (!firebase.apps.length) {

        firebase.initializeApp(
          firebaseConfig
        );

      }

    } catch (error) {

      console.error(
        "Firebase initialization error:",
        error
      );

      showFirebaseError(
        "حدث خطأ في تشغيل Firebase"
      );
    }


    const db =
      firebase.firestore();


    /* =====================================================
       عند تحميل الصفحة
    ====================================================== */

    window.addEventListener(
      "DOMContentLoaded",
      async function () {

        const currentUsername =
          localStorage.getItem(
            "currentUsername"
          );

        const userRole =
          localStorage.getItem(
            "userRole"
          );


        /* تسجيل الدخول */

        if (!currentUsername) {

          window.location.href =
            "../t.html";

          return;
        }


        /* تحميل بيانات الخادم */

        await loadServantData(
          currentUsername,
          userRole
        );


        /*
          تشغيل إشعارات طلبات الهدايا
        */

        startGiftRequestNotifications();

      }
    );


    /* =====================================================
       تحميل بيانات المستخدم
    ====================================================== */

    async function loadServantData(
      currentUsername,
      userRole
    ) {

      try {

        let collectionName =
          userRole === "admin"
            ? "admins"
            : "users";


        let docRef =
          db
            .collection(collectionName)
            .doc(currentUsername);


        let docSnap =
          await docRef.get();


        /*
          لو لم يجد الحساب في المجموعة
          يجرب المجموعة الثانية
        */

        if (!docSnap.exists) {

          collectionName =
            collectionName === "admins"
              ? "users"
              : "admins";


          docRef =
            db
              .collection(collectionName)
              .doc(currentUsername);


          docSnap =
            await docRef.get();

        }


        if (docSnap.exists) {

          const data =
            docSnap.data();


          const title =
            data.title || "";


          const name =
            data.fullName ||
            data.username ||
            currentUsername;


          const displayName =
            title
              ? `${title} / ${name}`
              : name;


          document
            .getElementById(
              "servantDisplayName"
            )
            .innerText =
              displayName;


          /*
            الصورة
          */

          if (data.photo) {

            document
              .getElementById(
                "servantAvatar"
              )
              .innerHTML = `
                <img
                  src="${data.photo}"
                  alt="Servant"
                >
              `;

          }

        } else {

          document
            .getElementById(
              "servantDisplayName"
            )
            .innerText =
              currentUsername;

        }

      } catch (error) {

        console.error(
          "Error loading servant data:",
          error
        );

        document
          .getElementById(
            "servantDisplayName"
          )
          .innerText =
            currentUsername;
      }

    }


    /* =====================================================
       إشعارات طلبات الهدايا
    ====================================================== */

    function startGiftRequestNotifications() {

      console.log(
        "🔔 بدء الاستماع لإشعارات طلبات الهدايا..."
      );


      db.collection(
        "myNewCollection"
      )
      .where(
        "type",
        "==",
        "gift_request"
      )
      .onSnapshot(

        function (snapshot) {

          console.log(
            "📩 تم تحديث الإشعارات:",
            snapshot.size
          );


          snapshot
            .docChanges()
            .forEach(
              function (change) {

                /*
                  نريد الإشعارات الجديدة فقط
                */

                if (
                  change.type !== "added"
                ) {

                  return;
                }


                const data =
                  change.doc.data();


                /*
                  منع تكرار نفس الإشعار
                  عند Refresh
                */

                const notificationKey =
                  "shownGiftNotification_" +
                  change.doc.id;


                if (
                  localStorage.getItem(
                    notificationKey
                  )
                ) {

                  return;
                }


                /*
                  حفظ أنه ظهر
                */

                localStorage.setItem(
                  notificationKey,
                  "true"
                );


                /*
                  بيانات الطلب
                */

                const servantName =
                  data.servantName ||
                  extractServantName(
                    data.body
                  ) ||
                  "مخدوم";


                const giftName =
                  data.giftName ||
                  "هدية";


                /*
                  عرض الإشعار
                */

                showNotificationUI(

                  "🔔 طلب هدية جديد",

                  `المخدوم ${servantName} طلب هدية (${giftName}) 🎁`

                );

              }
            );

        },

        function (error) {

          console.error(
            "❌ خطأ في إشعارات طلبات الهدايا:",
            error
          );


          showFirebaseError(
            "لم يتم الاتصال بإشعارات طلبات الهدايا"
          );

        }

      );

    }


    /* =====================================================
       استخراج اسم المخدوم من body
       في حالة Cloud Function قديمة
    ====================================================== */

    function extractServantName(body) {

      if (!body) return "";


      const text =
        String(body);


      /*
        مثال:

        توني طلب هدية (كتاب مقدس)
      */

      let match =
        text.match(
          /(?:المخدوم\s+)?(.+?)\s+طلب\s+هدية/
        );


      if (
        match &&
        match[1]
      ) {

        return match[1].trim();

      }


      return "";

    }


    /* =====================================================
       إظهار الإشعار
    ====================================================== */

    function showNotificationUI(
      title,
      body
    ) {

      const container =
        document.getElementById(
          "notifications-container"
        );


      if (!container) {

        return;
      }


      const alertBox =
        document.createElement(
          "div"
        );


      alertBox.className =
        "notif-box";


      alertBox.innerHTML = `

        <button
          class="notif-close"
          aria-label="إغلاق">
          ✕
        </button>

        <h4>
          ${escapeHtml(title)}
        </h4>

        <p>
          ${escapeHtml(body)}
        </p>

      `;


      /*
        زر الإغلاق
      */

      alertBox
        .querySelector(
          ".notif-close"
        )
        .addEventListener(
          "click",
          function () {

            alertBox.remove();

          }
        );


      container.appendChild(
        alertBox
      );


      /*
        اختفاء تلقائي
      */

      setTimeout(
        function () {

          if (
            !alertBox.parentNode
          ) {

            return;
          }


          alertBox.style.animation =
            "notificationOut 0.35s ease forwards";


          setTimeout(
            function () {

              alertBox.remove();

            },
            350
          );

        },
        7000
      );

    }


    /* =====================================================
       حماية النص
    ====================================================== */

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       رسالة خطأ Firebase
    ====================================================== */

    function showFirebaseError(
      message
    ) {

      const box =
        document.getElementById(
          "firebase-error"
        );


      if (!box) return;


      box.innerText =
        message;


      box.style.display =
        "block";


      setTimeout(
        function () {

          box.style.display =
            "none";

        },
        5000
      );

    }

  </script>

</body>
