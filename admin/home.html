<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>طلباتي - متجر الهدايا</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:"Cairo",sans-serif;

    min-height:100vh;

    background:
        radial-gradient(
            circle at top right,
            #e0e7ff,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            #f3e8ff,
            transparent 35%
        ),
        #f8fafc;

    color:#172033;

}


/* ================================
   HEADER
================================ */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:rgba(255,255,255,.95);

    backdrop-filter:blur(18px);

    border-bottom:1px solid #e5e7eb;

    box-shadow:
        0 8px 30px rgba(15,23,42,.07);

}


.header-inner{

    width:min(
        1100px,
        calc(100% - 30px)
    );

    margin:auto;

    min-height:80px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:13px;

}


.brand-icon{

    width:55px;

    height:55px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 10px 25px
        rgba(99,102,241,.25);

}


.brand h1{

    font-size:21px;

    font-weight:900;

}


.brand p{

    margin-top:1px;

    color:#64748b;

    font-size:12px;

}


.live{

    display:flex;

    align-items:center;

    gap:8px;

    background:#ecfdf5;

    color:#047857;

    padding:8px 13px;

    border-radius:30px;

    font-size:12px;

    font-weight:800;

}


.live-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#10b981;

}


/* ================================
   CONTAINER
================================ */

.container{

    width:min(
        1000px,
        calc(100% - 25px)
    );

    margin:30px auto 60px;

}


.welcome{

    margin-bottom:25px;

}


.welcome h2{

    font-size:28px;

    font-weight:900;

}


.welcome p{

    margin-top:5px;

    color:#64748b;

    font-size:14px;

}


/* ================================
   USER BOX
================================ */

.user-box{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:20px;

    padding:16px 18px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 10px 28px
        rgba(15,23,42,.05);

}


.user-name{

    font-size:17px;

    font-weight:900;

}


.user-username{

    margin-top:3px;

    color:#94a3b8;

    font-size:11px;

}


.auth-status{

    background:#ecfdf5;

    color:#047857;

    border-radius:30px;

    padding:7px 13px;

    font-size:11px;

    font-weight:800;

}


/* ================================
   STATS
================================ */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;

}


.stat{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:20px;

    padding:18px;

    box-shadow:
        0 10px 28px
        rgba(15,23,42,.06);

}


.stat-title{

    color:#64748b;

    font-size:12px;

    font-weight:700;

}


.stat-number{

    margin-top:4px;

    font-size:28px;

    font-weight:900;

}


/* ================================
   TABS
================================ */

.tabs{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:6px;

    display:flex;

    gap:6px;

    margin-bottom:20px;

    box-shadow:
        0 8px 25px
        rgba(15,23,42,.05);

}


.tab{

    flex:1;

    border:none;

    background:transparent;

    padding:12px;

    border-radius:13px;

    font-family:inherit;

    font-weight:800;

    color:#64748b;

    cursor:pointer;

    transition:.2s;

}


.tab:hover{

    background:#f1f5f9;

}


.tab.active{

    background:#6366f1;

    color:white;

    box-shadow:
        0 7px 18px
        rgba(99,102,241,.22);

}


/* ================================
   REQUESTS
================================ */

#requests{

    display:grid;

    gap:17px;

}


.request-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:23px;

    padding:20px;

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.07);

    animation:
        cardShow .3s ease;

}


@keyframes cardShow{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.request-header{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;

}


.gift-info{

    display:flex;

    align-items:center;

    gap:13px;

}


.gift-image{

    width:70px;

    height:70px;

    border-radius:18px;

    overflow:hidden;

    flex-shrink:0;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f5f3ff
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

}


.gift-image img{

    width:100%;

    height:100%;

    object-fit:cover;

}


.gift-name{

    font-size:19px;

    font-weight:900;

}


.request-id{

    color:#94a3b8;

    font-size:10px;

    margin-top:2px;

    direction:ltr;

}


.status{

    padding:8px 14px;

    border-radius:30px;

    font-size:12px;

    font-weight:900;

    white-space:nowrap;

}


.status.pending{

    background:#fef3c7;

    color:#92400e;

}


.status.accepted{

    background:#d1fae5;

    color:#047857;

}


.status.rejected{

    background:#fee2e2;

    color:#b91c1c;

}


.status.delivered{

    background:#dbeafe;

    color:#1d4ed8;

}


/* ================================
   DETAILS
================================ */

.details{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

}


.detail{

    background:#f8fafc;

    border-radius:14px;

    padding:13px;

}


.detail-label{

    color:#64748b;

    font-size:11px;

    font-weight:700;

    margin-bottom:3px;

}


.detail-value{

    color:#111827;

    font-size:14px;

    font-weight:800;

    word-break:break-word;

}


.points{

    color:#7c3aed;

}


/* ================================
   FOOTER
================================ */

.request-footer{

    border-top:
        1px solid #eef2f7;

    margin-top:16px;

    padding-top:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.date{

    color:#64748b;

    font-size:11px;

    font-weight:600;

}


.note{

    background:#f8fafc;

    color:#475569;

    border-radius:10px;

    padding:8px 12px;

    font-size:12px;

    font-weight:700;

}


/* ================================
   EMPTY
================================ */

.empty{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:22px;

    padding:60px 20px;

    text-align:center;

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.05);

}


.empty-icon{

    font-size:55px;

    margin-bottom:10px;

}


.empty h3{

    font-size:20px;

    font-weight:900;

    color:#334155;

}


.empty p{

    margin-top:6px;

    color:#64748b;

    font-size:13px;

}


/* ================================
   ERROR
================================ */

.error{

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#b91c1c;

    border-radius:18px;

    padding:20px;

    text-align:center;

    font-weight:800;

}


.loading{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:20px;

    padding:40px;

    text-align:center;

    color:#64748b;

    font-weight:800;

}


/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    .stats{

        grid-template-columns:1fr;

    }


    .request-header{

        flex-direction:column;

    }


    .details{

        grid-template-columns:1fr;

    }


    .request-footer{

        flex-direction:column;

        align-items:stretch;

    }


    .live{

        display:none;

    }


    .user-box{

        align-items:flex-start;

        flex-direction:column;

    }

}


@media(max-width:450px){

    .brand-icon{

        width:48px;

        height:48px;

        font-size:23px;

    }


    .brand h1{

        font-size:18px;

    }


    .container{

        margin-top:20px;

    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">


    <div class="brand">

        <div class="brand-icon">

            🎁

        </div>


        <div>

            <h1>

                طلباتي

            </h1>


            <p>

                متابعة طلبات الهدايا

            </p>

        </div>

    </div>


    <div class="live">

        <span class="live-dot"></span>

        تحديث مباشر

    </div>


</div>

</header>



<main class="container">


<div class="welcome">

    <h2>

        🎁 طلبات الهدايا

    </h2>


    <p>

        تابع حالة طلبات الهدايا الخاصة بك

    </p>

</div>



<!-- معلومات المستخدم -->

<div class="user-box">


    <div>

        <div
            id="userName"
            class="user-name">

            جاري تحميل بياناتك...

        </div>


        <div
            id="userUsername"
            class="user-username">

        </div>

    </div>


    <div class="auth-status">

        ● مسجل الدخول

    </div>


</div>



<!-- الإحصائيات -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">

            كل الطلبات

        </div>


        <div
            id="totalCount"
            class="stat-number">

            0

        </div>

    </div>



    <div class="stat">

        <div class="stat-title">

            قيد المراجعة

        </div>


        <div
            id="pendingCount"
            class="stat-number">

            0

        </div>

    </div>



    <div class="stat">

        <div class="stat-title">

            تم القبول

        </div>


        <div
            id="acceptedCount"
            class="stat-number">

            0

        </div>

    </div>

</div>



<!-- التبويبات -->

<div class="tabs">


    <button
        class="tab active"
        data-tab="current">

        الطلبات الحالية

    </button>


    <button
        class="tab"
        data-tab="old">

        الطلبات القديمة

    </button>


</div>



<!-- الطلبات -->

<div id="requests">

    <div class="loading">

        ⏳ جاري تحميل طلباتك...

    </div>

</div>


</main>



<script>

/* ======================================================
   FIREBASE
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",

    authDomain:
        "church-7afe1.firebaseapp.com",

    projectId:
        "church-7afe1",

    storageBucket:
        "church-7afe1.firebasestorage.app",

    messagingSenderId:
        "1072334615357",

    appId:
        "1:1072334615357:web:c03b199f00ea9d19d40b54",

    measurementId:
        "G-E7Q76Z53SB"

};


if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}


const db =
    firebase.firestore();



/* ======================================================
   ELEMENTS
====================================================== */

const requestsContainer =
    document.getElementById("requests");


const totalCount =
    document.getElementById("totalCount");


const pendingCount =
    document.getElementById("pendingCount");


const acceptedCount =
    document.getElementById("acceptedCount");


const userName =
    document.getElementById("userName");


const userUsername =
    document.getElementById("userUsername");



/* ======================================================
   CURRENT USER
====================================================== */

const currentUsername =
    localStorage.getItem("currentUsername");


/*
   لو مفيش مستخدم في localStorage
   نرجعه لصفحة الدخول
*/

if(!currentUsername){

    window.location.href =
        "../index.html";

}



/* ======================================================
   DATA
====================================================== */

let requests = [];

let currentTab = "current";



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



/* ======================================================
   DATE
====================================================== */

function formatDate(timestamp){

    if(!timestamp){

        return "غير محدد";

    }


    try{

        let date;


        if(
            timestamp &&
            typeof timestamp.toDate === "function"
        ){

            date =
                timestamp.toDate();

        }

        else{

            date =
                new Date(timestamp);

        }


        if(
            isNaN(date.getTime())
        ){

            return "غير محدد";

        }


        return new Intl.DateTimeFormat(
            "ar-EG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        ).format(date);

    }

    catch(error){

        return "غير محدد";

    }

}



/* ======================================================
   STATUS
====================================================== */

function getStatus(status){

    switch(status){

        case "accepted":

            return {

                text:"✅ تم قبول الطلب",

                className:"accepted"

            };


        case "rejected":

            return {

                text:"❌ تم رفض الطلب",

                className:"rejected"

            };


        case "delivered":

            return {

                text:"📦 تم التسليم",

                className:"delivered"

            };


        default:

            return {

                text:"⏳ قيد المراجعة",

                className:"pending"

            };

    }

}



/* ======================================================
   OLD REQUEST
====================================================== */

function isOldRequest(request){

    return (

        request.status === "rejected" ||

        request.status === "delivered"

    );

}



/* ======================================================
   UPDATE STATS
====================================================== */

function updateStats(){

    totalCount.textContent =
        requests.length;


    pendingCount.textContent =

        requests.filter(
            request =>

                !request.status ||

                request.status === "pending"

        ).length;


    acceptedCount.textContent =

        requests.filter(
            request =>

                request.status === "accepted"

        ).length;

}



/* ======================================================
   GIFT IMAGE
====================================================== */

function giftImage(request){

    const image =

        request.giftImage ||

        request.image ||

        request.photo ||

        "";


    if(image){

        return `

            <div class="gift-image">

                <img
                    src="${escapeHTML(image)}"
                    alt="الهدية"
                    onerror="this.style.display='none'">

            </div>

        `;

    }


    return `

        <div class="gift-image">

            🎁

        </div>

    `;

}



/* ======================================================
   RENDER
====================================================== */

function renderRequests(){

    let filteredRequests;


    if(currentTab === "current"){

        filteredRequests =

            requests.filter(
                request =>
                    !isOldRequest(request)
            );

    }

    else{

        filteredRequests =

            requests.filter(
                request =>
                    isOldRequest(request)
            );

    }



    if(filteredRequests.length === 0){

        requestsContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ${
                        currentTab === "current"
                        ? "🎁"
                        : "📦"
                    }

                </div>


                <h3>

                    ${
                        currentTab === "current"
                        ? "لا توجد طلبات حالية"
                        : "لا توجد طلبات قديمة"
                    }

                </h3>


                <p>

                    ${
                        currentTab === "current"
                        ? "عندما تطلب هدية ستظهر هنا"
                        : "الطلبات القديمة ستظهر هنا"
                    }

                </p>

            </div>

        `;

        return;

    }



    requestsContainer.innerHTML =

        filteredRequests.map(
            request => {


            const status =
                getStatus(
                    request.status
                );


            const giftName =

                request.giftName ||

                request.name ||

                "هدية";


            const quantity =

                Number(
                    request.quantity || 1
                );


            const points =

                Number(
                    request.points || 0
                );


            const totalPoints =

                Number(
                    request.totalPoints ||
                    (points * quantity)
                );


            const stage =

                request.stage ||

                "غير محددة";


            const grade =

                request.grade ||

                "غير محدد";


            const note =

                request.adminNote ||

                request.note ||

                request.rejectionReason ||

                "";


            return `

<article class="request-card">


    <div class="request-header">


        <div class="gift-info">


            ${giftImage(request)}


            <div>

                <div class="gift-name">

                    ${escapeHTML(giftName)}

                </div>


                <div class="request-id">

                    رقم الطلب:

                    ${escapeHTML(request.id)}

                </div>

            </div>


        </div>



        <div class="status ${status.className}">

            ${status.text}

        </div>


    </div>



    <div class="details">


        <div class="detail">

            <div class="detail-label">

                🔢 الكمية

            </div>


            <div class="detail-value">

                ${quantity}

            </div>

        </div>



        <div class="detail">

            <div class="detail-label">

                ⭐ سعر الهدية

            </div>


            <div class="detail-value points">

                ${points}

                نقطة

            </div>

        </div>



        <div class="detail">

            <div class="detail-label">

                💰 إجمالي النقاط

            </div>


            <div class="detail-value points">

                ${totalPoints}

                نقطة

            </div>

        </div>



        <div class="detail">

            <div class="detail-label">

                📚 المرحلة

            </div>


            <div class="detail-value">

                ${escapeHTML(stage)}

            </div>

        </div>



        <div class="detail">

            <div class="detail-label">

                🏫 الصف

            </div>


            <div class="detail-value">

                ${escapeHTML(grade)}

            </div>

        </div>



        <div class="detail">

            <div class="detail-label">

                🕐 تاريخ الطلب

            </div>


            <div class="detail-value">

                ${formatDate(
                    request.createdAt
                )}

            </div>

        </div>


    </div>



    <div class="request-footer">


        <div class="date">

            📅

            ${formatDate(
                request.createdAt
            )}

        </div>


        ${
            note

            ?

            `

            <div class="note">

                📝

                ${escapeHTML(note)}

            </div>

            `

            :

            ""

        }


    </div>


</article>

            `;

        }
    ).join("");

}



/* ======================================================
   TABS
====================================================== */

document
.querySelectorAll(".tab")
.forEach(tab => {

    tab.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".tab")
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );


            currentTab =
                this.dataset.tab;


            renderRequests();

        }
    );

});



/* ======================================================
   LOAD USER DATA
====================================================== */

async function loadUser(){

    try{

        const userRef =

            db
            .collection("users")
            .doc(currentUsername);


        const userDoc =
            await userRef.get();


        if(userDoc.exists){

            const data =
                userDoc.data();


            userName.textContent =

                data.fullName ||

                currentUsername;


            userUsername.textContent =

                "الحساب: " +
                currentUsername;

        }

        else{

            userName.textContent =
                currentUsername;

            userUsername.textContent =
                "الحساب: " +
                currentUsername;

        }

    }

    catch(error){

        console.error(
            "خطأ في تحميل بيانات المستخدم:",
            error
        );


        userName.textContent =
            currentUsername;

    }

}



/* ======================================================
   LOAD REQUESTS
====================================================== */

function listenToRequests(){

    console.log(
        "المستخدم الحالي:",
        currentUsername
    );


    /*
       مهم جدًا:

       نحن لا نستخدم Firebase Auth.

       نحن نبحث باستخدام:
       currentUsername

       وبالتالي يجب أن يكون:

       giftRequests/{request}.servantId
       =
       currentUsername
    */


    const requestsQuery =

        db
        .collection("giftRequests")
        .where(
            "servantId",
            "==",
            currentUsername
        );



    requestsQuery.onSnapshot(

        snapshot => {

            console.log(
                "عدد الطلبات:",
                snapshot.size
            );


            requests =

                snapshot.docs.map(
                    doc => ({

                        id:doc.id,

                        ...doc.data()

                    })
                );



            /*
               ترتيب الطلبات
               الأحدث أولاً
            */

            requests.sort(
                (a,b) => {

                    const getTime =
                        value => {

                            if(
                                value &&
                                typeof value.toMillis ===
                                "function"
                            ){

                                return value.toMillis();

                            }


                            if(
                                value &&
                                typeof value.toDate ===
                                "function"
                            ){

                                return value.toDate()
                                .getTime();

                            }


                            const date =
                                new Date(value);


                            return isNaN(
                                date.getTime()
                            )
                            ? 0
                            : date.getTime();

                        };


                    return (

                        getTime(b.createdAt) -

                        getTime(a.createdAt)

                    );

                }
            );



            updateStats();

            renderRequests();

        },


        error => {

            console.error(
                "Firestore Error:",
                error
            );


            requestsContainer.innerHTML = `

                <div class="error">

                    ❌ حدث خطأ أثناء تحميل الطلبات

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    );

}

loadUser();

listenToRequests();
