<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرئيسية - لوحة الخادم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 95px 20px;
      overflow-x: hidden;
    }

    /* حاوية التنبيهات الفورية */
    #notifications-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 450px;
    }

    .notif-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00b894;
      border-right: 6px solid #00b894;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      animation: slideIn 0.4s ease;
    }

    .notif-box h4 {
      margin: 0 0 5px 0;
      color: #00b894;
      font-size: 1rem;
    }

    .notif-box p {
      margin: 0;
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* كارت الترحيب بالخادم */
    .welcome-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(2, 132, 199, 0.05));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .avatar-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.2);
      border: 2px solid #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .welcome-info h3 {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .welcome-info h2 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* شبكة الوصول السريع (محدثة لتعرض 3 عناصر في الصف أو شبكة متوازنة) */
    .quick-access-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .shortcut-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px 15px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .shortcut-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
    }

    .shortcut-icon {
      font-size: 32px;
    }

    .shortcut-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* الشريط السفلي للتنقل (محدث ليشمل 5 عناصر بوزن متساوي) */
    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 5px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 600;
      gap: 3px;
      transition: all 0.3s ease;
      width: 20%;
    }

    .nav-item .nav-icon {
      font-size: 18px;
      transition: transform 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #38bdf8;
    }

    .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <!-- حاوية عرض الإشعارات الفورية -->
  <div id="notifications-container"></div>

  <div class="container">

    <!-- كارت الترحيب بالخادم -->
    <div class="welcome-card">
      <div class="avatar-box" id="servantAvatar">👤</div>
      <div class="welcome-info">
        <h3>أهلاً بك 👋</h3>
        <h2 id="servantDisplayName">جاري التحميل...</h2>
      </div>
    </div>

    <!-- شبكة الاختصارات السريعة -->
    <div class="quick-access-grid">
      <a href="control.html" class="shortcut-card">
        <span class="shortcut-icon">⚙️</span>
        <span class="shortcut-title">الإدارة</span>
      </a>

      <a href="store.html" class="shortcut-card">
        <span class="shortcut-icon">🎁</span>
        <span class="shortcut-title">المعرض</span>
      </a>

      <a href="basket.html" class="shortcut-card">
        <span class="shortcut-icon">🛒</span>
        <span class="shortcut-title">السلة</span>
      </a>

      <a href="notifications.html" class="shortcut-card">
        <span class="shortcut-icon">🔔</span>
        <span class="shortcut-title">الإشعارات</span>
      </a>
    </div>

  </div>

  <!-- الشريط السفلي للتنقل -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>
    <a href="control.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>الإدارة</span>
    </a>
    <a href="store.html" class="nav-item">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>
    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // التحقق من وجود المستخدم وجلب بياناته من قاعدة البيانات
    window.addEventListener('DOMContentLoaded', async () => {
      const currentUsername = localStorage.getItem("currentAdminUser");

      if (!currentUsername) {
        window.location.href = "../admin.html";
        return;
      }

      try {
        const docRef = db.collection('users').doc(currentUsername);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          const data = docSnap.data();
          const title = data.title || ""; 
          const name = data.username || currentUsername;
          
          if (title) {
            document.getElementById('servantDisplayName').innerText = `${title} / ${name}`;
          } else {
            document.getElementById('servantDisplayName').innerText = name;
          }

          if (data.photo) {
            document.getElementById('servantAvatar').innerHTML = `<img src="${data.photo}" alt="Servant">`;
          }
        } else {
          document.getElementById('servantDisplayName').innerText = currentUsername;
        }
      } catch (err) {
        console.error("Error fetching servant data:", err);
        document.getElementById('servantDisplayName').innerText = currentUsername;
      }

      // تفعيل الاستماع الفوري للإشعارات باستخدام نظام الـ Compat
      initRealtimeNotifications();
    });

    // دالة الاستماع الفوري للإشعارات المتوافقة مع الكود
    function initRealtimeNotifications() {
      db.collection("servantNotifications")
        .where("read", "==", false)
        .onSnapshot((snapshot) => {
          snapshot.docChanges().forEach(async (change) => {
            if (change.type === "added") {
              const data = change.doc.data();
              showNotificationUI(data.title, data.body);

              try {
                await db.collection("servantNotifications").doc(change.doc.id).update({ read: true });
              } catch (err) {
                console.error("خطأ في تحديث حالة القراءة:", err);
              }
            }
          });
        });
    }

    // دالة عرض التنبيه بشكل جمالي على الشاشة
    function showNotificationUI(title, body) {
      const container = document.getElementById("notifications-container");
      
      const alertBox = document.createElement("div");
      alertBox.className = "notif-box";
      alertBox.innerHTML = `
        <h4>🔔 ${title}</h4>
        <p>${body}</p>
      `;
      
      container.appendChild(alertBox);

      // إخفاء التنبيه تلقائياً بعد 6 ثوانٍ
      setTimeout(() => {
        alertBox.remove();
      }, 6000);
    }
  </script>

</body>
</html>
