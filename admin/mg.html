<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة التحكم - تطبيق الكنيسة</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", sans-serif;
    }

    body {
      background: #0b0f19;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
    }

    h1,
    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .admin-info {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 7px;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: #fff;
      outline: none;
      font-size: 1rem;
    }

    select:focus,
    input:focus {
      border-color: #38bdf8;
    }

    select option {
      background: #0f172a;
      color: #fff;
    }

    .password-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .password-box.show {
      display: block;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .main-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 5px;
    }

    .main-btn:hover {
      opacity: 0.9;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      padding: 9px 15px;
      border-radius: 10px;
      font-weight: 700;
      display: block;
      margin: 12px auto 0;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
    }

    .servants-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .servant-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.25s;
    }

    .servant-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .servant-card.blocked {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.06);
    }

    .servant-name {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .servant-phone {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .points {
      color: #38bdf8;
      font-weight: 900;
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .blocked-badge {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 5px;
    }

    .message {
      text-align: center;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      left: 12px;
      background: transparent;
      color: #94a3b8;
      font-size: 1.5rem;
    }

    .modal-title {
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .points-control {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .points-control input {
      text-align: center;
      font-weight: 900;
    }

    .point-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #38bdf8;
      color: #000;
      font-weight: 900;
      font-size: 0.9rem;
    }

    .save-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #38bdf8;
      color: #000;
      font-weight: 900;
    }

    .block-btn,
    .unblock-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
      font-weight: 900;
    }

    .block-btn { background: #ef4444; }
    .unblock-btn { background: #22c55e; }

    .loading, .empty {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="card">
    <h1>⚙️ لوحة التحكم والإدارة</h1>
    <div id="adminInfo" class="admin-info">جاري التحقق من الحساب...</div>
    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
  </div>

  <!-- الرسائل -->
  <div id="message" class="message"></div>

  <!-- اختيار نوع الجزء (خادم أم مخدوم) -->
  <div class="card">
    <div class="form-group">
      <label>اختر نوع لوحة التحكم:</label>
      <select id="roleSelect" onchange="roleChanged()">
        <option value="">-- اختر القسم --</option>
        <option value="servant_part">جزء الخادم (إدارة المخدومين)</option>
        <option value="served_part">جزء المخدوم (عرض وتعديل البروفايل)</option>
      </select>
    </div>
  </div>

  <!-- ==================== جزء الخادم ==================== -->
  <div id="servantSection" style="display:none;">
    <div class="card">
      <div class="form-group">
        <label>اختر المرحلة الدراسية:</label>
        <select id="stageSelect" onchange="stageChanged()">
          <option value="">-- اختر المرحلة --</option>
          <option value="primary">ابتدائي</option>
          <option value="prep">إعدادي</option>
          <option value="sec">ثانوي</option>
        </select>
      </div>

      <!-- كلمة السر -->
      <div id="passwordBox" class="password-box">
        <div class="form-group">
          <label>🔒 كلمة سر المرحلة</label>
          <input type="password" id="stagePassword" placeholder="أدخل كلمة السر" onkeydown="passwordEnter(event)">
        </div>
        <button class="main-btn" onclick="verifyStage()">فتح المرحلة 🔓</button>
      </div>
    </div>

    <!-- البحث والتحكم -->
    <div id="controlPanel" class="card" style="display:none;">
      <div class="form-group">
        <label>اختر الصف:</label>
        <select id="gradeSelect" onchange="loadServants()">
          <option value="">-- اختر الصف --</option>
        </select>
      </div>

      <div class="form-group">
        <label>🔍 البحث عن مخدوم</label>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="اكتب الاسم..." oninput="searchServants()">
          <button class="main-btn" style="width:auto;" onclick="searchServants()">بحث</button>
        </div>
      </div>
    </div>

    <!-- القائمة -->
    <div id="servantsList" class="servants-list"></div>
  </div>

  <!-- ==================== جزء المخدوم ==================== -->
  <div id="servedSection" class="card" style="display:none;">
    <h2>👤 بروفايل المخدوم</h2>
    <div class="form-group">
      <label>الاسم بالكامل</label>
      <input type="text" id="profileName">
    </div>
    <div class="form-group">
      <label>رقم التليفون الشخصي</label>
      <input type="tel" id="profilePhone">
    </div>
    <div class="form-group">
      <label>النقاط الحالية</label>
      <input type="number" id="profilePoints" readonly style="color: #38bdf8; font-weight: 900;">
    </div>
    <button class="main-btn" onclick="saveProfile()">حفظ تعديلات البروفايل 💾</button>
  </div>

</div>

<!-- Modal للتعديل في جزء الخادم -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2 class="modal-title">تعديل بيانات المخدوم</h2>
    <input type="hidden" id="editUserId">

    <div class="form-group">
      <label>الاسم بالكامل</label>
      <input type="text" id="editName">
    </div>

    <div class="form-group">
      <label>رقم التليفون الشخصي</label>
      <input type="tel" id="editPhone">
    </div>

    <div class="form-group">
      <label>النقاط</label>
      <div class="points-control">
        <button class="point-btn" onclick="changePoints(-5)">-5</button>
        <button class="point-btn" onclick="changePoints(-1)">-1</button>
        <input type="number" id="editPoints" min="0">
        <button class="point-btn" onclick="changePoints(1)">+1</button>
        <button class="point-btn" onclick="changePoints(5)">+5</button>
      </div>
    </div>

    <button class="save-btn" onclick="saveServant()">حفظ التعديلات 💾</button>
    <div id="blockContainer"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
    authDomain: "church-7afe1.firebaseapp.com",
    projectId: "church-7afe1",
    storageBucket: "church-7afe1.firebasestorage.app",
    messagingSenderId: "1072334615357",
    appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
    measurementId: "G-E7Q76Z53SB"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db = firebase.firestore();

  const stagePasswords = { primary: "344", prep: "455", sec: "899" };
  const stageGrades = {
    primary: ["الصف الأول الابتدائي", "الصف الثاني الابتدائي", "الصف الثالث الابتدائي", "الصف الرابع الابتدائي", "الصف الخامس الابتدائي", "الصف السادس الابتدائي"],
    prep: ["الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"],
    sec: ["الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"]
  };

  let currentAdmin = null;
  let selectedStage = "";
  let servants = [];
  let unsubscribe = null;

  auth.onAuthStateChanged((user) => {
    if (!user) {
      document.getElementById("adminInfo").innerText = "غير مسجل الدخول.";
      showMessage("يجب تسجيل الدخول أولاً.", "error");
      setTimeout(() => { window.location.href = "user.html"; }, 1500);
      return;
    }
    currentAdmin = user;
    document.getElementById("adminInfo").innerText = "تم تسجيل الدخول: " + (user.email || "حساب مستخدم");
  });

  // التبديل بين جزء الخادم وجزء المخدوم
  function roleChanged() {
    const role = document.getElementById("roleSelect").value;
    document.getElementById("servantSection").style.display = (role === "servant_part") ? "block" : "none";
    document.getElementById("servedSection").style.display = (role === "served_part") ? "block" : "none";
    
    if (role === "served_part") {
      loadMyProfile();
    }
  }

  // تحميل بيانات المخدوم الحالي لنفسه
  async function loadMyProfile() {
    if (!currentAdmin) return;
    try {
      const doc = await db.collection("servants").doc(currentAdmin.uid).get();
      if (doc.exists) {
        const data = doc.data();
        document.getElementById("profileName").value = data.fullName || "";
        document.getElementById("profilePhone").value = data.userPhone || "";
        document.getElementById("profilePoints").value = Number(data.points) || 0;
      }
    } catch (error) {
      console.error("Error loading profile:", error);
    }
  }

  // حفظ تعديلات المخدوم لنفسه
  async function saveProfile() {
    if (!currentAdmin) return;
    const name = document.getElementById("profileName").value.trim();
    const phone = document.getElementById("profilePhone").value.trim();

    if (!name) {
      alert("برجاء كتابة الاسم.");
      return;
    }

    try {
      await db.collection("servants").doc(currentAdmin.uid).update({
        fullName: name,
        userPhone: phone,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert("تم حفظ بيانات البروفايل بنجاح ✅");
    } catch (error) {
      console.error("Error saving profile:", error);
      alert("حدث خطأ أثناء الحفظ ❌");
    }
  }

  // وظائف جزء الخادم الأصلية
  function stageChanged() {
    const stage = document.getElementById("stageSelect").value;
    selectedStage = stage;
    stopListener();
    document.getElementById("servantsList").innerHTML = "";
    document.getElementById("searchInput").value = "";
    document.getElementById("controlPanel").style.display = "none";
    const passwordBox = document.getElementById("passwordBox");
    if (!stage) {
      passwordBox.classList.remove("show");
      return;
    }
    passwordBox.classList.add("show");
    document.getElementById("stagePassword").value = "";
  }

  function passwordEnter(event) {
    if (event.key === "Enter") verifyStage();
  }

  function verifyStage() {
    const password = document.getElementById("stagePassword").value;
    if (stagePasswords[selectedStage] === password) {
      document.getElementById("passwordBox").classList.remove("show");
      document.getElementById("controlPanel").style.display = "block";
      populateGrades(selectedStage);
      showMessage("تم فتح المرحلة بنجاح 🔓", "success");
    } else {
      showMessage("كلمة السر غير صحيحة ❌", "error");
    }
  }

  function populateGrades(stage) {
    const select = document.getElementById("gradeSelect");
    select.innerHTML = `<option value="">-- اختر الصف --</option>`;
    stageGrades[stage].forEach((grade) => {
      const option = document.createElement("option");
      option.value = grade;
      option.textContent = grade;
      select.appendChild(option);
    });
  }

  function loadServants() {
    const stage = document.getElementById("stageSelect").value;
    const grade = document.getElementById("gradeSelect").value;
    const list = document.getElementById("servantsList");
    stopListener();

    if (!stage || !grade) {
      list.innerHTML = "";
      return;
    }

    list.innerHTML = `<div class="loading">جاري تحميل المخدومين...</div>`;

    unsubscribe = db.collection("servants").where("stage", "==", stage).where("grade", "==", grade).onSnapshot((snapshot) => {
      servants = [];
      snapshot.forEach((doc) => {
        servants.push({ id: doc.id, ...doc.data() });
      });
      searchServants();
    }, (error) => {
      console.error("Firestore Error:", error);
      list.innerHTML = `<div class="empty">⚠️ تعذر جلب البيانات.</div>`;
    });
  }

  function stopListener() {
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }
  }

  function searchServants() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!query) {
      renderServants(servants);
      return;
    }
    const filtered = servants.filter((s) => (s.fullName || "").toLowerCase().includes(query));
    renderServants(filtered);
  }

  function renderServants(list) {
    const container = document.getElementById("servantsList");
    container.innerHTML = "";
    if (list.length === 0) {
      container.innerHTML = `<div class="empty">لا يوجد مخدومين في هذا الصف.</div>`;
      return;
    }
    list.forEach((servant) => {
      const name = servant.fullName || "بدون اسم";
      const phone = servant.userPhone || "لا يوجد رقم";
      const points = Number(servant.points) || 0;

      const card = document.createElement("div");
      card.className = "servant-card" + (servant.isBlocked ? " blocked" : "");
      card.onclick = () => openModal(servant);
      card.innerHTML = `
        <div>
          <div class="servant-name">
            ${escapeHTML(name)}
            ${servant.isBlocked ? `<span class="blocked-badge">محظور</span>` : ""}
          </div>
          <div class="servant-phone">📞 ${escapeHTML(phone)}</div>
        </div>
        <div class="points">⭐ ${points}</div>
      `;
      container.appendChild(card);
    });
  }

  function openModal(servant) {
    document.getElementById("editUserId").value = servant.id;
    document.getElementById("editName").value = servant.fullName || "";
    document.getElementById("editPhone").value = servant.userPhone || "";
    document.getElementById("editPoints").value = Number(servant.points) || 0;

    const blockContainer = document.getElementById("blockContainer");
    if (servant.isBlocked) {
      blockContainer.innerHTML = `<button class="unblock-btn" onclick="toggleBlock(false)">إزالة الحظر 🔓</button>`;
    } else {
      blockContainer.innerHTML = `<button class="block-btn" onclick="toggleBlock(true)">حظر المخدوم 🚫</button>`;
    }
    document.getElementById("editModal").classList.add("show");
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("show");
  }

  function changePoints(value) {
    const input = document.getElementById("editPoints");
    let points = parseInt(input.value) || 0;
    points += value;
    if (points < 0) points = 0;
    input.value = points;
  }

  async function saveServant() {
    const id = document.getElementById("editUserId").value;
    const name = document.getElementById("editName").value.trim();
    const phone = document.getElementById("editPhone").value.trim();
    const points = Math.max(0, parseInt(document.getElementById("editPoints").value) || 0);

    if (!id || !name) {
      alert("برجاء التأكد من البيانات.");
      return;
    }

    try {
      await db.collection("servants").doc(id).update({
        fullName: name,
        userPhone: phone,
        points: points,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert("تم حفظ التعديلات بنجاح ✅");
      closeModal();
    } catch (error) {
      console.error("Save Error:", error);
      alert("❌ لم يتم الحفظ:\n" + error.message);
    }
  }

  async function toggleBlock(status) {
    const id = document.getElementById("editUserId").value;
    if (!id) return;
    if (!confirm(status ? "هل تريد حظر هذا المخدوم؟" : "هل تريد إزالة الحظر؟")) return;

    try {
      await db.collection("servants").doc(id).update({
        isBlocked: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert(status ? "تم حظر المخدوم 🚫" : "تم إزالة الحظر 🔓");
      closeModal();
    } catch (error) {
      console.error("Block Error:", error);
      alert("❌ حدث خطأ:\n" + error.message);
    }
  }

  async function logout() {
    try {
      stopListener();
      await auth.signOut();
      window.location.href = "user.html";
    } catch (error) {
      console.error(error);
      alert("حدث خطأ أثناء تسجيل الخروج.");
    }
  }

  function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.className = "message show " + type;
    setTimeout(() => { msg.classList.remove("show"); }, 3000);
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  document.getElementById("editModal").addEventListener("click", (event) => {
    if (event.target.id === "editModal") closeModal();
  });
</script>

</body>
</html>
