<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الهدايا - لوحة الخادم</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 100px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .lock-card {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .lock-icon {
      font-size: 60px;
      transition: transform 0.4s ease;
    }

    .lock-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #00e676;
    }

    .input-box,
    .select-box {
      width: 100%;
      padding: 12px 15px;
      background: #0f111a;
      border: 1px solid #2a2e43;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .select-box option {
      background: #0f111a;
      color: #fff;
    }

    .input-box:focus,
    .select-box:focus {
      border-color: #00e676;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #00e676;
      color: #0f111a;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      min-height: 20px;
    }

    #storeContent {
      display: none;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .section-card {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #00e676;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-label {
      font-size: 0.9rem;
      color: #d1d5db;
      font-weight: 600;
    }

    .preview-box {
      border: 2px dashed #2a2e43;
      border-radius: 16px;
      padding: 15px;
      background: #0f111a;
    }

    .gift-card-preview {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 16px;
      padding: 12px;
      max-width: 180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .preview-img-box {
      width: 100%;
      height: 110px;
      border-radius: 12px;
      background: #0f111a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 8px;
      font-size: 35px;
    }

    .preview-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .preview-details {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin: 5px 0;
    }

    .preview-price {
      color: #00e676;
      font-weight: 800;
    }

    .preview-qty {
      color: #a0aec0;
    }

    .preview-btn {
      background: #00e676;
      color: #0f111a;
      border: none;
      border-radius: 10px;
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 5px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #a0aec0;
      font-size: 0.7rem;
      font-weight: 600;
      gap: 3px;
      width: 18%;
    }

    .nav-item.active {
      color: #00e676;
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- قفل المرحلة -->
    <div class="lock-card" id="lockCard">
      <div class="lock-icon" id="lockIcon">🔒</div>
      <div class="lock-title">اختر المرحلة والأمان</div>

      <select id="stageSelect" class="select-box" onchange="updateGradeOptions()">
        <option value="primary">مرحلة ابتدائي 🎒</option>
        <option value="prep">مرحلة إعدادي 📚</option>
        <option value="sec">مرحلة ثانوي 🎓</option>
      </select>

      <input type="password" id="stagePassword" class="input-box" placeholder="كلمة سر المرحلة">

      <button class="btn-main" onclick="verifyStage()">
        تأكيد وفتح المرحلة 🔓
      </button>

      <div class="error-msg" id="lockError"></div>
    </div>

    <!-- محتوى المعرض -->
    <div id="storeContent">
      <div class="section-card">
        <div class="section-title">🎁 إضافة هدية جديدة</div>

        <div class="form-group">
          <label class="form-label">مستهدف الهدية (الصف الدراسي):</label>
          <select id="targetGrade" class="select-box"></select>

          <label class="form-label">اسم الهدية:</label>
          <input type="text" id="giftName" class="input-box" placeholder="مثال: كتاب مقدس / لعبة" oninput="updatePreview()">

          <label class="form-label">سعر الهدية (النقاط المطلوبة):</label>
          <input type="number" id="giftPoints" class="input-box" placeholder="مثال: 50" min="0" oninput="updatePreview()">

          <label class="form-label">الكمية المتاحة من هذه الهدية:</label>
          <input type="number" id="giftQty" class="input-box" placeholder="مثال: 3" min="0" oninput="updatePreview()">

          <label class="form-label">صورة الهدية:</label>
          <input type="file" id="giftImageInput" class="input-box" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <button class="btn-main" style="margin-top: 15px;" onclick="uploadGift()">
          نشر الهدية في المعرض 🚀
        </button>
      </div>

      <!-- المعاينة -->
      <div class="section-card">
        <div class="section-title">👁️ معاينة الهدية (شكلها للمخدوم)</div>
        <div class="preview-box">
          <div class="gift-card-preview">
            <div class="preview-img-box" id="previewImgBox">🎁</div>
            <div class="preview-name" id="previewName">اسم الهدية</div>
            <div class="preview-details">
              <span class="preview-price" id="previewPoints">⭐ 0 نقطة</span>
              <span class="preview-qty" id="previewQty">الكمية: 0</span>
            </div>
            <div class="preview-btn">إضافة للسلة 🛒</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>
    <a href="control.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>الإدارة</span>
    </a>
    <a href="store.html" class="nav-item active">
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>
    <a href="basket.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    const stagePasswords = {
      primary: "344",
      prep: "455",
      sec: "899"
    };

    let currentUser = null;
    let selectedStage = "primary";
    let giftBase64Image = "";

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
      } else {
        console.warn("المستخدم غير مسجل دخول، سيتم المتابعة للاختبار المحلي.");
      }
    });

    function updateGradeOptions() {
      const stage = document.getElementById("stageSelect").value;
      const targetGradeSelect = document.getElementById("targetGrade");
      targetGradeSelect.innerHTML = "";

      let grades = [];
      if (stage === "primary") {
        grades = ["أولى ابتدائي", "تانية ابتدائي", "تالتة ابتدائي", "رابعة ابتدائي", "خامسة ابتدائي", "ستة ابتدائي"];
      } else if (stage === "prep") {
        grades = ["أولى إعدادي", "تانية إعدادي", "تالتة إعدادي"];
      } else if (stage === "sec") {
        grades = ["أولى ثانوي", "تانية ثانوي", "تالتة ثانوي"];
      }

      grades.forEach((grade) => {
        const option = document.createElement("option");
        option.value = grade;
        option.innerText = grade;
        targetGradeSelect.appendChild(option);
      });
    }

    async function verifyStage() {
      const stage = document.getElementById("stageSelect").value;
      const pass = document.getElementById("stagePassword").value;
      const lockError = document.getElementById("lockError");

      if (pass !== stagePasswords[stage]) {
        lockError.innerText = "كلمة سر المرحلة غير صحيحة ❌";
        document.getElementById("lockIcon").innerText = "🔒";
        return;
      }

      selectedStage = stage;
      lockError.innerText = "";
      document.getElementById("lockIcon").innerText = "🔓";

      const button = document.querySelector("#lockCard .btn-main");
      button.disabled = true;

      setTimeout(() => {
        document.getElementById("lockCard").style.display = "none";
        document.getElementById("storeContent").style.display = "flex";
      }, 600);
    }

    function updatePreview() {
      const name = document.getElementById("giftName").value || "اسم الهدية";
      const points = document.getElementById("giftPoints").value || "0";
      const qty = document.getElementById("giftQty").value || "0";

      document.getElementById("previewName").innerText = name;
      document.getElementById("previewPoints").innerText = `⭐ ${points} نقطة`;
      document.getElementById("previewQty").innerText = `الكمية: ${qty}`;
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("من فضلك اختر صورة فقط.");
        event.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 300;
          const MAX_HEIGHT = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = Math.round(width);
          canvas.height = Math.round(height);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          giftBase64Image = canvas.toDataURL("image/jpeg", 0.7);
          document.getElementById("previewImgBox").innerHTML = `<img src="${giftBase64Image}" alt="Gift">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function uploadGift() {
      const targetGrade = document.getElementById("targetGrade").value;
      const name = document.getElementById("giftName").value.trim();
      const points = Number(document.getElementById("giftPoints").value);
      const qty = Number(document.getElementById("giftQty").value);

      if (!targetGrade || !name || isNaN(points) || points < 0 || isNaN(qty) || qty < 0) {
        alert("برجاء التأكد من إدخال كافة البيانات بشكل صحيح.");
        return;
      }

      try {
        await db.collection("gifts").add({
          stage: selectedStage,
          targetGrade: targetGrade,
          name: name,
          points: points,
          quantity: qty,
          image: giftBase64Image,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser ? currentUser.uid : "anonymous_admin"
        });

        alert("تم إضافة الهدية بنجاح إلى المعرض! ✨");

        document.getElementById("giftName").value = "";
        document.getElementById("giftPoints").value = "";
        document.getElementById("giftQty").value = "";
        document.getElementById("giftImageInput").value = "";
        giftBase64Image = "";
        document.getElementById("previewImgBox").innerHTML = "🎁";
        updatePreview();

      } catch (error) {
        console.error("Error uploading gift:", error);
        alert("حدث خطأ أثناء رفع الهدية:\n" + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateGradeOptions();
    });
  </script>

</body>
</html>
