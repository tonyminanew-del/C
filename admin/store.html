<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الهدايا - لوحة الخادم</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 100px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .lock-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .lock-icon {
      font-size: 60px;
      transition: transform 0.4s ease;
    }

    .lock-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .input-box,
    .select-box {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .select-box option {
      background: #0b0f19;
      color: #fff;
    }

    .input-box:focus,
    .select-box:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      min-height: 20px;
    }

    #storeContent {
      display: none;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .preview-box {
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
    }

    .gift-card-preview {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 12px;
      max-width: 180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    .preview-img-box {
      width: 100%;
      height: 110px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 8px;
      font-size: 35px;
    }

    .preview-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .preview-details {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin: 5px 0;
    }

    .preview-price {
      color: #38bdf8;
      font-weight: 800;
    }

    .preview-qty {
      color: #94a3b8;
    }

    .preview-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 5px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.7rem;
      font-weight: 600;
      gap: 3px;
      width: 18%;
    }

    .nav-item.active {
      color: #38bdf8;
    }

    .nav-icon {
      font-size: 18px;
    }

    .success-msg {
      color: #4ade80;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         قفل المرحلة
    ========================== -->

    <div class="lock-card" id="lockCard">

      <div class="lock-icon" id="lockIcon">🔒</div>

      <div class="lock-title">
        اختر المرحلة والأمان
      </div>

      <select
        id="stageSelect"
        class="select-box"
        onchange="updateGradeOptions()"
      >
        <option value="primary">مرحلة ابتدائي 🎒</option>
        <option value="prep">مرحلة إعدادي 📚</option>
        <option value="secondary">مرحلة ثانوي 🎓</option>
      </select>

      <input
        type="password"
        id="stagePassword"
        class="input-box"
        placeholder="كلمة سر المرحلة"
      >

      <button
        class="btn-main"
        onclick="verifyStage()"
      >
        تأكيد وفتح المرحلة 🔓
      </button>

      <div
        class="error-msg"
        id="lockError"
      ></div>

    </div>


    <!-- =========================
         محتوى المعرض
    ========================== -->

    <div id="storeContent">

      <!-- إضافة هدية -->

      <div class="section-card">

        <div class="section-title">
          🎁 إضافة هدية جديدة
        </div>

        <div class="form-group">

          <label class="form-label">
            مستهدف الهدية (الصف الدراسي):
          </label>

          <select
            id="targetGrade"
            class="select-box"
          ></select>


          <label class="form-label">
            اسم الهدية:
          </label>

          <input
            type="text"
            id="giftName"
            class="input-box"
            placeholder="مثال: كتاب مقدس / لعبة"
            oninput="updatePreview()"
          >


          <label class="form-label">
            سعر الهدية (النقاط المطلوبة):
          </label>

          <input
            type="number"
            id="giftPoints"
            class="input-box"
            placeholder="مثال: 50"
            min="0"
            oninput="updatePreview()"
          >


          <label class="form-label">
            الكمية المتاحة من هذه الهدية:
          </label>

          <input
            type="number"
            id="giftQty"
            class="input-box"
            placeholder="مثال: 3"
            min="0"
            oninput="updatePreview()"
          >


          <label class="form-label">
            صورة الهدية:
          </label>

          <input
            type="file"
            id="giftImageInput"
            class="input-box"
            accept="image/*"
            onchange="handleImageUpload(event)"
          >

        </div>


        <button
          class="btn-main"
          style="margin-top: 15px;"
          onclick="uploadGift()"
        >
          نشر الهدية في المعرض 🚀
        </button>

      </div>


      <!-- المعاينة -->

      <div class="section-card">

        <div class="section-title">
          👁️ معاينة الهدية (شكلها للمخدوم)
        </div>

        <div class="preview-box">

          <div class="gift-card-preview">

            <div
              class="preview-img-box"
              id="previewImgBox"
            >
              🎁
            </div>

            <div
              class="preview-name"
              id="previewName"
            >
              اسم الهدية
            </div>

            <div class="preview-details">

              <span
                class="preview-price"
                id="previewPoints"
              >
                ⭐ 0 نقطة
              </span>

              <span
                class="preview-qty"
                id="previewQty"
              >
                الكمية: 0
              </span>

            </div>

            <div class="preview-btn">
              إضافة للسلة 🛒
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       الشريط السفلي
  ========================== -->

  <nav class="bottom-nav">

    <a
      href="home.html"
      class="nav-item"
    >
      <span class="nav-icon">🏠</span>
      <span>الرئيسية</span>
    </a>


    <a
      href="profile.html"
      class="nav-item"
    >
      <span class="nav-icon">👤</span>
      <span>البروفايل</span>
    </a>


    <a
      href="control.html"
      class="nav-item"
    >
      <span class="nav-icon">⚙️</span>
      <span>الإدارة</span>
    </a>


    <a
      href="store.html"
      class="nav-item active"
    >
      <span class="nav-icon">🎁</span>
      <span>المعرض</span>
    </a>


    <a
      href="basket.html"
      class="nav-item"
    >
      <span class="nav-icon">🛒</span>
      <span>السلة</span>
    </a>

  </nav>


  <script>

    /* =========================
       Firebase
    ========================== */

    const firebaseConfig = {

      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",

      authDomain: "church-7afe1.firebaseapp.com",

      projectId: "church-7afe1",

      storageBucket: "church-7afe1.firebasestorage.app",

      messagingSenderId: "1072334615357",

      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",

      measurementId: "G-E7Q76Z53SB"

    };


    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }


    const auth = firebase.auth();

    const db = firebase.firestore();


    /* =========================
       كلمات سر المراحل
    ========================== */

    const stagePasswords = {

      primary: "510329",

      prep: "09876",

      secondary: "221344"

    };


    /* =========================
       المتغيرات
    ========================== */

    let currentUser = null;

    let selectedStage = "primary";

    let giftBase64Image = "";


    /* =========================
       التحقق من تسجيل الدخول
    ========================== */

    auth.onAuthStateChanged((user) => {

      if (user) {

        currentUser = user;

        updateGradeOptions();

      } else {

        window.location.href = "../admin.html";

      }

    });


    /* =========================
       تحديث الصفوف حسب المرحلة
    ========================== */

    function updateGradeOptions() {

      const stage =
        document.getElementById("stageSelect").value;

      const targetGradeSelect =
        document.getElementById("targetGrade");


      targetGradeSelect.innerHTML = "";


      let grades = [];


      if (stage === "primary") {

        grades = [
          "أولى ابتدائي",
          "تانية ابتدائي",
          "تالتة ابتدائي",
          "رابعة ابتدائي",
          "خامسة ابتدائي",
          "ستة ابتدائي"
        ];

      }

      else if (stage === "prep") {

        grades = [
          "أولى إعدادي",
          "تانية إعدادي",
          "تالتة إعدادي"
        ];

      }

      else if (stage === "secondary") {

        grades = [
          "أولى ثانوي",
          "تانية ثانوي",
          "تالتة ثانوي"
        ];

      }


      grades.forEach((grade) => {

        const option =
          document.createElement("option");

        option.value = grade;

        option.innerText = grade;

        targetGradeSelect.appendChild(option);

      });

    }


    /* =========================
       فتح المرحلة
    ========================== */

    async function verifyStage() {

      const stage =
        document.getElementById("stageSelect").value;

      const pass =
        document.getElementById("stagePassword").value;

      const lockError =
        document.getElementById("lockError");


      /* كلمة السر غلط */

      if (pass !== stagePasswords[stage]) {

        lockError.innerText =
          "كلمة سر المرحلة غير صحيحة ❌";

        document.getElementById("lockIcon").innerText =
          "🔒";

        return;

      }


      /* كلمة السر صحيحة */

      selectedStage = stage;

      lockError.innerText = "";

      document.getElementById("lockIcon").innerText =
        "🔓";


      /* منع الضغط المتكرر */

      const button =
        document.querySelector("#lockCard .btn-main");

      button.disabled = true;


      /* فتح المعرض */

      setTimeout(() => {

        document.getElementById("lockCard").style.display =
          "none";

        document.getElementById("storeContent").style.display =
          "flex";

      }, 600);


      /* حفظ المرحلة في Firebase */

      if (currentUser) {

        try {

          let stageName = "";

          if (stage === "primary") {
            stageName = "ابتدائي";
          }

          else if (stage === "prep") {
            stageName = "إعدادي";
          }

          else if (stage === "secondary") {
            stageName = "ثانوي";
          }


          await db
            .collection("admins")
            .doc(currentUser.uid)
            .set(
              {
                stage: stageName
              },
              {
                merge: true
              }
            );


          console.log(
            "تم حفظ المرحلة:",
            stageName
          );

        }

        catch (error) {

          console.error(
            "خطأ في حفظ المرحلة:",
            error
          );

        }

      }

    }


    /* =========================
       معاينة الهدية
    ========================== */

    function updatePreview() {

      const name =
        document.getElementById("giftName").value ||
        "اسم الهدية";


      const points =
        document.getElementById("giftPoints").value ||
        "0";


      const qty =
        document.getElementById("giftQty").value ||
        "0";


      document.getElementById("previewName").innerText =
        name;


      document.getElementById("previewPoints").innerText =
        `⭐ ${points} نقطة`;


      document.getElementById("previewQty").innerText =
        `الكمية: ${qty}`;

    }


    /* =========================
       رفع صورة الهدية
    ========================== */

    function handleImageUpload(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      /* التأكد أن الملف صورة */

      if (!file.type.startsWith("image/")) {

        alert("من فضلك اختر صورة فقط.");

        event.target.value = "";

        return;

      }


      const reader =
        new FileReader();


      reader.onload = function (e) {

        giftBase64Image =
          e.target.result;


        document.getElementById(
          "previewImgBox"
        ).innerHTML =
          `<img src="${giftBase64Image}" alt="Gift">`;

      };


      reader.onerror = function () {

        alert("حدث خطأ أثناء قراءة الصورة.");

      };


      reader.readAsDataURL(file);

    }


    /* =========================
       إضافة الهدية
    ========================== */

    async function uploadGift() {

      const targetGrade =
        document.getElementById("targetGrade").value;


      const name =
        document.getElementById("giftName").value.trim();


      const points =
        Number(
          document.getElementById("giftPoints").value
        );


      const qty =
        Number(
          document.getElementById("giftQty").value
        );


      /* التحقق من البيانات */

      if (!targetGrade) {

        alert("من فضلك اختر الصف الدراسي.");

        return;

      }


      if (!name) {

        alert("من فضلك اكتب اسم الهدية.");

        return;

      }


      if (
        isNaN(points) ||
        points < 0
      ) {

        alert("من فضلك اكتب عدد نقاط صحيح.");

        return;

      }


      if (
        isNaN(qty) ||
        qty < 0
      ) {

        alert("من فضلك اكتب كمية صحيحة.");

        return;

      }


      if (!currentUser) {

        alert("يجب تسجيل الدخول أولاً.");

        return;

      }


      try {

        await db
          .collection("gifts")
          .add({

            stage: selectedStage,

            targetGrade: targetGrade,

            name: name,

            points: points,

            quantity: qty,

            image: giftBase64Image,

            createdAt:
              firebase.firestore.FieldValue.serverTimestamp(),

            createdBy:
              currentUser.uid

          });


        alert(
          "تم إضافة الهدية بنجاح إلى المعرض! ✨"
        );


        /* تصفير البيانات */

        document.getElementById("giftName").value = "";

        document.getElementById("giftPoints").value = "";

        document.getElementById("giftQty").value = "";

        document.getElementById("giftImageInput").value = "";

        giftBase64Image = "";


        document.getElementById(
          "previewImgBox"
        ).innerHTML = "🎁";


        updatePreview();

      }

      catch (error) {

        console.error(
          "Error uploading gift:",
          error
        );


        alert(
          "حدث خطأ أثناء رفع الهدية:\n" +
          error.message
        );

      }

    }


    /* =========================
       تشغيل الصفوف أول مرة
    ========================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        updateGradeOptions();

      }
    );

  </script>

</body>
</html>
