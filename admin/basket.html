<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الهدايا - الخادم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
}
body {
  background: #0b0f19;
  color: #fff;
  min-height: 100vh;
  padding: 20px 20px 100px;
}
.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.header {
  background: linear-gradient(135deg, rgba(56, 189, 248, .15), rgba(2, 132, 199, .05));
  border: 1px solid rgba(56, 189, 248, .3);
  border-radius: 22px;
  padding: 20px;
  text-align: center;
}
.header h1 {
  color: #38bdf8;
  font-size: 1.4rem;
  margin-bottom: 5px;
}
.header p {
  color: #94a3b8;
  font-size: .85rem;
}
.box {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 18px;
}
label {
  display: block;
  color: #94a3b8;
  font-size: .85rem;
  margin-bottom: 7px;
}
select, input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: #0f172a;
  color: #fff;
  outline: none;
  font-size: 1rem;
  margin-bottom: 12px;
}
select option {
  background: #0f172a;
  color: #fff;
}
.orders-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.orders-title h2 {
  font-size: 1rem;
}
.count {
  background: #38bdf8;
  color: #07111d;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: .75rem;
  font-weight: 900;
}
.order-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.order-card:hover {
  border-color: rgba(56, 189, 248, .4);
}
.servant-name {
  color: #38bdf8;
  font-size: 1rem;
  font-weight: 900;
  margin-bottom: 4px;
}
.sub-orders-container {
  margin-top: 12px;
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 10px;
  display: none;
}
.sub-order-item {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
}
.status {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: .7rem;
  font-weight: 800;
}
.pending {
  color: #fbbf24;
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.25);
}
.approved-status {
  color: #38bdf8;
  background: rgba(56,189,248,.12);
  border: 1px solid rgba(56,189,248,.25);
}
.delivered-status {
  color: #4ade80;
  background: rgba(74,222,128,.12);
  border: 1px solid rgba(74,222,128,.25);
}
.action-buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.btn-approve {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#38bdf8,#0284c7);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  font-size: .8rem;
}
.btn-reject {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#ef4444,#dc2626);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  font-size: .8rem;
}
.deliver-btn {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  font-size: .85rem;
}
.empty, .loading, .error {
  text-align: center;
  color: #94a3b8;
  padding: 20px 10px;
  font-size: .9rem;
}
.error { color: #ef4444; }
.loading { color: #38bdf8; }
.bottom-nav {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 450px;
  background: rgba(15,23,42,.92);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 25px;
  display: flex;
  justify-content: space-around;
  padding: 10px;
  z-index: 100;
}
.nav-item {
  color: #94a3b8;
  text-decoration: none;
  font-size: .72rem;
  text-align: center;
}
.nav-icon {
  display: block;
  font-size: 19px;
  margin-bottom: 2px;
}
.nav-item.active {
  color: #38bdf8;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛒 طلبات الهدايا</h1>
    <p>إدارة وقبول وتسليم طلبات المخدومين</p>
  </div>

  <div class="box">
    <label>اختر المرحلة:</label>
    <select id="stageSelect">
      <option value="">-- اختر المرحلة --</option>
      <option value="primary">ابتدائي</option>
      <option value="prep">إعدادي</option>
      <option value="sec">ثانوي</option>
    </select>

    <label>بحث باسم المخدوم:</label>
    <input type="text" id="searchInput" placeholder="اكتب اسم المخدوم للبحث..." disabled>
  </div>

  <div class="box">
    <div class="orders-title">
      <h2>📦 المخدومين</h2>
      <span class="count" id="ordersCount">0</span>
    </div>
    <div id="usersList">
      <div class="empty">اختر المرحلة لعرض المخدومين والطلبات.</div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item">
    <span class="nav-icon">🏠</span>الرئيسية
  </a>
  <a href="control.html" class="nav-item">
    <span class="nav-icon">⚙️</span>الإدارة
  </a>
  <a href="servant-basket.html" class="nav-item active">
    <span class="nav-icon">🛒</span>الطلبات
  </a>
  <a href="profile.html" class="nav-item">
    <span class="nav-icon">👤</span>البروفايل
  </a>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
  authDomain: "church-7afe1.firebaseapp.com",
  projectId: "church-7afe1",
  storageBucket: "church-7afe1.firebasestorage.app",
  messagingSenderId: "1072334615357",
  appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
  measurementId: "G-E7Q76Z53SB"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
let currentAdminUsername = null;
let allUsers = [];

// التحقق من الجلسة الموحدة عبر LocalStorage
window.addEventListener("DOMContentLoaded", async () => {
  currentAdminUsername = localStorage.getItem("currentUsername");
  const userRole = localStorage.getItem("userRole");

  if (!currentAdminUsername) {
    window.location.href = "../t.html";
    return;
  }

  try {
    const adminRef = db.collection("admins").doc(currentAdminUsername);
    const adminDoc = await adminRef.get();

    if (!adminDoc.exists && userRole !== "admin") {
      alert("هذا الحساب ليس لديه صلاحية خادم.");
      localStorage.clear();
      window.location.href = "../t.html";
    }
  } catch (error) {
    console.error("Auth check error:", error);
  }
});

document.getElementById("stageSelect").addEventListener("change", function() {
  const stage = this.value;
  const searchInput = document.getElementById("searchInput");
  searchInput.value = "";
  
  if (!stage) {
    searchInput.disabled = true;
    document.getElementById("usersList").innerHTML = `<div class="empty">اختر المرحلة لعرض المخدومين.</div>`;
    document.getElementById("ordersCount").innerText = "0";
    allUsers = [];
    return;
  }
  
  searchInput.disabled = false;
  loadUsers(stage);
});

async function loadUsers(stage) {
  const list = document.getElementById("usersList");
  list.innerHTML = `<div class="loading">جاري تحميل المخدومين...</div>`;
  try {
    const snapshot = await db.collection("users").where("stage", "==", stage).get();
    allUsers = [];
    snapshot.forEach(doc => {
      allUsers.push({ id: doc.id, ...doc.data() });
    });
    renderUsers(allUsers);
  } catch (error) {
    console.error("Users error:", error);
    list.innerHTML = `<div class="error">⚠️ تعذر جلب المخدومين.</div>`;
  }
}

function renderUsers(users) {
  const list = document.getElementById("usersList");
  list.innerHTML = "";
  document.getElementById("ordersCount").innerText = users.length;

  if (users.length === 0) {
    list.innerHTML = `<div class="empty">لا يوجد مخدومين في هذه المرحلة مطابقي للبحث.</div>`;
    return;
  }

  users.forEach(userItem => {
    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div class="servant-name">👤 ${escapeHtml(userItem.username || userItem.fullName || userItem.id || "بدون اسم")}</div>
      <div style="font-size: .78rem; color: #94a3b8;">اللقب/الصفة: ${escapeHtml(userItem.title || "غير محدد")} | النقاط: ${userItem.points || 0} ⭐ | اضغط لعرض الطلبات</div>
      <div class="sub-orders-container" id="basket-${escapeHtml(userItem.id)}">
        <div class="loading">جاري التحميل...</div>
      </div>
    `;

    card.addEventListener("click", (e) => {
      if (e.target.tagName === 'BUTTON') return;
      toggleUserBasket(userItem.id);
    });

    list.appendChild(card);
  });
}

async function toggleUserBasket(userId) {
  const container = document.getElementById(`basket-${userId}`);
  if (container.style.display === "block") {
    container.style.display = "none";
    return;
  }

  container.style.display = "block";
  try {
    const snapshot = await db.collection("users").doc(userId).collection("basket").get();
    if (snapshot.empty) {
      container.innerHTML = `<div class="empty">لا توجد طلبات مسجلة لهذا المخدوم.</div>`;
      return;
    }

    container.innerHTML = "";
    snapshot.forEach(doc => {
      const order = doc.data();
      const orderId = doc.id;
      const isDelivered = order.isDelivered === true;
      const isApproved = order.isApproved === true;
      const giftName = order.name || "هدية";
      const giftPoints = Number(order.points) || 0;
      const orderCount = Number(order.count) || 1;
      const giftId = order.giftId || "";
      const giftImage = order.image || "";

      let statusHtml = `<span class="status pending">قيد الانتظار ⏳</span>`;
      if (isDelivered) {
        statusHtml = `<span class="status delivered-status">تم التسليم ✔️</span>`;
      } else if (isApproved) {
        statusHtml = `<span class="status approved-status">تمت الموافقة - بانتظار التسليم 🎁</span>`;
      }

      const itemDiv = document.createElement("div");
      itemDiv.className = "sub-order-item";
      
      let buttonsHtml = "";
      if (!isApproved && !isDelivered) {
        buttonsHtml = `
          <div class="action-buttons">
            <button class="btn-approve" id="app-${orderId}">قبول ✅</button>
            <button class="btn-reject" id="rej-${orderId}">رفض ❌</button>
          </div>
        `;
      } else if (isApproved && !isDelivered) {
        buttonsHtml = `
          <button class="deliver-btn" id="del-${orderId}">تسليم الهدية 📦</button>
        `;
      }

      itemDiv.innerHTML = `
        <div style="font-weight: bold; color: #38bdf8;">🎁 ${escapeHtml(giftName)}</div>
        <div style="font-size: .75rem; color: #94a3b8; margin-top: 3px;">الكمية: ${orderCount} | النقاط: ${giftPoints}</div>
        <div>${statusHtml}</div>
        ${buttonsHtml}
      `;

      if (!isApproved && !isDelivered) {
        itemDiv.querySelector(`#app-${orderId}`).addEventListener("click", () => {
          approveOrder(userId, orderId, giftName);
        });
        itemDiv.querySelector(`#rej-${orderId}`).addEventListener("click", () => {
          rejectOrder(userId, orderId, giftName, giftPoints, orderCount, giftId, giftImage);
        });
      } else if (isApproved && !isDelivered) {
        itemDiv.querySelector(`#del-${orderId}`).addEventListener("click", () => {
          markDelivered(userId, orderId, giftName);
        });
      }

      container.appendChild(itemDiv);
    });
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error">تعذر جلب الطلبات</div>`;
  }
}

async function approveOrder(userId, orderId, giftName) {
  if (!confirm(`هل أنت متأكد من قبول طلب الهدية (${giftName})؟`)) return;
  try {
    await db.collection("users").doc(userId).collection("basket").doc(orderId).update({
      isApproved: true,
      approvedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("myNewCollection").add({
      title: "تمت الموافقة على طلب الهدية! 🎉",
      body: `تم قبول طلبك لـ (${giftName}) بنجاح، توجه لتستلمها قريباً.`,
      targetType: "specific",
      targetUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("تم قبول الطلب وإرسال إشعار للمخدوم ✅");
    document.getElementById(`basket-${userId}`).style.display = "none";
    toggleUserBasket(userId);
  } catch (error) {
    console.error("Approval error:", error);
    alert("حدث خطأ أثناء قبول الطلب.");
  }
}

async function rejectOrder(userId, orderId, giftName, giftPoints, orderCount, giftId, giftImage) {
  const reason = prompt("الرجاء كتابة سبب رفض الهدية:");
  if (reason === null) return;

  try {
    const userRef = db.collection("users").doc(userId);
    const orderRef = userRef.collection("basket").doc(orderId);
    const giftRef = (giftId && giftId !== "undefined" && giftId !== "null") ? db.collection("gifts").doc(giftId) : null;

    await db.runTransaction(async (transaction) => {
      const userDoc = await transaction.get(userRef);
      if (!userDoc.exists) throw new Error("USER_NOT_FOUND");

      let freshGiftDoc = null;
      if (giftRef) {
        freshGiftDoc = await transaction.get(giftRef);
      }

      const currentPoints = Number(userDoc.data().points) || 0;
      const pointsToRefund = Number(giftPoints) * Number(orderCount);

      transaction.update(userRef, {
        points: currentPoints + pointsToRefund,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      if (giftRef) {
        if (freshGiftDoc && freshGiftDoc.exists) {
          const currentQty = Number(freshGiftDoc.data().quantity) || 0;
          transaction.update(giftRef, {
            quantity: currentQty + Number(orderCount),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          transaction.set(giftRef, {
            name: giftName,
            points: Number(giftPoints),
            image: giftImage || "",
            quantity: Number(orderCount),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }

      transaction.delete(orderRef);
    });

    await db.collection("myNewCollection").add({
      title: "عذراً، تم رفض طلب الهدية ❌",
      body: `تم رفض طلبك لـ (${giftName}). السبب: ${reason || "لم يكتب سبب"}. تمت إعادة النقاط لحسابك.`,
      targetType: "specific",
      targetUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("تم رفض الطلب، إرجاع النقاط للمخدوم، وإرجاع الهدية للمتجر بنجاح ✅");
    document.getElementById(`basket-${userId}`).style.display = "none";
    toggleUserBasket(userId);
  } catch (error) {
    console.error("Rejection error:", error);
    alert("حدث خطأ أثناء رفض الطلب وإرجاع النقاط: " + error.message);
  }
}

async function markDelivered(userId, orderId, giftName) {
  if (!confirm(`هل تم تسليم الهدية (${giftName}) للمخدوم؟`)) return;
  try {
    await db.collection("users").doc(userId).collection("basket").doc(orderId).update({
      isDelivered: true,
      deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
      deliveredBy: currentAdminUsername
    });

    await db.collection("myNewCollection").add({
      title: "تم تسليم الهدية بنجاح 🎁✨",
      body: `استلمت هديتك (${giftName}). نتمنى أن تنال إعجابك!`,
      targetType: "specific",
      targetUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("تم تسجيل التسليم بنجاح ✅");
    document.getElementById(`basket-${userId}`).style.display = "none";
    toggleUserBasket(userId);
  } catch (error) {
    console.error("Delivery error:", error);
    alert("حدث خطأ أثناء تسجيل التسليم.");
  }
}

document.getElementById("searchInput").addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();
  const filtered = allUsers.filter(u => 
    (u.username || "").toLowerCase().includes(query) || 
    (u.fullName || "").toLowerCase().includes(query) || 
    (u.id || "").toLowerCase().includes(query)
  );
  renderUsers(filtered);
});

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>
</body>
</html>
