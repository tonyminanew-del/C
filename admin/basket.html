<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الهدايا - الخادم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
}
body {
  background: #0b0f19;
  color: #fff;
  min-height: 100vh;
  padding: 20px 20px 100px;
}
.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.header {
  background: linear-gradient(135deg, rgba(56, 189, 248, .15), rgba(2, 132, 199, .05));
  border: 1px solid rgba(56, 189, 248, .3);
  border-radius: 22px;
  padding: 20px;
  text-align: center;
}
.header h1 {
  color: #38bdf8;
  font-size: 1.4rem;
  margin-bottom: 5px;
}
.header p {
  color: #94a3b8;
  font-size: .85rem;
}
.box {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 18px;
}
label {
  display: block;
  color: #94a3b8;
  font-size: .85rem;
  margin-bottom: 7px;
}
select, input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: #0f172a;
  color: #fff;
  outline: none;
  font-size: 1rem;
  margin-bottom: 12px;
}
select option {
  background: #0f172a;
  color: #fff;
}
.orders-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.orders-title h2 {
  font-size: 1rem;
}
.count {
  background: #38bdf8;
  color: #07111d;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: .75rem;
  font-weight: 900;
}
.order-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.order-card:hover {
  border-color: rgba(56, 189, 248, .4);
}
.servant-name {
  color: #38bdf8;
  font-size: 1rem;
  font-weight: 900;
  margin-bottom: 4px;
}
.sub-orders-container {
  margin-top: 12px;
  border-top: 1px solid rgba(255,255,255,.1);
  padding-top: 10px;
  display: none;
}
.sub-order-item {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
}
.status {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: .7rem;
  font-weight: 800;
}
.pending {
  color: #fbbf24;
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.25);
}
.delivered-status {
  color: #4ade80;
  background: rgba(74,222,128,.12);
  border: 1px solid rgba(74,222,128,.25);
}
.deliver-btn {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  font-size: .85rem;
}
.empty, .loading, .error {
  text-align: center;
  color: #94a3b8;
  padding: 20px 10px;
  font-size: .9rem;
}
.error { color: #ef4444; }
.loading { color: #38bdf8; }
.bottom-nav {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 450px;
  background: rgba(15,23,42,.92);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 25px;
  display: flex;
  justify-content: space-around;
  padding: 10px;
  z-index: 100;
}
.nav-item {
  color: #94a3b8;
  text-decoration: none;
  font-size: .72rem;
  text-align: center;
}
.nav-icon {
  display: block;
  font-size: 19px;
  margin-bottom: 2px;
}
.nav-item.active {
  color: #38bdf8;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛒 طلبات الهدايا</h1>
    <p>إدارة وتسليم طلبات المخدومين بالمرحلة</p>
  </div>

  <div class="box">
    <label>اختر المرحلة:</label>
    <select id="stageSelect">
      <option value="">-- اختر المرحلة --</option>
      <option value="primary">ابتدائي</option>
      <option value="prep">إعدادي</option>
      <option value="sec">ثانوي</option>
    </select>

    <label>بحث باسم المخدوم:</label>
    <input type="text" id="searchInput" placeholder="اكتب اسم المخدوم للبحث..." disabled>
  </div>

  <div class="box">
    <div class="orders-title">
      <h2>📦 المخدومين</h2>
      <span class="count" id="ordersCount">0</span>
    </div>
    <div id="servantsList">
      <div class="empty">اختر المرحلة لعرض المخدومين والطلبات.</div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item">
    <span class="nav-icon">🏠</span>الرئيسية
  </a>
  <a href="control.html" class="nav-item">
    <span class="nav-icon">⚙️</span>الإدارة
  </a>
  <a href="servant-basket.html" class="nav-item active">
    <span class="nav-icon">🛒</span>الطلبات
  </a>
  <a href="profile.html" class="nav-item">
    <span class="nav-icon">👤</span>البروفايل
  </a>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
  authDomain: "church-7afe1.firebaseapp.com",
  projectId: "church-7afe1",
  storageBucket: "church-7afe1.firebasestorage.app",
  messagingSenderId: "1072334615357",
  appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
  measurementId: "G-E7Q76Z53SB"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
let currentAdmin = null;
let allServants = [];

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "../admin.html";
    return;
  }
  try {
    const adminDoc = await db.collection("admins").doc(user.uid).get();
    if (!adminDoc.exists) {
      alert("هذا الحساب ليس حساب خادم.");
      await auth.signOut();
      return;
    }
    currentAdmin = user;
  } catch (error) {
    console.error(error);
  }
});

// تغيير المرحلة
document.getElementById("stageSelect").addEventListener("change", function() {
  const stage = this.value;
  const searchInput = document.getElementById("searchInput");
  searchInput.value = "";
  
  if (!stage) {
    searchInput.disabled = true;
    document.getElementById("servantsList").innerHTML = `<div class="empty">اختر المرحلة لعرض المخدومين.</div>`;
    document.getElementById("ordersCount").innerText = "0";
    allServants = [];
    return;
  }
  
  searchInput.disabled = false;
  loadServants(stage);
});

// جلب المخدومين بالمرحلة
async function loadServants(stage) {
  const list = document.getElementById("servantsList");
  list.innerHTML = `<div class="loading">جاري تحميل المخدومين...</div>`;
  try {
    const snapshot = await db.collection("servants").where("stage", "==", stage).get();
    allServants = [];
    snapshot.forEach(doc => {
      allServants.push({ id: doc.id, ...doc.data() });
    });
    renderServants(allServants);
  } catch (error) {
    console.error("Servants error:", error);
    list.innerHTML = `<div class="error">⚠️ تعذر جلب المخدومين.</div>`;
  }
}

// عرض قائمة المخدومين
function renderServants(servants) {
  const list = document.getElementById("servantsList");
  list.innerHTML = "";
  document.getElementById("ordersCount").innerText = servants.length;

  if (servants.length === 0) {
    list.innerHTML = `<div class="empty">لا يوجد مخدومين في هذه المرحلة.</div>`;
    return;
  }

  servants.forEach(servant => {
    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div class="servant-name">👤 ${escapeHtml(servant.fullName || "بدون اسم")}</div>
      <div style="font-size: .78rem; color: #94a3b8;">الصف: ${escapeHtml(servant.grade || "غير محدد")} | اضغط لعرض الطلبات</div>
      <div class="sub-orders-container" id="basket-${servant.id}">
        <div class="loading">جاري التحميل...</div>
      </div>
    `;

    card.addEventListener("click", (e) => {
      // منع التداخل عند الضغط على أزرار داخل الكارد
      if (e.target.tagName === 'BUTTON') return;
      toggleServantBasket(servant.id);
    });

    list.appendChild(card);
  });
}

// فتح/إغلاق تفاصيل طلبات المخدوم
async function toggleServantBasket(servantId) {
  const container = document.getElementById(`basket-${servantId}`);
  if (container.style.display === "block") {
    container.style.display = "none";
    return;
  }

  container.style.display = "block";
  try {
    const snapshot = await db.collection("servants").doc(servantId).collection("basket").get();
    if (snapshot.empty) {
      container.innerHTML = `<div class="empty">لا توجد طلبات مسجلة لهذا المخدوم.</div>`;
      return;
    }

    let html = "";
    snapshot.forEach(doc => {
      const order = doc.data();
      const delivered = order.isDelivered === true;
      html += `
        <div class="sub-order-item">
          <div style="font-weight: bold; color: #38bdf8;">🎁 ${escapeHtml(order.name || "هدية")}</div>
          <div style="font-size: .75rem; color: #94a3b8; margin-top: 3px;">الكمية: ${order.count || 1} | النقاط: ${order.points || 0}</div>
          <div>
            <span class="status ${delivered ? "delivered-status" : "pending"}">
              ${delivered ? "تم التسليم ✔️ (طلبات قديمة)" : "قيد الانتظار ⏳ (طلبات جديدة)"}
            </span>
          </div>
          ${!delivered ? `<button class="deliver-btn" onclick="markDelivered('${servantId}', '${doc.id}')">تم التسليم ✅</button>` : ""}
        </div>
      `;
    });
    container.innerHTML = html;
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error">تعذر جلب الطلبات</div>`;
  }
}

// تسليم الطلب
async function markDelivered(servantId, orderId) {
  if (!confirm("هل تم تسليم الهدية للمخدوم؟")) return;
  try {
    await db.collection("servants").doc(servantId).collection("basket").doc(orderId).update({
      isDelivered: true,
      deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
      deliveredBy: currentAdmin.uid
    });
    alert("تم تسجيل التسليم بنجاح ✅");
    toggleServantBasket(servantId); // تحديث القائمة
  } catch (error) {
    console.error("Delivery error:", error);
    alert("حدث خطأ أثناء تسجيل التسليم.");
  }
}

// البحث الحي
document.getElementById("searchInput").addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();
  const filtered = allServants.filter(s => (s.fullName || "").toLowerCase().includes(query));
  renderServants(filtered);
});

// دالة إرسال إشعار للمخدوم عند طلب هدية (تستدعى عند قيام المخدوم بطلب هدية)
async function sendGiftNotification(userId, giftName) {
  try {
    await db.collection("myNewCollection").add({
      title: "طلب هدية جديد 🎁",
      body: `تم استلام طلبك لـ (${giftName}) بنجاح وجاري المراجعة.`,
      targetType: "specific",
      targetUserId: userId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (error) {
    console.error("Error sending notification:", error);
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>
</body>
</html>
