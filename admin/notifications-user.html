<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الإشعارات - بوابة الكنيسة</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(86, 112, 255, .15), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0, 229, 255, .08), transparent 30%),
        #080b14;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* ================= HEADER ================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 11, 20, .90);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bell {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;

      background: linear-gradient(
        145deg,
        #202a4a,
        #10152a
      );

      box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.12);
    }

    .title-box h1 {
      font-size: 21px;
      font-weight: 900;
    }

    .title-box p {
      color: #9da7bd;
      font-size: 12px;
      margin-top: 2px;
    }

    .change-stage {
      border: 0;
      cursor: pointer;
      color: white;
      font-family: inherit;
      font-weight: 800;
      padding: 11px 15px;
      border-radius: 14px;

      background: linear-gradient(
        145deg,
        #293866,
        #18213e
      );

      box-shadow:
        0 7px 20px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.12);

      transition: .2s;
    }

    .change-stage:hover {
      transform: translateY(-2px);
    }

    /* ================= CONTAINER ================= */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px;
    }

    /* ================= STATUS ================= */

    .status-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      padding: 16px 18px;
      margin-bottom: 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(26,34,59,.95),
          rgba(14,19,35,.95)
        );

      border: 1px solid rgba(255,255,255,.08);

      box-shadow:
        0 15px 35px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.05);
    }

    .stage-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stage-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: rgba(255,255,255,.07);
    }

    .stage-info strong {
      display: block;
      font-size: 14px;
    }

    .stage-info span {
      color: #8f9ab2;
      font-size: 12px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #63ff9b;
      font-size: 12px;
      font-weight: 800;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #37ff83;
      box-shadow: 0 0 12px #37ff83;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .45;
        transform: scale(.75);
      }
    }

    /* ================= SEARCH ================= */

    .search-box {
      position: relative;
      margin-bottom: 22px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 50px 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.08);

      outline: none;
      background: rgba(20,26,44,.9);
      color: white;

      font-family: inherit;
      font-size: 14px;

      box-shadow:
        inset 0 2px 10px rgba(0,0,0,.25),
        0 8px 20px rgba(0,0,0,.15);
    }

    .search-box input::placeholder {
      color: #78839c;
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #78839c;
    }

    /* ================= COUNTER ================= */

    .counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .counter h2 {
      font-size: 18px;
      font-weight: 900;
    }

    .count-badge {
      min-width: 38px;
      padding: 5px 10px;
      text-align: center;
      border-radius: 12px;

      background: #24335d;
      color: #7fb1ff;

      font-weight: 900;
      font-size: 13px;
    }

    /* ================= NOTIFICATION CARD ================= */

    .notifications {
      display: grid;
      gap: 15px;
    }

    .notification-card {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(27,35,59,.98),
          rgba(14,19,34,.98)
        );

      border: 1px solid rgba(255,255,255,.07);
      border-radius: 23px;

      padding: 18px;

      box-shadow:
        0 15px 35px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.05);

      transition: .25s;
    }

    .notification-card:hover {
      transform: translateY(-3px);
      border-color: rgba(96,146,255,.3);
    }

    .notification-card.new::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 5px;
      height: 100%;

      background: linear-gradient(
        #4f8cff,
        #7d5cff
      );
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #35477d,
          #1b2648
        );

      font-size: 23px;
      font-weight: 900;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person h3 {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .person small {
      color: #8994ab;
      font-size: 11px;
    }

    .new-label {
      background: rgba(66, 124, 255, .14);
      border: 1px solid rgba(66,124,255,.25);
      color: #76a9ff;

      padding: 5px 9px;
      border-radius: 10px;

      font-size: 10px;
      font-weight: 900;
    }

    /* ================= GIFT ================= */

    .gift-box {
      margin-top: 15px;

      display: flex;
      align-items: center;
      gap: 14px;

      padding: 13px;

      border-radius: 17px;

      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.05);
    }

    .gift-image {
      width: 72px;
      height: 72px;

      border-radius: 15px;

      overflow: hidden;

      background: #101522;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .gift-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gift-details {
      flex: 1;
    }

    .gift-details h4 {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .gift-details p {
      color: #a0a9bd;
      font-size: 12px;
    }

    .gift-points {
      color: #ffd45a;
      font-weight: 900;
    }

    /* ================= META ================= */

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .meta-item {
      padding: 10px;
      border-radius: 13px;

      background: rgba(255,255,255,.035);

      text-align: center;
    }

    .meta-item span {
      display: block;
      color: #7e899f;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .meta-item strong {
      font-size: 12px;
      color: #e8ecf5;
    }

    /* ================= BUTTONS ================= */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 13px;

      color: white;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;

      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .approve {
      background:
        linear-gradient(
          145deg,
          #168a55,
          #0b5c3b
        );

      box-shadow:
        0 8px 20px rgba(0,130,75,.2);
    }

    .reject {
      background:
        linear-gradient(
          145deg,
          #a9344b,
          #712337
        );

      box-shadow:
        0 8px 20px rgba(180,30,60,.18);
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;
      padding: 65px 20px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(25,32,53,.9),
          rgba(14,18,32,.9)
        );

      border: 1px solid rgba(255,255,255,.06);
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .empty h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .empty p {
      color: #7e899f;
      font-size: 13px;
    }

    /* ================= LOADING ================= */

    .loading {
      text-align: center;
      padding: 45px;
      color: #8994aa;
    }

    .spinner {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: 4px solid rgba(255,255,255,.08);
      border-top-color: #5e8cff;

      animation: spin .8s linear infinite;

      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;

      transform: translate(-50%, 30px);

      width: min(90%, 430px);

      padding: 15px 18px;

      border-radius: 17px;

      background: rgba(24,31,51,.96);
      border: 1px solid rgba(255,255,255,.08);

      box-shadow: 0 15px 40px rgba(0,0,0,.4);

      opacity: 0;
      pointer-events: none;

      transition: .3s;

      z-index: 100;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.success {
      border-color: rgba(40,220,130,.3);
    }

    .toast.error {
      border-color: rgba(255,70,90,.3);
    }

    /* ================= STAGE MODAL ================= */

    .stage-overlay {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.78);
      backdrop-filter: blur(12px);
    }

    .stage-overlay.hidden {
      display: none;
    }

    .stage-modal {
      width: min(470px, 100%);

      background:
        linear-gradient(
          145deg,
          #1c2641,
          #0d1324
        );

      border: 1px solid rgba(255,255,255,.1);

      border-radius: 30px;

      padding: 28px 22px;

      box-shadow:
        0 30px 80px rgba(0,0,0,.6),
        inset 0 1px rgba(255,255,255,.08);

      animation: modalIn .3s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-icon {
      width: 75px;
      height: 75px;

      margin: 0 auto 15px;

      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background:
        linear-gradient(
          145deg,
          #31477e,
          #18233f
        );

      box-shadow:
        0 15px 35px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.1);
    }

    .stage-modal h2 {
      text-align: center;
      font-size: 21px;
      font-weight: 900;
    }

    .stage-modal > p {
      text-align: center;
      color: #909bb1;
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .stage-options {
      display: grid;
      gap: 11px;
    }

    .stage-option {
      position: relative;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 18px;

      padding: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.02)
        );

      color: white;

      font-family: inherit;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 14px;

      transition: .2s;
    }

    .stage-option:hover {
      transform: translateY(-2px);
      border-color: rgba(91,137,255,.45);
      background: rgba(66,100,180,.12);
    }

    .stage-option .emoji {
      width: 48px;
      height: 48px;

      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,.06);

      font-size: 25px;
    }

    .stage-option strong {
      display: block;
      font-size: 14px;
      text-align: right;
    }

    .stage-option span {
      display: block;
      color: #7f8ba2;
      font-size: 10px;
      margin-top: 2px;
    }

    .stage-arrow {
      margin-right: auto;
      color: #77839b;
      font-size: 20px;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      z-index: 80;

      background: rgba(8,11,20,.94);
      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(255,255,255,.07);

      padding: 9px 10px;
    }

    .nav-inner {
      max-width: 700px;
      margin: auto;

      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      text-decoration: none;
      color: #727e96;

      min-width: 65px;

      text-align: center;

      font-size: 10px;
      font-weight: 700;
    }

    .nav-item div {
      font-size: 21px;
      margin-bottom: 1px;
    }

    .nav-item.active {
      color: #6e9cff;
    }

    /* ================= MOBILE ================= */

    @media(max-width:600px) {

      .header {
        padding: 13px;
      }

      .title-box h1 {
        font-size: 17px;
      }

      .title-box p {
        font-size: 10px;
      }

      .bell {
        width: 45px;
        height: 45px;
        font-size: 23px;
      }

      .change-stage {
        font-size: 10px;
        padding: 9px 10px;
      }

      .container {
        padding: 18px 12px;
      }

      .status-box {
        padding: 13px;
      }

      .meta {
        grid-template-columns: 1fr 1fr;
      }

      .meta-item:last-child {
        grid-column: 1 / -1;
      }

      .gift-image {
        width: 62px;
        height: 62px;
      }

      .person h3 {
        font-size: 13px;
      }

      .gift-details h4 {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header">
    <div class="header-inner">

      <div class="title-box">

        <div class="bell">
          🔔
        </div>

        <div>
          <h1>الإشعارات</h1>
          <p>طلبات الهدايا الخاصة بمرحلتك</p>
        </div>

      </div>

      <button
        class="change-stage"
        onclick="changeStage()"
      >
        🔄 تغيير المرحلة
      </button>

    </div>
  </header>


  <!-- ================= CONTENT ================= -->

  <main class="container">

    <div class="status-box">

      <div class="stage-info">

        <div class="stage-icon" id="stageIcon">
          📚
        </div>

        <div>
          <strong id="stageName">
            جاري تحديد المرحلة...
          </strong>

          <span>
            يتم تحديث الإشعارات تلقائيًا
          </span>
        </div>

      </div>

      <div class="live">
        <span class="live-dot"></span>
        مباشر
      </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        type="text"
        id="searchInput"
        placeholder="ابحث باسم المخدوم أو الهدية..."
      >

    </div>


    <!-- COUNTER -->

    <div class="counter">

      <h2>
        🔔 طلبات الهدايا الجديدة
      </h2>

      <span
        class="count-badge"
        id="countBadge"
      >
        0
      </span>

    </div>


    <!-- NOTIFICATIONS -->

    <div
      class="notifications"
      id="notifications"
    >

      <div class="loading">

        <div class="spinner"></div>

        جاري تحميل الإشعارات...

      </div>

    </div>

  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom-nav">

    <div class="nav-inner">

      <a
        href="home.html"
        class="nav-item"
      >
        <div>🏠</div>
        الرئيسية
      </a>

      <a
        href="control.html"
        class="nav-item"
      >
        <div>⚙️</div>
        التحكم
      </a>

      <a
        href="servant-basket.html"
        class="nav-item"
      >
        <div>🎁</div>
        الطلبات
      </a>

      <a
        href="notifications-user.html"
        class="nav-item active"
      >
        <div>🔔</div>
        الإشعارات
      </a>

      <a
        href="profile.html"
        class="nav-item"
      >
        <div>👤</div>
        حسابي
      </a>

    </div>

  </nav>


  <!-- ================= TOAST ================= -->

  <div
    class="toast"
    id="toast"
  ></div>


  <!-- ================= STAGE MODAL ================= -->

  <div
    class="stage-overlay"
    id="stageOverlay"
  >

    <div class="stage-modal">

      <div class="modal-icon">
        🙋‍♂️
      </div>

      <h2>
        أهلاً بيك 👋
      </h2>

      <p>
        قبل ما نبدأ، أنت خادم في مرحلة إيه؟
      </p>

      <div class="stage-options">

        <button
          class="stage-option"
          onclick="selectStage('primary')"
        >

          <div class="emoji">
            🟢
          </div>

          <div>
            <strong>المرحلة الابتدائية</strong>
            <span>طلبات وخدمات المرحلة الابتدائية</span>
          </div>

          <div class="stage-arrow">
            ‹
          </div>

        </button>


        <button
          class="stage-option"
          onclick="selectStage('prep')"
        >

          <div class="emoji">
            🔵
          </div>

          <div>
            <strong>المرحلة الإعدادية</strong>
            <span>طلبات وخدمات المرحلة الإعدادية</span>
          </div>

          <div class="stage-arrow">
            ‹
          </div>

        </button>


        <button
          class="stage-option"
          onclick="selectStage('sec')"
        >

          <div class="emoji">
            🟣
          </div>

          <div>
            <strong>المرحلة الثانوية</strong>
            <span>طلبات وخدمات المرحلة الثانوية</span>
          </div>

          <div class="stage-arrow">
            ‹
          </div>

        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       FIREBASE
    ===================================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    /* =====================================================
       GLOBAL
    ===================================================== */

    let currentStage = null;

    let currentAdminUsername = null;

    let allNotifications = [];

    let basketListeners = [];

    let usersListener = null;


    /* =====================================================
       STAGE INFO
    ===================================================== */

    const stageInfo = {

      primary: {
        name: "المرحلة الابتدائية",
        icon: "🟢"
      },

      prep: {
        name: "المرحلة الإعدادية",
        icon: "🔵"
      },

      sec: {
        name: "المرحلة الثانوية",
        icon: "🟣"
      }

    };


    /* =====================================================
       INIT
    ===================================================== */

    document.addEventListener("DOMContentLoaded", async () => {

      currentAdminUsername =
        localStorage.getItem("currentUsername");

      const userRole =
        localStorage.getItem("userRole");


      /*
        نفس نظام تسجيل الدخول الموجود عندك
      */

      if (!currentAdminUsername) {

        window.location.href = "../t.html";

        return;

      }


      try {

        const adminRef =
          db.collection("admins")
            .doc(currentAdminUsername);

        const adminDoc =
          await adminRef.get();


        if (
          !adminDoc.exists &&
          userRole !== "admin"
        ) {

          alert("ليس لديك صلاحية الدخول.");

          window.location.href = "../t.html";

          return;

        }

      } catch (error) {

        console.error(error);

        showToast(
          "حدث خطأ أثناء التحقق من الحساب",
          "error"
        );

        return;

      }


      /*
        شوف هل الخادم اختار مرحلة قبل كده
      */

      const savedStage =
        localStorage.getItem(
          "servantNotificationStage"
        );


      if (
        savedStage &&
        stageInfo[savedStage]
      ) {

        setStage(savedStage);

      } else {

        /*
          أول مرة فقط
        */

        document
          .getElementById("stageOverlay")
          .classList.remove("hidden");

      }


      /*
        البحث
      */

      document
        .getElementById("searchInput")
        .addEventListener(
          "input",
          renderNotifications
        );

    });


    /* =====================================================
       SELECT STAGE
    ===================================================== */

    function selectStage(stage) {

      if (!stageInfo[stage]) return;


      localStorage.setItem(
        "servantNotificationStage",
        stage
      );


      setStage(stage);


      document
        .getElementById("stageOverlay")
        .classList.add("hidden");


      showToast(
        `تم اختيار ${stageInfo[stage].name} ✅`,
        "success"
      );

    }


    /* =====================================================
       CHANGE STAGE
    ===================================================== */

    function changeStage() {

      document
        .getElementById("stageOverlay")
        .classList.remove("hidden");

    }


    /* =====================================================
       SET STAGE
    ===================================================== */

    function setStage(stage) {

      currentStage = stage;


      document
        .getElementById("stageName")
        .textContent =
        stageInfo[stage].name;


      document
        .getElementById("stageIcon")
        .textContent =
        stageInfo[stage].icon;


      startRealtimeNotifications();

    }


    /* =====================================================
       STOP LISTENERS
    ===================================================== */

    function stopListeners() {

      if (usersListener) {

        usersListener();

        usersListener = null;

      }


      basketListeners.forEach(
        unsubscribe => {

          try {

            unsubscribe();

          } catch (e) {}

        }
      );


      basketListeners = [];

    }


    /* =====================================================
       REALTIME NOTIFICATIONS
    ===================================================== */

    function startRealtimeNotifications() {

      if (!currentStage) return;


      stopListeners();


      allNotifications = [];


      showLoading();


      /*
        نجيب كل المخدومين في المرحلة
      */

      usersListener =
        db.collection("users")
          .where(
            "stage",
            "==",
            currentStage
          )
          .onSnapshot(
            snapshot => {

              /*
                امسح بيانات الطلبات القديمة
              */

              allNotifications = [];


              /*
                إلغاء listeners القديمة
              */

              basketListeners.forEach(
                unsubscribe => {

                  try {
                    unsubscribe();
                  } catch (e) {}

                }
              );


              basketListeners = [];


              if (snapshot.empty) {

                renderNotifications();

                return;

              }


              /*
                لكل مخدوم نراقب السلة
              */

              snapshot.forEach(userDoc => {

                listenToUserBasket(
                  userDoc.id,
                  userDoc.data()
                );

              });

            },

            error => {

              console.error(
                "Users listener error:",
                error
              );

              showToast(
                "حدث خطأ أثناء تحميل المخدومين",
                "error"
              );

            }
          );

    }


    /* =====================================================
       LISTEN TO USER BASKET
    ===================================================== */

    function listenToUserBasket(
      userId,
      user
    ) {

      const unsubscribe =
        db.collection("users")
          .doc(userId)
          .collection("basket")
          .where(
            "isApproved",
            "==",
            false
          )
          .onSnapshot(
            snapshot => {

              /*
                احذف الطلبات القديمة لهذا المستخدم
              */

              allNotifications =
                allNotifications.filter(
                  item =>
                    item.userId !== userId
                );


              snapshot.forEach(orderDoc => {

                const order =
                  orderDoc.data();


                /*
                  لو الطلب اتسلم أو اتوافق عليه
                  مش هيظهر في الإشعارات
                */

                if (
                  order.isApproved === true ||
                  order.isDelivered === true
                ) {

                  return;

                }


                allNotifications.push({

                  id: orderDoc.id,

                  userId,

                  servantName:
                    user.fullName ||
                    user.username ||
                    "مخدوم",

                  servantImage:
                    user.photoBase64 ||
                    user.image ||
                    user.photo ||
                    "",

                  stage:
                    user.stage ||
                    currentStage,

                  giftId:
                    order.giftId ||
                    "",

                  giftName:
                    order.name ||
                    order.giftName ||
                    "هدية",

                  giftImage:
                    order.image ||
                    "",

                  points:
                    Number(order.points || 0),

                  count:
                    Number(order.count || 1),

                  createdAt:
                    order.createdAt || null

                });

              });


              renderNotifications();

            },

            error => {

              console.error(
                "Basket listener error:",
                error
              );

            }
          );


      basketListeners.push(unsubscribe);

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderNotifications() {

      const container =
        document.getElementById(
          "notifications"
        );


      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      let filtered =
        allNotifications.filter(item => {

          if (!search) return true;


          return (

            item.servantName
              .toLowerCase()
              .includes(search)

            ||

            item.giftName
              .toLowerCase()
              .includes(search)

          );

        });


      /*
        الأحدث أولاً
      */

      filtered.sort((a, b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      });


      document
        .getElementById("countBadge")
        .textContent =
        filtered.length;


      if (!filtered.length) {

        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🔔
            </div>

            <h3>
              لا توجد إشعارات جديدة
            </h3>

            <p>
              عندما يطلب أحد المخدومين في
              ${stageInfo[currentStage]?.name || "مرحلتك"}
              هدية، سيظهر الطلب هنا تلقائيًا.
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML = "";


      filtered.forEach(notification => {

        container.appendChild(
          createNotificationCard(
            notification
          )
        );

      });

    }


    /* =====================================================
       CREATE CARD
    ===================================================== */

    function createNotificationCard(
      notification
    ) {

      const card =
        document.createElement("div");


      card.className =
        "notification-card new";


      card.dataset.id =
        notification.id;


      card.dataset.userId =
        notification.userId;


      const totalPoints =
        notification.points *
        notification.count;


      let dateText =
        "منذ قليل";


      if (
        notification.createdAt &&
        notification.createdAt.toDate
      ) {

        dateText =
          formatDate(
            notification.createdAt.toDate()
          );

      }


      let avatarHTML =
        "👤";


      if (
        notification.servantImage
      ) {

        avatarHTML = `

          <img
            src="${escapeHtml(
              notification.servantImage
            )}"
            alt=""
          >

        `;

      }


      let giftHTML =
        "🎁";


      if (
        notification.giftImage
      ) {

        giftHTML = `

          <img
            src="${escapeHtml(
              notification.giftImage
            )}"
            alt=""
          >

        `;

      }


      card.innerHTML = `

        <div class="top-row">

          <div class="person">

            <div class="avatar">
              ${avatarHTML}
            </div>

            <div>

              <h3>
                ${escapeHtml(
                  notification.servantName
                )}
              </h3>

              <small>
                طلب هدية جديدة 🎁
              </small>

            </div>

          </div>

          <div class="new-label">
            جديد
          </div>

        </div>


        <div class="gift-box">

          <div class="gift-image">
            ${giftHTML}
          </div>

          <div class="gift-details">

            <h4>
              ${escapeHtml(
                notification.giftName
              )}
            </h4>

            <p>
              ⭐
              <span class="gift-points">
                ${notification.points}
              </span>
              نقطة للقطعة
            </p>

          </div>

        </div>


        <div class="meta">

          <div class="meta-item">

            <span>
              العدد
            </span>

            <strong>
              ${notification.count}
            </strong>

          </div>


          <div class="meta-item">

            <span>
              إجمالي النقاط
            </span>

            <strong>
              ⭐ ${totalPoints}
            </strong>

          </div>


          <div class="meta-item">

            <span>
              وقت الطلب
            </span>

            <strong>
              ${dateText}
            </strong>

          </div>

        </div>


        <div class="actions">

          <button
            class="btn approve"
            onclick="approveOrder(
              '${escapeAttr(notification.userId)}',
              '${escapeAttr(notification.id)}',
              this
            )"
          >
            ✅ قبول الطلب
          </button>


          <button
            class="btn reject"
            onclick="rejectOrder(
              '${escapeAttr(notification.userId)}',
              '${escapeAttr(notification.id)}',
              this
            )"
          >
            ❌ رفض الطلب
          </button>

        </div>

      `;


      return card;

    }


    /* =====================================================
       APPROVE
    ===================================================== */

    async function approveOrder(
      userId,
      orderId,
      button
    ) {

      const card =
        button.closest(
          ".notification-card"
        );


      const notification =
        allNotifications.find(
          item =>
            item.userId === userId &&
            item.id === orderId
        );


      if (!notification) {

        showToast(
          "الطلب غير موجود",
          "error"
        );

        return;

      }


      const confirmed =
        confirm(
          `هل تريد قبول طلب ${notification.servantName} للهدية "${notification.giftName}"؟`
        );


      if (!confirmed) return;


      button.disabled = true;


      try {

        const orderRef =
          db.collection("users")
            .doc(userId)
            .collection("basket")
            .doc(orderId);


        const orderSnap =
          await orderRef.get();


        if (!orderSnap.exists) {

          throw new Error(
            "الطلب غير موجود"
          );

        }


        const order =
          orderSnap.data();


        if (
          order.isApproved === true
        ) {

          showToast(
            "تم قبول الطلب بالفعل",
            "error"
          );

          return;

        }


        if (
          order.isDelivered === true
        ) {

          showToast(
            "تم تسليم هذا الطلب بالفعل",
            "error"
          );

          return;

        }


        /*
          قبول الطلب
        */

        await orderRef.update({

          isApproved: true,

          approvedAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp(),

          approvedBy:
            currentAdminUsername

        });


        /*
          إشعار للمخدوم
        */

        await db
          .collection("myNewCollection")
          .add({

            title:
              "تمت الموافقة على طلب الهدية! 🎉",

            body:
              `تم قبول طلبك لـ (${notification.giftName}) بنجاح، توجه لتستلمها قريباً.`,

            targetType:
              "specific",

            targetUserId:
              userId,

            type:
              "gift_approved",

            giftName:
              notification.giftName,

            orderId,

            createdAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


        /*
          إزالة الكارت فورًا
        */

        if (card) {

          card.style.opacity = "0";
          card.style.transform =
            "translateX(-30px)";

          setTimeout(() => {

            card.remove();

            allNotifications =
              allNotifications.filter(
                item =>
                  !(
                    item.userId === userId &&
                    item.id === orderId
                  )
              );

            renderNotifications();

          }, 250);

        }


        showToast(
          "تم قبول الطلب وإرسال إشعار للمخدوم ✅",
          "success"
        );


      } catch (error) {

        console.error(
          "Approve error:",
          error
        );


        button.disabled = false;


        showToast(
          "حدث خطأ أثناء قبول الطلب",
          "error"
        );

      }

    }


    /* =====================================================
       REJECT
    ===================================================== */

    async function rejectOrder(
      userId,
      orderId,
      button
    ) {

      const notification =
        allNotifications.find(
          item =>
            item.userId === userId &&
            item.id === orderId
        );


      if (!notification) {

        showToast(
          "الطلب غير موجود",
          "error"
        );

        return;

      }


      const reason =
        prompt(
          "اكتب سبب رفض الطلب:\n\n(يمكنك تركه فارغًا)"
        );


      if (reason === null) return;


      const confirmed =
        confirm(
          `هل تريد رفض طلب ${notification.servantName} وإعادة النقاط؟`
        );


      if (!confirmed) return;


      button.disabled = true;


      try {

        const userRef =
          db.collection("users")
            .doc(userId);


        const orderRef =
          userRef
            .collection("basket")
            .doc(orderId);


        const giftRef =
          db.collection("gifts")
            .doc(notification.giftId);


        await db.runTransaction(
          async transaction => {

            const orderSnap =
              await transaction.get(
                orderRef
              );


            if (!orderSnap.exists) {

              throw new Error(
                "الطلب غير موجود"
              );

            }


            const order =
              orderSnap.data();


            if (
              order.isApproved === true
            ) {

              throw new Error(
                "تم قبول الطلب بالفعل"
              );

            }


            const userSnap =
              await transaction.get(
                userRef
              );


            if (!userSnap.exists) {

              throw new Error(
                "المخدوم غير موجود"
              );

            }


            const userData =
              userSnap.data();


            const refundPoints =
              Number(order.points || 0) *
              Number(order.count || 1);


            const currentPoints =
              Number(userData.points || 0);


            /*
              إعادة النقاط
            */

            transaction.update(
              userRef,
              {

                points:
                  currentPoints +
                  refundPoints

              }
            );


            /*
              إعادة الكمية للمخزن
            */

            if (
              notification.giftId
            ) {

              const giftSnap =
                await transaction.get(
                  giftRef
                );


              if (giftSnap.exists) {

                const giftData =
                  giftSnap.data();


                transaction.update(
                  giftRef,
                  {

                    quantity:
                      Number(
                        giftData.quantity || 0
                      ) +
                      Number(
                        order.count || 1
                      )

                  }
                );

              }

            }


            /*
              حذف الطلب
            */

            transaction.delete(
              orderRef
            );

          }
        );


        /*
          إشعار الرفض للمخدوم
        */

        await db
          .collection("myNewCollection")
          .add({

            title:
              "عذراً، تم رفض طلب الهدية ❌",

            body:
              `تم رفض طلبك لـ (${notification.giftName}). السبب: ${reason || "لم يكتب سبب"}. تمت إعادة النقاط لحسابك.`,

            targetType:
              "specific",

            targetUserId:
              userId,

            type:
              "gift_rejected",

            giftName:
              notification.giftName,

            orderId,

            reason:
              reason || "",

            createdAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


        /*
          إزالة الكارت
        */

        const card =
          button.closest(
            ".notification-card"
          );


        if (card) {

          card.style.opacity = "0";
          card.style.transform =
            "translateX(-30px)";

          setTimeout(() => {

            card.remove();

            allNotifications =
              allNotifications.filter(
                item =>
                  !(
                    item.userId === userId &&
                    item.id === orderId
                  )
              );

            renderNotifications();

          }, 250);

        }


        showToast(
          "تم رفض الطلب وإعادة النقاط للمخدوم ✅",
          "success"
        );


      } catch (error) {

        console.error(
          "Reject error:",
          error
        );


        button.disabled = false;


        showToast(
          error.message ||
          "حدث خطأ أثناء رفض الطلب",
          "error"
        );

      }

    }


    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(date) {

      try {

        return date.toLocaleString(
          "ar-EG",
          {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      } catch (e) {

        return "منذ قليل";

      }

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeAttr(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function showLoading() {

      document
        .getElementById("notifications")
        .innerHTML = `

          <div class="loading">

            <div class="spinner"></div>

            جاري تحميل الإشعارات...

          </div>

        `;

    }


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer = null;


    function showToast(
      message,
      type = "success"
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.className =
        `toast ${type} show`;


      clearTimeout(toastTimer);


      toastTimer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 3500);

    }


    /* =====================================================
       PAGE CLOSE
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        stopListeners();

      }
    );

  </script>

</body>
</html>
