<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    لوحة الإدارة - التحكم بالمخدومين
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }


    body {

      background-color: #0b0f19;

      color: #fff;

      min-height: 100vh;

      padding: 20px;

      display: flex;

      justify-content: center;

    }


    .admin-container {

      width: 100%;

      max-width: 600px;

      display: flex;

      flex-direction: column;

      gap: 20px;

    }


    .header-card {

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.1);

      border-radius: 20px;

      padding: 20px;

      backdrop-filter:
        blur(10px);

    }


    .header-card h2 {

      color: #38bdf8;

      font-size: 1.5rem;

      text-align: center;

      margin-bottom: 10px;

    }


    .form-group {

      display: flex;

      flex-direction: column;

      gap: 8px;

      margin-bottom: 15px;

    }


    label {

      font-size: .9rem;

      color: #94a3b8;

    }


    select,
    input {

      width: 100%;

      padding: 12px;

      background:
        rgba(15,23,42,.8);

      border:
        1px solid rgba(255,255,255,.15);

      border-radius: 12px;

      color: #fff;

      font-size: 1rem;

      outline: none;

    }


    select option {

      background: #0f172a;

      color: #fff;

    }


    .search-box {

      display: flex;

      gap: 8px;

    }


    .btn-main {

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #0284c7
        );

      color: #fff;

      border: none;

      padding: 12px;

      border-radius: 12px;

      font-weight: 700;

      cursor: pointer;

      transition: .3s;

      white-space: nowrap;

    }


    .btn-main:hover {

      opacity: .9;

      transform:
        translateY(-1px);

    }


    .lock-box {

      background:
        rgba(239,68,68,.1);

      border:
        1px solid rgba(239,68,68,.3);

      padding: 15px;

      border-radius: 15px;

      margin-top: 10px;

    }


    .servants-list {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .servant-card {

      background:
        rgba(255,255,255,.03);

      border:
        1px solid rgba(255,255,255,.1);

      border-radius: 16px;

      padding: 15px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      cursor: pointer;

      transition: .3s;

    }


    .servant-card:hover {

      border-color:
        #38bdf8;

      background:
        rgba(56,189,248,.05);

    }


    .servant-card.blocked {

      border-color:
        #ef4444;

      background:
        rgba(239,68,68,.05);

    }


    .badge-blocked {

      background:
        #ef4444;

      color: #fff;

      font-size: .75rem;

      padding: 2px 8px;

      border-radius: 6px;

      margin-right: 5px;

    }


    .modal-overlay {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background:
        rgba(0,0,0,.8);

      display: none;

      justify-content: center;

      align-items: center;

      padding: 20px;

      z-index: 1000;

    }


    .modal-content {

      background: #0f172a;

      border:
        1px solid rgba(255,255,255,.2);

      border-radius: 20px;

      width: 100%;

      max-width: 450px;

      padding: 20px;

      position: relative;

      max-height: 90vh;

      overflow-y: auto;

    }


    .close-btn {

      position: absolute;

      top: 15px;

      left: 15px;

      background: none;

      border: none;

      color: #94a3b8;

      font-size: 1.5rem;

      cursor: pointer;

    }


    .points-control {

      display: flex;

      align-items: center;

      gap: 8px;

    }


    .btn-qty {

      background:
        #38bdf8;

      color: #000;

      border: none;

      width: 40px;

      height: 40px;

      border-radius: 10px;

      font-size: 1rem;

      font-weight: bold;

      cursor: pointer;

    }


    .btn-block {

      background:
        #ef4444;

      color: #fff;

      border: none;

      padding: 10px;

      border-radius: 10px;

      font-weight: bold;

      cursor: pointer;

      width: 100%;

      margin-top: 10px;

    }


    .btn-unblock {

      background:
        #22c55e;

      color: #fff;

      border: none;

      padding: 10px;

      border-radius: 10px;

      font-weight: bold;

      cursor: pointer;

      width: 100%;

      margin-top: 10px;

    }


    .hidden {

      display: none !important;

    }

  </style>

</head>


<body>


  <div class="admin-container">


    <!-- العنوان -->

    <div class="header-card">

      <h2>
        ⚙️ لوحة إدارة المخدومين
      </h2>

    </div>


    <!-- اختيار المرحلة -->

    <div class="header-card">

      <div class="form-group">

        <label>
          اختر المرحلة الدراسية:
        </label>

        <select
          id="stageSelect"
          onchange="resetLock()"
        >

          <option value="">
            -- اختر المرحلة --
          </option>

          <option value="primary">
            ابتدائي
          </option>

          <option value="prep">
            إعدادي
          </option>

          <option value="sec">
            ثانوي
          </option>

        </select>

      </div>


      <!-- كلمة السر -->

      <div
        id="lockBox"
        class="lock-box hidden"
      >

        <div class="form-group">

          <label>
            🔒 أدخل كلمة سر المرحلة:
          </label>

          <input
            type="password"
            id="stagePassword"
            placeholder="كلمة السر"
          >

        </div>


        <button
          class="btn-main"
          style="width:100%;"
          onclick="verifyPassword()"
        >
          فتح القفل 🔓
        </button>

      </div>

    </div>


    <!-- البحث -->

    <div
      id="unlockedSection"
      class="header-card hidden"
    >

      <div class="form-group">

        <label>
          اختر الصف الدراسي:
        </label>

        <select
          id="gradeSelect"
          onchange="fetchServants()"
        >
        </select>

      </div>


      <div class="form-group">

        <label>
          🔍 البحث عن مخدوم:
        </label>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="اكتب اسم المخدوم..."
            oninput="executeSearch()"
          >

          <button
            class="btn-main"
            onclick="executeSearch()"
          >
            بحث 🔍
          </button>

        </div>

      </div>

    </div>


    <!-- القائمة -->

    <div
      id="servantsList"
      class="servants-list"
    >
    </div>

  </div>


  <!-- Modal -->

  <div
    id="editModal"
    class="modal-overlay"
  >

    <div class="modal-content">

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ✕
      </button>


      <h3
        style="
          margin-bottom:15px;
          color:#38bdf8;
        "
      >
        تعديل بيانات المخدوم
      </h3>


      <input
        type="hidden"
        id="editUserId"
      >


      <!-- الاسم -->

      <div class="form-group">

        <label>
          الاسم الكامل:
        </label>

        <input
          type="text"
          id="editName"
        >

      </div>


      <!-- الهاتف -->

      <div class="form-group">

        <label>
          رقم الهاتف:
        </label>

        <input
          type="text"
          id="editPhone"
        >

      </div>


      <!-- النقاط -->

      <div class="form-group">

        <label>
          النقاط الحالية:
        </label>

        <div class="points-control">

          <button
            class="btn-qty"
            onclick="changePoints(-5)"
          >
            -5
          </button>

          <button
            class="btn-qty"
            onclick="changePoints(-1)"
          >
            -1
          </button>

          <input
            type="number"
            id="editPoints"
            style="
              text-align:center;
              font-weight:bold;
              font-size:1.2rem;
            "
          >

          <button
            class="btn-qty"
            onclick="changePoints(1)"
          >
            +1
          </button>

          <button
            class="btn-qty"
            onclick="changePoints(5)"
          >
            +5
          </button>

        </div>

      </div>


      <!-- حفظ -->

      <button
        class="btn-main"
        style="
          width:100%;
          margin-top:15px;
        "
        onclick="saveServantData()"
      >
        حفظ التعديلات 💾
      </button>


      <!-- حظر -->

      <div id="blockBtnContainer">
      </div>

    </div>

  </div>


  <script>


    /* =========================
       Firebase
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",

      authDomain:
        "church-7afe1.firebaseapp.com",

      projectId:
        "church-7afe1",

      storageBucket:
        "church-7afe1.firebasestorage.app",

      messagingSenderId:
        "1072334615357",

      appId:
        "1:1072334615357:web:c03b199f00ea9d19d40b54",

      measurementId:
        "G-E7Q76Z53SB"

    };


    if (!firebase.apps.length) {

      firebase.initializeApp(
        firebaseConfig
      );

    }


    const db =
      firebase.firestore();


    /* =========================
       كلمات السر
    ========================= */

    const stagePasswords = {

      primary: "344",

      prep: "455",

      sec: "899"

    };


    /* =========================
       الصفوف
    ========================= */

    const stageGrades = {

      primary: [

        "الصف الأول الابتدائي",

        "الصف الثاني الابتدائي",

        "الصف الثالث الابتدائي",

        "الصف الرابع الابتدائي",

        "الصف الخامس الابتدائي",

        "الصف السادس الابتدائي"

      ],


      prep: [

        "الصف الأول الإعدادي",

        "الصف الثاني الإعدادي",

        "الصف الثالث الإعدادي"

      ],


      sec: [

        "الصف الأول الثانوي",

        "الصف الثاني الثانوي",

        "الصف الثالث الثانوي"

      ]

    };


    let allServantsData = [];

    let unsubscribeListener = null;


    /* =========================
       إعادة القفل
    ========================= */

    function resetLock() {

      if (unsubscribeListener) {

        unsubscribeListener();

        unsubscribeListener = null;

      }


      const stage =
        document
          .getElementById("stageSelect")
          .value;


      const lockBox =
        document.getElementById("lockBox");


      const unlockedSection =
        document.getElementById(
          "unlockedSection"
        );


      document
        .getElementById("servantsList")
        .innerHTML = "";


      document
        .getElementById("searchInput")
        .value = "";


      if (stage) {

        lockBox
          .classList
          .remove("hidden");

        unlockedSection
          .classList
          .add("hidden");

        document
          .getElementById(
            "stagePassword"
          )
          .value = "";

      }

      else {

        lockBox
          .classList
          .add("hidden");

        unlockedSection
          .classList
          .add("hidden");

      }

    }


    /* =========================
       التحقق من كلمة السر
    ========================= */

    function verifyPassword() {

      const stage =
        document
          .getElementById(
            "stageSelect"
          )
          .value;


      const password =
        document
          .getElementById(
            "stagePassword"
          )
          .value;


      if (
        stagePasswords[stage] ===
        password
      ) {

        alert(
          "تم فتح القفل بنجاح! 🔓"
        );


        document
          .getElementById("lockBox")
          .classList
          .add("hidden");


        document
          .getElementById(
            "unlockedSection"
          )
          .classList
          .remove("hidden");


        populateGrades(stage);

      }

      else {

        alert(
          "كلمة السر خاطئة! ❌"
        );

      }

    }


    /* =========================
       إضافة الصفوف
    ========================= */

    function populateGrades(stage) {

      const gradeSelect =
        document
          .getElementById(
            "gradeSelect"
          );


      gradeSelect.innerHTML =
        `
        <option value="">
          -- اختر الصف --
        </option>
        `;


      stageGrades[stage]
        .forEach((grade) => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            grade;

          option.textContent =
            grade;

          gradeSelect
            .appendChild(option);

        });

    }


    /* =========================
       جلب المخدومين
    ========================= */

    function fetchServants() {

      const stage =
        document
          .getElementById(
            "stageSelect"
          )
          .value;


      const grade =
        document
          .getElementById(
            "gradeSelect"
          )
          .value;


      const listContainer =
        document
          .getElementById(
            "servantsList"
          );


      if (unsubscribeListener) {

        unsubscribeListener();

        unsubscribeListener = null;

      }


      if (!stage || !grade) {

        listContainer.innerHTML = "";

        return;

      }


      listContainer.innerHTML =
        `
        <div
          style="
            text-align:center;
            color:#94a3b8;
          "
        >
          جاري تحميل الأسماء...
        </div>
        `;


      unsubscribeListener =
        db
          .collection("servants")
          .where(
            "stage",
            "==",
            stage
          )
          .where(
            "grade",
            "==",
            grade
          )
          .onSnapshot(

            (snapshot) => {

              allServantsData = [];


              if (snapshot.empty) {

                listContainer.innerHTML =
                  `
                  <div
                    style="
                      text-align:center;
                      color:#94a3b8;
                    "
                  >
                    لا يوجد مخدومين في هذا الصف
                  </div>
                  `;

                return;

              }


              snapshot.forEach(
                (doc) => {

                  const data =
                    doc.data();

                  data.id =
                    doc.id;

                  allServantsData
                    .push(data);

                }
              );


              executeSearch();

            },


            (error) => {

              console.error(
                "Firestore Error:",
                error
              );


              listContainer.innerHTML =
                `
                <div
                  style="
                    text-align:center;
                    color:#ef4444;
                    padding:15px;
                  "
                >
                  ⚠️ تعذر جلب البيانات.
                  <br>
                  تأكد من صلاحيات Firestore.
                </div>
                `;

            }

          );

    }


    /* =========================
       عرض القائمة
    ========================= */

    function renderServantsList(list) {

      const listContainer =
        document
          .getElementById(
            "servantsList"
          );


      listContainer.innerHTML = "";


      if (list.length === 0) {

        listContainer.innerHTML =
          `
          <div
            style="
              text-align:center;
              color:#94a3b8;
            "
          >
            لم يتم العثور على أي نتائج
          </div>
          `;

        return;

      }


      list.forEach((data) => {

        const servantName =
          data.fullName ||
          "بدون اسم";


        const servantPhone =
          data.userPhone ||
          "لا يوجد رقم";


        const points =
          Number(data.points) ||
          0;


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "servant-card" +
          (
            data.isBlocked
              ? " blocked"
              : ""
          );


        card.onclick =
          () => openModal(data);


        card.innerHTML =
          `
          <div>

            <strong>
              ${escapeHtml(servantName)}
            </strong>

            ${
              data.isBlocked
                ? `
                  <span class="badge-blocked">
                    محظور
                  </span>
                `
                : ""
            }

            <div
              style="
                font-size:.8rem;
                color:#94a3b8;
              "
            >
              📞
              ${escapeHtml(servantPhone)}
            </div>

          </div>


          <div
            style="
              font-weight:bold;
              color:#38bdf8;
            "
          >
            ⭐ ${points}
          </div>
          `;


        listContainer
          .appendChild(card);

      });

    }


    /* =========================
       حماية عرض النص
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       البحث
    ========================= */

    function executeSearch() {

      const query =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();


      if (!query) {

        renderServantsList(
          allServantsData
        );

        return;

      }


      const filtered =
        allServantsData.filter(
          (servant) => {

            const name =
              (
                servant.fullName ||
                ""
              )
              .toLowerCase();


            return name.includes(
              query
            );

          }
        );


      renderServantsList(
        filtered
      );

    }


    /* =========================
       فتح التعديل
    ========================= */

    function openModal(data) {

      document
        .getElementById(
          "editUserId"
        )
        .value =
        data.id;


      document
        .getElementById(
          "editName"
        )
        .value =
        data.fullName || "";


      document
        .getElementById(
          "editPhone"
        )
        .value =
        data.userPhone || "";


      document
        .getElementById(
          "editPoints"
        )
        .value =
        Number(data.points) || 0;


      const container =
        document
          .getElementById(
            "blockBtnContainer"
          );


      if (data.isBlocked) {

        container.innerHTML =
          `
          <button
            class="btn-unblock"
            onclick="toggleBlock(false)"
          >
            إزالة الحظر 🔓
          </button>
          `;

      }

      else {

        container.innerHTML =
          `
          <button
            class="btn-block"
            onclick="toggleBlock(true)"
          >
            حظر المخدوم 🚫
          </button>
          `;

      }


      document
        .getElementById(
          "editModal"
        )
        .style.display =
        "flex";

    }


    /* =========================
       إغلاق النافذة
    ========================= */

    function closeModal() {

      document
        .getElementById(
          "editModal"
        )
        .style.display =
        "none";

    }


    /* =========================
       تغيير النقاط
    ========================= */

    function changePoints(value) {

      const input =
        document
          .getElementById(
            "editPoints"
          );


      let current =
        parseInt(input.value) ||
        0;


      current += value;


      if (current < 0) {

        current = 0;

      }


      input.value =
        current;

    }


    /* =========================
       حفظ التعديلات
    ========================= */

    async function saveServantData() {

      const id =
        document
          .getElementById(
            "editUserId"
          )
          .value;


      const name =
        document
          .getElementById(
            "editName"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "editPhone"
          )
          .value
          .trim();


      const points =
        Math.max(
          0,
          parseInt(
            document
              .getElementById(
                "editPoints"
              )
              .value
          ) || 0
        );


      if (!id) {

        alert(
          "لم يتم تحديد المخدوم!"
        );

        return;

      }


      if (!name) {

        alert(
          "اكتب اسم المخدوم!"
        );

        return;

      }


      try {

        await db
          .collection("servants")
          .doc(id)
          .update({

            fullName:
              name,

            userPhone:
              phone,

            points:
              points,

            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


        alert(
          "تم حفظ البيانات بنجاح! ✅"
        );


        closeModal();

      }

      catch (error) {

        console.error(
          "Update Error:",
          error
        );

        alert(
          "حدث خطأ أثناء حفظ البيانات!"
        );

      }

    }


    /* =========================
       الحظر
    ========================= */

    async function toggleBlock(
      blockStatus
    ) {

      const id =
        document
          .getElementById(
            "editUserId"
          )
          .value;


      if (!id) return;


      try {

        await db
          .collection("servants")
          .doc(id)
          .update({

            isBlocked:
              blockStatus,

            updatedAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          });


        alert(
          blockStatus
            ? "تم حظر المخدوم! 🚫"
            : "تم إزالة الحظر! 🔓"
        );


        closeModal();

      }

      catch (error) {

        console.error(
          "Block Error:",
          error
        );

        alert(
          "حدث خطأ أثناء تغيير حالة الحظر!"
        );

      }

    }


    /* =========================
       إغلاق Modal بالضغط خارجه
    ========================= */

    document
      .getElementById("editModal")
      .addEventListener(
        "click",
        function(e) {

          if (
            e.target === this
          ) {

            closeModal();

          }

        }
      );

  </script>

</body>

</html>
