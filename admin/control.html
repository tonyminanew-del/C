<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة المخدومين - تطبيق الكنيسة</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", sans-serif;
    }

    body {
      background: #0f111a;
      color: #fff;
      min-height: 100vh;
      padding: 20px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    h1,
    h2 {
      text-align: center;
      color: #00e676;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .admin-info {
      text-align: center;
      color: #a0aec0;
      font-size: 0.85rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #d1d5db;
      font-size: 0.9rem;
      margin-bottom: 7px;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #2a2e43;
      background: #0f111a;
      color: #fff;
      outline: none;
      font-size: 1rem;
    }

    select:focus,
    input:focus {
      border-color: #00e676;
    }

    .password-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .password-box.show {
      display: block;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .main-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: #00e676;
      color: #0f111a;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 5px;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      transition: all 0.3s ease;
    }

    .main-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .back-btn {
      background: #2a2e43;
      color: #fff;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      padding: 8px 15px;
      border-radius: 10px;
      font-weight: 700;
      display: block;
      margin: 10px auto 0;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
    }

    .servants-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .servant-card {
      background: #1a1c29;
      border: 1px solid #2a2e43;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .servant-card:hover {
      border-color: #00e676;
      transform: translateY(-2px);
    }

    .servant-card.blocked {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.06);
    }

    .servant-name {
      font-weight: 800;
      margin-bottom: 4px;
      color: #fff;
    }

    .servant-phone {
      color: #a0aec0;
      font-size: 0.8rem;
    }

    .points {
      color: #00e676;
      font-weight: 900;
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .blocked-badge {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      margin-right: 5px;
    }

    .message {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    /* Profile */
    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00e676;
      margin-bottom: 10px;
      background: #0f111a;
    }

    .points-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .points-control input {
      text-align: center;
      font-weight: 900;
    }

    .point-btn {
      width: 40px;
      height: 42px;
      border-radius: 10px;
      background: #00e676;
      color: #0f111a;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .point-btn:hover {
      opacity: 0.9;
    }

    .block-action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 900;
      margin-top: 10px;
      color: #fff;
    }

    .btn-block {
      background: #ef4444;
    }

    .btn-unblock {
      background: #22c55e;
    }

    .loading,
    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="card">
    <h1>⚙️ لوحة إدارة الكنيسة</h1>
    <div id="adminInfo" class="admin-info">
      تم تسجيل الدخول بحساب الخادم
    </div>
    <button class="logout-btn" onclick="logout()">
      تسجيل الخروج
    </button>
  </div>

  <!-- الرسائل -->
  <div id="message" class="message"></div>

  <!-- اختيار المرحلة -->
  <div id="stageSection" class="card">
    <div class="form-group">
      <label>
        اختر المرحلة الدراسية:
      </label>
      <select id="stageSelect" onchange="stageChanged()">
        <option value="">-- اختر المرحلة --</option>
        <option value="primary">ابتدائي</option>
        <option value="prep">إعدادي</option>
        <option value="sec">ثانوي</option>
      </select>
    </div>

    <div id="passwordBox" class="password-box">
      <div class="form-group">
        <label>🔒 كلمة سر المرحلة</label>
        <input type="password" id="stagePassword" placeholder="أدخل كلمة السر" onkeydown="passwordEnter(event)">
      </div>
      <button class="main-btn" onclick="verifyStage()">
        فتح المرحلة 🔓
      </button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardSection" style="display:none;">
    <div class="card">
      <div class="form-group">
        <label>🔍 البحث الشامل في المرحلة (لكل الصفوف)</label>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="اكتب اسم المخدوم للبحث..." oninput="searchServants()">
          <button class="main-btn" style="width:auto; margin-top:0;" onclick="searchServants()">بحث</button>
        </div>
      </div>
    </div>

    <div id="servantsList" class="servants-list"></div>
  </div>

  <!-- Profile -->
  <div id="profileSection" style="display:none;">
    <button class="back-btn" onclick="backToDashboard()">
      ⬅ العودة للقائمة
    </button>

    <div class="card">
      <div class="profile-header">
        <img id="viewAvatar" src="" class="profile-avatar" alt="صورة المخدوم">
        <h2 id="viewNameTitle" style="margin:0;">اسم المخدوم</h2>
      </div>

      <!-- تغيير الصورة -->
      <div class="form-group">
        <label>🖼️ تغيير صورة المخدوم من جهازك:</label>
        <input type="file" id="imageInput" accept="image/*" onchange="compressAndPreviewImage(event)">
        <small style="color:#a0aec0;display:block;margin-top:5px;">سيتم ضغط الصورة تلقائيًا قبل الحفظ.</small>
      </div>

      <!-- الاسم -->
      <div class="form-group">
        <label>الاسم بالكامل</label>
        <input type="text" id="editName">
      </div>

      <!-- الهاتف -->
      <div class="form-group">
        <label>رقم التليفون الشخصي</label>
        <input type="tel" id="editPhone">
      </div>

      <!-- النقاط -->
      <div class="form-group">
        <label>النقاط</label>
        <div class="points-control">
          <button class="point-btn" onclick="changePoints(-5)">-5</button>
          <button class="point-btn" onclick="changePoints(-1)">-1</button>
          <input type="number" id="editPoints" min="0">
          <button class="point-btn" onclick="changePoints(1)">+1</button>
          <button class="point-btn" onclick="changePoints(5)">+5</button>
        </div>
      </div>

      <!-- حفظ -->
      <button class="main-btn" onclick="saveServantProfile()">
        حفظ التعديلات 💾
      </button>

      <!-- حظر -->
      <div id="blockButtonContainer"></div>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
    authDomain: "church-7afe1.firebaseapp.com",
    projectId: "church-7afe1",
    storageBucket: "church-7afe1.firebasestorage.app",
    messagingSenderId: "1072334615357",
    appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
    measurementId: "G-E7Q76Z53SB"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db = firebase.firestore();

  const stagePasswords = {
    primary: "344",
    prep: "455",
    sec: "899"
  };

  let selectedStage = "";
  let servants = [];
  let unsubscribe = null;
  let currentSelectedServantId = null;
  let newImageBase64 = "";

  const DEFAULT_AVATAR = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#1e293b"/>
      <circle cx="100" cy="75" r="38" fill="#64748b"/>
      <path d="M35 190c8-48 38-70 65-70s57 22 65 70" fill="#64748b"/>
    </svg>
  `);

  function stageChanged() {
    selectedStage = document.getElementById("stageSelect").value;
    const passwordBox = document.getElementById("passwordBox");
    if (!selectedStage) {
      passwordBox.classList.remove("show");
      return;
    }
    passwordBox.classList.add("show");
    document.getElementById("stagePassword").value = "";
  }

  function passwordEnter(event) {
    if (event.key === "Enter") {
      verifyStage();
    }
  }

  function verifyStage() {
    const password = document.getElementById("stagePassword").value;
    if (stagePasswords[selectedStage] === password) {
      document.getElementById("stageSection").style.display = "none";
      document.getElementById("dashboardSection").style.display = "block";
      loadStageServants();
      showMessage("تم فتح المرحلة بنجاح 🔓", "success");
    } else {
      showMessage("كلمة السر غير صحيحة ❌", "error");
    }
  }

  function loadStageServants() {
    const list = document.getElementById("servantsList");

    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }

    list.innerHTML = `<div class="loading">جاري تحميل مخدومي المرحلة...</div>`;

    // تم تعديل الكولكشن من servants إلى users ليتطابق مع قاعدة البيانات لديك
    unsubscribe = db.collection("users")
      .where("stage", "==", selectedStage)
      .onSnapshot(
        (snapshot) => {
          servants = [];
          snapshot.forEach((doc) => {
            servants.push({
              id: doc.id,
              ...doc.data()
            });
          });
          searchServants();
        },
        (error) => {
          console.error("Firestore Error:", error);
          list.innerHTML = `<div class="empty">⚠️ تعذر جلب البيانات.<br><br>${escapeHTML(error.message)}</div>`;
        }
      );
  }

  function searchServants() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const filtered = query
      ? servants.filter((s) => (s.fullName || "").toLowerCase().includes(query))
      : servants;

    renderServants(filtered);
  }

  function renderServants(list) {
    const container = document.getElementById("servantsList");
    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = `<div class="empty">لا يوجد مخدومين مطابقة للبحث في هذه المرحلة.</div>`;
      return;
    }

    list.forEach((servant) => {
      const card = document.createElement("div");
      card.className = "servant-card" + (servant.isBlocked ? " blocked" : "");
      card.onclick = () => openServantProfile(servant);

      const servantImg = servant.image || servant.photoBase64 || DEFAULT_AVATAR;

      card.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <img src="${escapeHTML(servantImg)}" style="width:45px; height:45px; border-radius:50%; object-fit:cover; background:#0f111a;" onerror="this.src=DEFAULT_AVATAR">
          <div>
            <div class="servant-name">
              ${escapeHTML(servant.fullName || "بدون اسم")}
              ${servant.isBlocked ? `<span class="blocked-badge">محظور</span>` : ""}
            </div>
            <div class="servant-phone">
              📞 ${escapeHTML(servant.userPhone || "لا يوجد رقم")} | <span style="color:#38bdf8;">${escapeHTML(servant.grade || '')}</span>
            </div>
          </div>
        </div>
        <div class="points">⭐ ${Number(servant.points) || 0}</div>
      `;
      container.appendChild(card);
    });
  }

  function openServantProfile(servant) {
    currentSelectedServantId = servant.id;
    newImageBase64 = servant.image || servant.photoBase64 || "";

    document.getElementById("dashboardSection").style.display = "none";
    document.getElementById("profileSection").style.display = "block";

    document.getElementById("viewNameTitle").innerText = servant.fullName || "مخدوم";
    document.getElementById("viewAvatar").src = newImageBase64 || DEFAULT_AVATAR;
    document.getElementById("editName").value = servant.fullName || "";
    document.getElementById("editPhone").value = servant.userPhone || "";
    document.getElementById("editPoints").value = Number(servant.points) || 0;
    document.getElementById("imageInput").value = "";

    const blockContainer = document.getElementById("blockButtonContainer");
    if (servant.isBlocked) {
      blockContainer.innerHTML = `<button class="block-action-btn btn-unblock" onclick="toggleBlock(false)">إزالة الحظر 🔓</button>`;
    } else {
      blockContainer.innerHTML = `<button class="block-action-btn btn-block" onclick="toggleBlock(true)">حظر المخدوم 🚫</button>`;
    }
  }

  function changePoints(value) {
    const input = document.getElementById("editPoints");
    let points = parseInt(input.value) || 0;
    points += value;
    if (points < 0) points = 0;
    input.value = points;
  }

  function compressAndPreviewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("من فضلك اختر صورة فقط.");
      event.target.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 300;
        const MAX_HEIGHT = 300;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
        } else {
          if (height > MAX_HEIGHT) {
            width *= MAX_HEIGHT / height;
            height = MAX_HEIGHT;
          }
        }

        canvas.width = Math.round(width);
        canvas.height = Math.round(height);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        newImageBase64 = canvas.toDataURL("image/jpeg", 0.7);
        document.getElementById("viewAvatar").src = newImageBase64;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function backToDashboard() {
    document.getElementById("profileSection").style.display = "none";
    document.getElementById("dashboardSection").style.display = "block";
    currentSelectedServantId = null;
    newImageBase64 = "";
  }

  async function saveServantProfile() {
    if (!currentSelectedServantId) return;

    const name = document.getElementById("editName").value.trim();
    const phone = document.getElementById("editPhone").value.trim();
    const points = Math.max(0, parseInt(document.getElementById("editPoints").value) || 0);

    if (!name) {
      alert("برجاء كتابة اسم المخدوم.");
      return;
    }

    try {
      const updateData = {
        fullName: name,
        userPhone: phone,
        points: points,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (newImageBase64) {
        updateData.image = newImageBase64;
        updateData.photoBase64 = newImageBase64;
      }

      // التحديث في كولكشن users الصحيح
      await db.collection("users").doc(currentSelectedServantId).update(updateData);

      document.getElementById("viewNameTitle").innerText = name;
      document.getElementById("viewAvatar").src = newImageBase64 || DEFAULT_AVATAR;

      alert("تم حفظ بيانات المخدوم وتحديث الصورة والنقاط بنجاح ✅");
    } catch (error) {
      console.error("Save Error:", error);
      alert("❌ لم يتم الحفظ:\n" + error.message);
    }
  }

  async function toggleBlock(status) {
    if (!currentSelectedServantId) return;

    const confirmed = confirm(status ? "هل تريد حظر هذا المخدوم؟" : "هل تريد إزالة الحظر عنه؟");
    if (!confirmed) return;

    try {
      // التحديث في كولكشن users الصحيح
      await db.collection("users").doc(currentSelectedServantId).update({
        isBlocked: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert(status ? "تم حظر المخدوم 🚫" : "تم إزالة الحظر 🔓");
      backToDashboard();
    } catch (error) {
      console.error("Block Error:", error);
      alert("❌ حدث خطأ:\n" + error.message);
    }
  }

  async function logout() {
    if (unsubscribe) unsubscribe();
    try {
      await auth.signOut();
    } catch (e) {}
    window.location.href = "user.html";
  }

  function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.className = "message show " + type;
    setTimeout(() => {
      msg.classList.remove("show");
    }, 3000);
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>

</body>
</html>
