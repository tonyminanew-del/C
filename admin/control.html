<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - التحكم بالمخدومين</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .admin-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .header-card h2 {
      color: #38bdf8;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    select option {
      background: #0f172a;
      color: #fff;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .btn-main {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      white-space: nowrap;
    }

    .btn-main:hover {
      opacity: 0.9;
    }

    .lock-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 15px;
      border-radius: 15px;
      margin-top: 10px;
    }

    /* قائمة المخدومين */
    .servants-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .servant-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .servant-card:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .servant-card.blocked {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .badge-blocked {
      background: #ef4444;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 5px;
    }

    /* النافذة المنبثقة للتعديل */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .points-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-qty {
      background: #38bdf8;
      color: #000;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-block {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-unblock {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div class="header-card">
      <h2>⚙️ لوحة إدارة المخدومين</h2>
    </div>

    <!-- Step 1: اختيار المرحلة وكلمة السر -->
    <div class="header-card">
      <div class="form-group">
        <label>اختر المرحلة الدراسية:</label>
        <select id="stageSelect" onchange="resetLock()">
          <option value="">-- اختر المرحلة --</option>
          <option value="primary">ابتدائي</option>
          <option value="prep">إعدادي</option>
          <option value="secondary">ثانوي</option>
        </select>
      </div>

      <div id="lockBox" class="lock-box hidden">
        <div class="form-group">
          <label>🔒 أدخل كلمة سر المرحلة:</label>
          <input type="password" id="stagePassword" placeholder="كلمة السر">
        </div>
        <button class="btn-main" style="width:100%;" onclick="verifyPassword()">فتح القفل 🔓</button>
      </div>
    </div>

    <!-- Step 2: اختيار الصف والبحث (يظهر فور فتح القفل) -->
    <div id="unlockedSection" class="header-card hidden">
      <div class="form-group">
        <label>اختر الصف الدراسي:</label>
        <select id="gradeSelect" onchange="fetchServants()">
          <!-- يتم ملؤه تلقائياً حسب المرحلة -->
        </select>
      </div>

      <div class="form-group">
        <label>🔍 البحث عن مخدوم:</label>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="اكتب اسم المخدوم..." onkeypress="handleEnterSearch(event)">
          <button class="btn-main" onclick="executeSearch()">بحث 🔍</button>
        </div>
      </div>
    </div>

    <!-- قائمة المخدومين -->
    <div id="servantsList" class="servants-list"></div>

  </div>

  <!-- النافذة المنبثقة للتعديل والحظر -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h3 style="margin-bottom: 15px; color: #38bdf8;" id="modalTitle">تعديل بيانات المخدوم</h3>
      
      <input type="hidden" id="editUserId">

      <div class="form-group">
        <label>الاسم الكامل:</label>
        <input type="text" id="editName">
      </div>

      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="text" id="editPhone">
      </div>

      <div class="form-group">
        <label>النقاط الحالية:</label>
        <div class="points-control">
          <button class="btn-qty" onclick="changePoints(-5)">-5</button>
          <button class="btn-qty" onclick="changePoints(-1)">-1</button>
          <input type="number" id="editPoints" style="text-align: center; font-weight: bold; font-size: 1.2rem;">
          <button class="btn-qty" onclick="changePoints(1)">+1</button>
          <button class="btn-qty" onclick="changePoints(5)">+5</button>
        </div>
      </div>

      <button class="btn-main" style="width: 100%; margin-top: 15px;" onclick="saveServantData()">حفظ التعديلات 💾</button>
      
      <div id="blockBtnContainer"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const stagePasswords = {
      primary: "344",
      prep: "455",
      secondary: "899"
    };

    const stageGrades = {
      primary: ["الصف الأول", "الصف الثاني", "الصف الثالث", "الصف الرابع", "الصف الخامس", "الصف السادس"],
      prep: ["الصف الأول الإعدادي", "الصف الثاني الإعدادي", "الصف الثالث الإعدادي"],
      secondary: ["الصف الأول الثانوي", "الصف الثاني الثانوي", "الصف الثالث الثانوي"]
    };

    let allServantsData = [];

    function resetLock() {
      const stage = document.getElementById('stageSelect').value;
      const lockBox = document.getElementById('lockBox');
      const unlockedSection = document.getElementById('unlockedSection');
      document.getElementById('servantsList').innerHTML = '';

      if (stage) {
        lockBox.classList.remove('hidden');
        unlockedSection.classList.add('hidden');
        document.getElementById('stagePassword').value = '';
      } else {
        lockBox.classList.add('hidden');
        unlockedSection.classList.add('hidden');
      }
    }

    function verifyPassword() {
      const stage = document.getElementById('stageSelect').value;
      const passwordInput = document.getElementById('stagePassword').value;

      if (stagePasswords[stage] === passwordInput) {
        alert("تم فتح القفل بنجاح! 🔓");
        document.getElementById('lockBox').classList.add('hidden');
        document.getElementById('unlockedSection').classList.remove('hidden');
        populateGrades(stage);
      } else {
        alert("كلمة السر خاطئة! ❌");
      }
    }

    function populateGrades(stage) {
      const gradeSelect = document.getElementById('gradeSelect');
      gradeSelect.innerHTML = '<option value="">-- اختر الصف --</option>';

      stageGrades[stage].forEach(grade => {
        const option = document.createElement('option');
        option.value = grade;
        option.textContent = grade;
        gradeSelect.appendChild(option);
      });
    }

    // جلب المخدومين فور اختيار الصف
    function fetchServants() {
      const stage = document.getElementById('stageSelect').value;
      const grade = document.getElementById('gradeSelect').value;
      const listContainer = document.getElementById('servantsList');
      document.getElementById('searchInput').value = '';

      if (!stage || !grade) {
        listContainer.innerHTML = '';
        return;
      }

      listContainer.innerHTML = '<div style="text-align:center;">جاري تحميل الأسماء...</div>';

      db.collection('servants')
        .where('stage', '==', stage)
        .where('grade', '==', grade)
        .onSnapshot(snapshot => {
          allServantsData = [];
          
          if (snapshot.empty) {
            listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8;">لا يوجد مخدومين في هذا الصف</div>';
            return;
          }

          snapshot.forEach(doc => {
            const data = doc.data();
            data.id = doc.id;
            allServantsData.push(data);
          });

          renderServantsList(allServantsData);
        });
    }

    // عرض قائمة الأسماء مع المعالجة الكاملة لمسميات الحقول
    function renderServantsList(list) {
      const listContainer = document.getElementById('servantsList');
      listContainer.innerHTML = '';

      if (list.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#94a3b8;">لم يتم العثور على أي نتائج</div>';
        return;
      }

      list.forEach(data => {
        const servantName = data.name || data.fullName || data.username || data.userName || 'بدون اسم';
        const servantPhone = data.phone || data.phoneNumber || data.mobile || 'لا يوجد رقم';

        const card = document.createElement('div');
        card.className = `servant-card ${data.isBlocked ? 'blocked' : ''}`;
        card.onclick = () => openModal(data);

        card.innerHTML = `
          <div>
            <strong>${servantName}</strong>
            ${data.isBlocked ? '<span class="badge-blocked">محظور</span>' : ''}
            <div style="font-size: 0.8rem; color: #94a3b8;">📞 ${servantPhone}</div>
          </div>
          <div style="font-weight: bold; color: #38bdf8;">
            ⭐ ${data.points || 0}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function executeSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (query === '') {
        renderServantsList(allServantsData);
      } else {
        const filtered = allServantsData.filter(s => {
          const servantName = (s.name || s.fullName || s.username || s.userName || '').toLowerCase();
          return servantName.includes(query);
        });
        renderServantsList(filtered);
      }
    }

    function handleEnterSearch(event) {
      if (event.key === 'Enter') {
        executeSearch();
      }
    }

    function openModal(data) {
      const servantName = data.name || data.fullName || data.username || data.userName || '';
      const servantPhone = data.phone || data.phoneNumber || data.mobile || '';

      document.getElementById('editUserId').value = data.id;
      document.getElementById('editName').value = servantName;
      document.getElementById('editPhone').value = servantPhone;
      document.getElementById('editPoints').value = data.points || 0;

      const blockBtnContainer = document.getElementById('blockBtnContainer');
      if (data.isBlocked) {
        blockBtnContainer.innerHTML = `<button class="btn-unblock" onclick="toggleBlock(false)">إزالة الحظر 🔓</button>`;
      } else {
        blockBtnContainer.innerHTML = `<button class="btn-block" onclick="toggleBlock(true)">حظر المخدوم 🚫</button>`;
      }

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function changePoints(val) {
      const input = document.getElementById('editPoints');
      let current = parseInt(input.value) || 0;
      current += val;
      if (current < 0) current = 0;
      input.value = current;
    }

    async function saveServantData() {
      const id = document.getElementById('editUserId').value;
      const name = document.getElementById('editName').value;
      const phone = document.getElementById('editPhone').value;
      const points = parseInt(document.getElementById('editPoints').value) || 0;

      try {
        await db.collection('servants').doc(id).update({
          name: name,
          phone: phone,
          points: points
        });
        alert("تم حفظ البيانات بنجاح! ✅");
        closeModal();
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء الحفظ!");
      }
    }

    async function toggleBlock(blockStatus) {
      const id = document.getElementById('editUserId').value;
      try {
        await db.collection('servants').doc(id).update({
          isBlocked: blockStatus
        });
        alert(blockStatus ? "تم حظر المخدوم! 🚫" : "تم إزالة الحظر! 🔓");
        closeModal();
      } catch (err) {
        console.error(err);
        alert("حدث خطأ!");
      }
    }
  </script>
</body>
</html>
