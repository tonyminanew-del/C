<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الخادم - لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء فايربيس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .admin-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .auth-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 5px;
    }

    .auth-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .input-box:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-main {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .switch-mode {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .switch-mode span {
      color: #38bdf8;
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="admin-icon" id="formIcon">📝</div>
    <div class="auth-title" id="formTitle">إنشاء حساب جديد</div>
    <div class="auth-sub" id="formSub">أدخل بياناتك لإنشاء حساب خادم</div>

    <div id="formFieldsContainer">
      <input type="text" id="usernameInput" class="input-box" placeholder="اسم المستخدم (Username)">
      <input type="password" id="passwordInput" class="input-box" placeholder="كلمة المرور الخاصة بحسابك">
      
      <!-- حقل كلمة سر الخادم المطلوبة stmina -->
      <input type="password" id="serverSecretInput" class="input-box" placeholder="كلمة سر الخوادم السرية (stmina)">
      
      <div id="confirmPassBox">
        <input type="password" id="confirmPasswordInput" class="input-box" placeholder="إعادة كتابة كلمة المرور">
      </div>

      <button class="btn btn-main" id="actionBtn" onclick="handleAuthAction()">إنشاء الحساب 🚀</button>
    </div>

    <div class="switch-mode">
      <span id="switchText" onclick="toggleAuthMode()">لديك حساب بالفعل؟ سجل دخولك</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6yuTr41CyGKu2WoR1AvBFWtIADmnsG7c",
      authDomain: "church-7afe1.firebaseapp.com",
      projectId: "church-7afe1",
      storageBucket: "church-7afe1.firebasestorage.app",
      messagingSenderId: "1072334615357",
      appId: "1:1072334615357:web:c03b199f00ea9d19d40b54",
      measurementId: "G-E7Q76Z53SB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.firestore();
    let isLoginMode = false;

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      const formTitle = document.getElementById('formTitle');
      const formSub = document.getElementById('formSub');
      const formIcon = document.getElementById('formIcon');
      const confirmPassBox = document.getElementById('confirmPassBox');
      const actionBtn = document.getElementById('actionBtn');
      const switchText = document.getElementById('switchText');
      document.getElementById('errorMsg').innerText = "";

      if (isLoginMode) {
        formIcon.innerText = "🔑";
        formTitle.innerText = "تسجيل الدخول";
        formSub.innerText = "أدخل بيانات حسابك للمتابعة";
        confirmPassBox.style.display = "none";
        actionBtn.innerText = "تسجيل الدخول 🚪";
        switchText.innerText = "ليس لديك حساب؟ إنشاء حساب جديد";
      } else {
        formIcon.innerText = "📝";
        formTitle.innerText = "إنشاء حساب جديد";
        formSub.innerText = "أدخل بياناتك لإنشاء حساب خادم";
        confirmPassBox.style.display = "block";
        actionBtn.innerText = "إنشاء الحساب 🚀";
        switchText.innerText = "لديك حساب بالفعل؟ سجل دخولك";
      }
    }

    async function handleAuthAction() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const serverSecret = document.getElementById('serverSecretInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (!username || !password || !serverSecret) {
        errorMsg.innerText = "يرجى ملء جميع الحقول المطلوبة ❌";
        return;
      }

      // التحقق من كلمة السر السرية للخادم
      if (serverSecret !== "stmina") {
        errorMsg.innerText = "كلمة سر الخوادم (stmina) غير صحيحة ❌";
        return;
      }

      const userRef = db.collection('users').doc(username);

      try {
        if (!isLoginMode) {
          // حساب جديد -> answer.html
          const confirmPassword = document.getElementById('confirmPasswordInput').value.trim();
          if (password !== confirmPassword) {
            errorMsg.innerText = "كلمتا المرور غير متطابقتين ❌";
            return;
          }

          const docSnap = await userRef.get();
          if (docSnap.exists) {
            errorMsg.innerText = "اسم المستخدم هذا موجود بالفعل، سجل دخولك ❌";
            return;
          }

          await userRef.set({
            username: username,
            password: password,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          localStorage.setItem("currentAdminUser", username);
          window.location.href = "answer.html";

        } else {
          // لديك حساب بالفعل (تسجيل دخول) -> admin/home.html
          const docSnap = await userRef.get();
          if (!docSnap.exists) {
            errorMsg.innerText = "اسم المستخدم غير مسجل ❌";
            return;
          }

          const data = docSnap.data();
          if (data.password !== password) {
            errorMsg.innerText = "كلمة المرور غير صحيحة ❌";
            return;
          }

          localStorage.setItem("currentAdminUser", username);
          window.location.href = "admin/home.html";
        }
      } catch (err) {
        console.error(err);
        errorMsg.innerText = "حدث خطأ في الاتصال، حاول مرة أخرى.";
      }
    }
  </script>

</body>
</html>
