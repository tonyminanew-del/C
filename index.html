<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>first page</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- خلفية متدرجة سوداء مع تأثيرات إضاءة -->
  <div class="dark-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="main-container">
    <header class="hero-section">
      <div class="logo-badge">⛪</div>
      <!-- تم إضافة معرف id للعنوان لبرمجته -->
      <h1>اهلا ببرنامج كنيسه الشهيد <span id="adminTrigger" style="cursor: pointer; user-select: none;">استيفانوس</span> ومارمينا العجايبي</h1>
    </header>

    <!-- الوييدجيتس (الكارتات) الخاصة باختيار الدخول -->
    <div class="cards-grid">
      
      <!-- كارت المستخدم / المخدوم -->
      <a href="user.html" class="glass-card user-card" style="grid-column: 1 / -1; max-width: 420px; margin: 0 auto; width: 100%;">
        <div class="icon-box">👤</div>
        <div class="card-content">
          <h2>دخول مخدوم</h2>
        </div>
      </a>

    </div>

    <footer class="footer-note">
    </footer>
  </main>

  <!-- كود جافاسكريبت للتحكم في عدد النقرات -->
  <script>
    let clickCount = 0;
    const triggerElement = document.getElementById('adminTrigger');

    triggerElement.addEventListener('click', function() {
      clickCount++;
      // إذا وصل عدد النقرات إلى 5 مرات
    
    });
  </script>

</body>
</html>
