<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>إكمال البيانات - مدرسة الشمامسة</title>

    <!-- ================= FONTS ================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- ================= ICONS ================= -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- ================= FIREBASE ================= -->

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --navy: #172554;
            --navy-light: #28418f;

            --maroon: #741b24;
            --maroon-light: #9b3039;

            --gold: #c79a32;
            --gold-light: #f2d889;

            --green: #16a34a;
            --red: #dc2626;

            --bg: #f5f7fb;
            --white: #ffffff;

            --text: #182033;
            --muted: #858c9b;

            --border: #e9edf3;

            --shadow: 0 15px 45px rgba(23, 37, 84, .08);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 90% 0%, rgba(199, 154, 50, .08), transparent 28%),
                radial-gradient(circle at 0% 35%, rgba(23, 37, 84, .055), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Tajawal", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 50px;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; cursor: pointer; }
        input, select { font-family: inherit; }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width: min(480px, calc(100% - 22px));
            margin: auto;
        }

        /* =====================================================
           HERO HEADER
        ===================================================== */

        .auth-hero {
            position: relative;
            overflow: hidden;
            padding: 28px 26px;
            border-radius: 34px;
            color: white;
            background:
                radial-gradient(circle at 8% 10%, rgba(255, 255, 255, .15), transparent 25%),
                radial-gradient(circle at 95% 95%, rgba(199, 154, 50, .25), transparent 32%),
                linear-gradient(135deg, #121d45, #263d87 52%, #641c25);
            box-shadow: 0 22px 55px rgba(23, 37, 84, .19);
            animation: heroIn .65s ease both;
            margin-bottom: 16px;
        }

        .auth-hero::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .08);
            left: -150px;
            bottom: -150px;
        }

        .auth-hero::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .06);
            right: -180px;
            top: -190px;
        }

        .hero-row {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hero-avatar {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 24px;
            background: rgba(255, 255, 255, .12);
            border: 2px solid rgba(255, 255, 255, .5);
        }

        .hero-welcome-small {
            font-size: 12px;
            opacity: .72;
            margin-bottom: 3px;
        }

        .hero-welcome-title {
            font-family: "Amiri", serif;
            font-size: 24px;
            line-height: 1.2;
        }

        .hero-welcome-title span {
            color: var(--gold-light);
        }

        .hero-welcome-sub {
            margin-top: 4px;
            font-size: 11.5px;
            opacity: .72;
        }

        /* =====================================================
           FORM CARD
        ===================================================== */

        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 29px;
            padding: 24px 22px;
            box-shadow: var(--shadow);
            animation: heroIn .65s ease .05s both;
        }

        .section-title {
            font-family: "Amiri", serif;
            font-size: 17px;
            color: var(--navy);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            font-size: 15px;
            color: var(--gold);
        }

        /* =====================================================
           AVATAR UPLOAD
        ===================================================== */

        .avatar-upload-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
        }

        .avatar-circle {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #eef2ff;
            border: 2px dashed #c9d3ea;
            display: grid;
            place-items: center;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
        }

        .avatar-circle:active { transform: scale(.96); }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-circle.has-image {
            border-style: solid;
            border-color: var(--navy-light);
        }

        .avatar-circle.has-image img { display: block; }

        .avatar-circle.has-image i.avatar-placeholder { display: none; }

        .avatar-placeholder {
            font-size: 28px;
            color: var(--navy-light);
        }

        .avatar-cam-btn {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--navy);
            color: white;
            display: grid;
            place-items: center;
            font-size: 12px;
            border: 3px solid white;
        }

        .avatar-hint {
            margin-top: 10px;
            font-size: 11px;
            color: var(--muted);
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap input {
            width: 100%;
            height: 50px;
            padding: 0 44px 0 16px;
            border-radius: 15px;
            border: 1.5px solid var(--border);
            background: #f8f9fc;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: .2s;
            direction: ltr;
            text-align: right;
        }

        .input-wrap input:focus {
            border-color: var(--navy-light);
            background: white;
            box-shadow: 0 0 0 3px rgba(40, 65, 143, .1);
        }

        .input-wrap .field-icon {
            position: absolute;
            right: 14px;
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
        }

        .field-error {
            display: none;
            margin-top: 7px;
            font-size: 11px;
            color: var(--red);
            font-weight: 700;
        }

        .field-error.show { display: block; }

        /* =====================================================
           STAGE CARDS (ابتدائي / إعدادي / ثانوي)
        ===================================================== */

        .stage-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stage-card {
            position: relative;
            padding: 16px 8px 12px;
            border-radius: 18px;
            border: 1.5px solid var(--border);
            background: #f8f9fc;
            text-align: center;
            transition: .2s;
        }

        .stage-card:active { transform: scale(.97); }

        .stage-card .stage-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 8px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-size: 16px;
            background: #eef2ff;
            color: var(--navy);
            transition: .2s;
        }

        .stage-card .stage-name {
            font-size: 12px;
            font-weight: 800;
            color: var(--text);
        }

        .stage-card.active {
            border-color: var(--navy);
            background: #eef2ff;
            box-shadow: 0 8px 20px rgba(23, 37, 84, .12);
        }

        .stage-card.active .stage-icon {
            background: var(--navy);
            color: white;
        }

        .stage-card.active .stage-name {
            color: var(--navy);
        }

        /* =====================================================
           GRADE SELECT
        ===================================================== */

        .grade-wrap {
            margin-top: 18px;
            display: none;
        }

        .grade-wrap.show {
            display: block;
            animation: heroIn .35s ease both;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            width: 100%;
            height: 50px;
            padding: 0 44px 0 16px;
            border-radius: 15px;
            border: 1.5px solid var(--border);
            background: #f8f9fc;
            font-size: 14px;
            color: var(--text);
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .select-wrap select:focus {
            border-color: var(--navy-light);
            background: white;
            box-shadow: 0 0 0 3px rgba(40, 65, 143, .1);
        }

        .select-wrap i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 13px;
            pointer-events: none;
        }

        .select-wrap .chevron {
            right: auto;
            left: 16px;
            font-size: 12px;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .btn-main {
            width: 100%;
            height: 54px;
            border-radius: 17px;
            background: linear-gradient(135deg, var(--maroon), var(--maroon-light));
            color: white;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 14px 30px rgba(116, 27, 36, .25);
            transition: .2s;
            margin-top: 8px;
        }

        .btn-main:active { transform: scale(.98); }

        .btn-main:disabled {
            opacity: .55;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-main .spinner {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 255, 255, .4);
            border-top-color: white;
            animation: spin .7s linear infinite;
            display: none;
        }

        .btn-main.loading .spinner { display: inline-block; }
        .btn-main.loading .btn-text { opacity: .85; }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--navy);
            color: white;
            padding: 13px 20px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 15px 35px rgba(23, 37, 84, .3);
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 999;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { background: var(--maroon); }
        .toast.success { background: var(--green); }

        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes heroIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {
            .auth-hero { padding: 24px 18px; border-radius: 28px; }
            .auth-card { padding: 20px 16px; border-radius: 25px; }
            .stage-card .stage-name { font-size: 11px; }
        }

    </style>

</head>

<body>

    <div class="page">

        <!-- =================================================
             HERO
        ================================================== -->

        <section class="auth-hero">

            <div class="hero-row">

                <div class="hero-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <div class="hero-welcome-small">خطوة أخيرة قبل البدء</div>

                    <div class="hero-welcome-title">
                        أهلاً يا <span id="welcomeUsername">...</span>
                    </div>

                    <div class="hero-welcome-sub">استكمل بياناتك للمتابعة</div>
                </div>

            </div>

        </section>

        <!-- =================================================
             FORM
        ================================================== -->

        <section class="auth-card">

            <div class="section-title">
                <i class="fa-solid fa-address-card"></i>
                بيانات ولي الأمر والمرحلة الدراسية
            </div>

            <form id="compForm" onsubmit="return false;">

                <!-- AVATAR -->

                <div class="avatar-upload-wrap">

                    <div class="avatar-circle" id="avatarCircle">
                        <i class="fa-solid fa-user avatar-placeholder"></i>
                        <img id="avatarPreview" alt="الصورة الشخصية">
                        <div class="avatar-cam-btn"><i class="fa-solid fa-camera"></i></div>
                    </div>

                    <input type="file" id="avatarInput" accept="image/*" hidden>

                    <div class="avatar-hint">اضغط لإضافة صورتك الشخصية</div>

                </div>

                <!-- OWN PHONE -->

                <div class="field">
                    <label for="ownPhone">رقم هاتفك</label>

                    <div class="input-wrap">
                        <input type="tel" id="ownPhone" placeholder="01xxxxxxxxx" inputmode="numeric" maxlength="11">
                        <i class="fa-solid fa-mobile-screen field-icon"></i>
                    </div>

                    <div class="field-error" id="ownPhoneError">من فضلك اكتب رقم صحيح</div>
                </div>

                <!-- FATHER PHONE -->

                <div class="field">
                    <label for="fatherPhone">رقم الأب</label>

                    <div class="input-wrap">
                        <input type="tel" id="fatherPhone" placeholder="01xxxxxxxxx" inputmode="numeric" maxlength="11">
                        <i class="fa-solid fa-phone field-icon"></i>
                    </div>

                    <div class="field-error" id="fatherError">من فضلك اكتب رقم صحيح</div>
                </div>

                <!-- MOTHER PHONE -->

                <div class="field">
                    <label for="motherPhone">رقم الأم</label>

                    <div class="input-wrap">
                        <input type="tel" id="motherPhone" placeholder="01xxxxxxxxx" inputmode="numeric" maxlength="11">
                        <i class="fa-solid fa-phone field-icon"></i>
                    </div>

                    <div class="field-error" id="motherError">من فضلك اكتب رقم صحيح</div>
                </div>

                <!-- STAGE -->

                <div class="field">
                    <label>المرحلة الدراسية</label>

                    <div class="stage-grid" id="stageGrid">

                        <div class="stage-card" data-stage="ابتدائي">
                            <div class="stage-icon"><i class="fa-solid fa-child"></i></div>
                            <div class="stage-name">ابتدائي</div>
                        </div>

                        <div class="stage-card" data-stage="إعدادي">
                            <div class="stage-icon"><i class="fa-solid fa-user-graduate"></i></div>
                            <div class="stage-name">إعدادي</div>
                        </div>

                        <div class="stage-card" data-stage="ثانوي">
                            <div class="stage-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                            <div class="stage-name">ثانوي</div>
                        </div>

                    </div>

                    <div class="field-error" id="stageError">من فضلك اختر المرحلة الدراسية</div>

                    <!-- GRADE -->

                    <div class="grade-wrap" id="gradeWrap">

                        <label for="gradeSelect" style="margin-top:14px;display:block;">الصف الدراسي</label>

                        <div class="select-wrap">
                            <select id="gradeSelect">
                                <option value="" disabled selected>اختر الصف</option>
                            </select>
                            <i class="fa-solid fa-layer-group"></i>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </div>

                        <div class="field-error" id="gradeError">من فضلك اختر الصف الدراسي</div>

                    </div>

                </div>

                <!-- ADDRESS -->

                <div class="field">
                    <label for="address">العنوان</label>

                    <div class="input-wrap">
                        <input type="text" id="address" value="المنصورة">
                        <i class="fa-solid fa-location-dot field-icon"></i>
                    </div>
                </div>

                <!-- SUBMIT -->

                <button type="button" class="btn-main" id="submitBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">حفظ ومتابعة</span>
                </button>

            </form>

        </section>

    </div>

    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-info"></i>
        <span id="toastText"></span>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =================================================
           FIREBASE
        ================================================= */

        const firebaseConfig = {
            apiKey: "AIzaSyDk8JXHvo9up6Hof7d6S_Or8ICnaGnuIUg",
            authDomain: "tony-c78c0.firebaseapp.com",
            projectId: "tony-c78c0",
            storageBucket: "tony-c78c0.firebasestorage.app",
            messagingSenderId: "182062544524",
            appId: "1:182062544524:web:59afdba4f0d1dfd929ada9",
            measurementId: "G-4FER9HW0JS"
        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const storage = firebase.storage();

        const USERS_COLLECTION = "users";


        /* =================================================
           CURRENT USER
        ================================================= */

        const currentUsername = (
            localStorage.getItem("currentUser") ||
            localStorage.getItem("current_servant_username") ||
            ""
        ).trim();

        document.getElementById("welcomeUsername").textContent =
            currentUsername || "بدون اسم";

        if (!currentUsername) {
            showToastEarly();
        }

        function showToastEarly() {
            // لا يوجد مستخدم حالي، ينصح بالرجوع لصفحة إنشاء الحساب
            setTimeout(() => {
                alert("لم يتم العثور على حساب حالي، برجاء إنشاء حساب أولاً.");
            }, 300);
        }


        /* =================================================
           GRADES DATA
        ================================================= */

        const gradesMap = {

            "ابتدائي": [
                "الصف الأول الابتدائي",
                "الصف الثاني الابتدائي",
                "الصف الثالث الابتدائي",
                "الصف الرابع الابتدائي",
                "الصف الخامس الابتدائي",
                "الصف السادس الابتدائي"
            ],

            "إعدادي": [
                "الصف الأول الإعدادي",
                "الصف الثاني الإعدادي",
                "الصف الثالث الإعدادي"
            ],

            "ثانوي": [
                "الصف الأول الثانوي",
                "الصف الثاني الثانوي",
                "الصف الثالث الثانوي"
            ]

        };


        /* =================================================
           ELEMENTS
        ================================================= */

        const stageCards = document.querySelectorAll(".stage-card");
        const gradeWrap = document.getElementById("gradeWrap");
        const gradeSelect = document.getElementById("gradeSelect");

        const avatarCircle = document.getElementById("avatarCircle");
        const avatarInput = document.getElementById("avatarInput");
        const avatarPreview = document.getElementById("avatarPreview");

        const ownPhoneInput = document.getElementById("ownPhone");
        const fatherPhoneInput = document.getElementById("fatherPhone");
        const motherPhoneInput = document.getElementById("motherPhone");
        const addressInput = document.getElementById("address");

        const ownPhoneError = document.getElementById("ownPhoneError");
        const fatherError = document.getElementById("fatherError");
        const motherError = document.getElementById("motherError");
        const stageError = document.getElementById("stageError");
        const gradeError = document.getElementById("gradeError");

        const submitBtn = document.getElementById("submitBtn");

        const toast = document.getElementById("toast");
        const toastText = document.getElementById("toastText");

        let selectedStage = "";
        let selectedAvatarFile = null;


        /* =================================================
           TOAST HELPER
        ================================================= */

        let toastTimer = null;

        function showToast(message, type = "info") {

            clearTimeout(toastTimer);

            toast.className = "toast show " + type;
            toastText.textContent = message;

            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 3200);

        }


        /* =================================================
           AVATAR UPLOAD
        ================================================= */

        avatarCircle.addEventListener("click", () => {
            avatarInput.click();
        });

        avatarInput.addEventListener("change", () => {

            const file = avatarInput.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {
                showToast("من فضلك اختر ملف صورة صحيح", "error");
                return;
            }

            if (file.size > 4 * 1024 * 1024) {
                showToast("حجم الصورة كبير، اختر صورة أصغر من 4MB", "error");
                return;
            }

            selectedAvatarFile = file;

            const reader = new FileReader();

            reader.onload = () => {
                avatarPreview.src = reader.result;
                avatarCircle.classList.add("has-image");
            };

            reader.readAsDataURL(file);

        });


        /* =================================================
           STAGE SELECTION
        ================================================= */

        stageCards.forEach(card => {

            card.addEventListener("click", () => {

                stageCards.forEach(c => c.classList.remove("active"));
                card.classList.add("active");

                selectedStage = card.getAttribute("data-stage");

                setInputError(null, stageError, false);

                // تعبئة الصفوف المناسبة للمرحلة المختارة
                gradeSelect.innerHTML = '<option value="" disabled selected>اختر الصف</option>';

                gradesMap[selectedStage].forEach(gradeName => {

                    const option = document.createElement("option");
                    option.value = gradeName;
                    option.textContent = gradeName;

                    gradeSelect.appendChild(option);

                });

                gradeWrap.classList.add("show");
                setInputError(null, gradeError, false);

            });

        });

        gradeSelect.addEventListener("change", () => {
            setInputError(null, gradeError, false);
        });


        /* =================================================
           PHONE - أرقام فقط
        ================================================= */

        [ownPhoneInput, fatherPhoneInput, motherPhoneInput].forEach(input => {

            input.addEventListener("input", () => {
                input.value = input.value.replace(/[^0-9]/g, "");
            });

        });


        /* =================================================
           FIELD ERROR HELPER
        ================================================= */

        function setInputError(input, errorEl, hasError) {

            if (input) {
                input.style.borderColor = hasError ? "var(--red)" : "var(--border)";
            }

            if (hasError) {
                errorEl.classList.add("show");
            } else {
                errorEl.classList.remove("show");
            }

        }

        function isValidEgyptPhone(value) {
            return /^01[0-2,5]{1}[0-9]{8}$/.test(value);
        }


        /* =================================================
           SUBMIT
        ================================================= */

        submitBtn.addEventListener("click", async () => {

            const ownPhone = ownPhoneInput.value.trim();
            const fatherPhone = fatherPhoneInput.value.trim();
            const motherPhone = motherPhoneInput.value.trim();
            const address = addressInput.value.trim() || "المنصورة";
            const grade = gradeSelect.value;

            let hasError = false;

            if (!isValidEgyptPhone(ownPhone)) {
                setInputError(ownPhoneInput, ownPhoneError, true);
                hasError = true;
            } else {
                setInputError(ownPhoneInput, ownPhoneError, false);
            }

            if (!isValidEgyptPhone(fatherPhone)) {
                setInputError(fatherPhoneInput, fatherError, true);
                hasError = true;
            } else {
                setInputError(fatherPhoneInput, fatherError, false);
            }

            if (!isValidEgyptPhone(motherPhone)) {
                setInputError(motherPhoneInput, motherError, true);
                hasError = true;
            } else {
                setInputError(motherPhoneInput, motherError, false);
            }

            if (!selectedStage) {
                setInputError(null, stageError, true);
                hasError = true;
            }

            if (selectedStage && !grade) {
                setInputError(null, gradeError, true);
                hasError = true;
            }

            if (!currentUsername) {
                showToast("لم يتم العثور على حساب حالي", "error");
                return;
            }

            if (hasError) {
                showToast("برجاء مراجعة الحقول المطلوبة", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add("loading");

            try {

                await db.collection(USERS_COLLECTION).doc(currentUsername).set({
                    ownPhone: ownPhone,
                    fatherPhone: fatherPhone,
                    motherPhone: motherPhone,
                    stage: selectedStage,
                    grade: grade,
                    address: address,
                    profileCompleted: true,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                showToast("تم حفظ البيانات بنجاح", "success");

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 900);

            } catch (error) {

                console.error("SAVE PROFILE ERROR:", error);
                showToast("حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى", "error");

            } finally {

                submitBtn.disabled = false;
                submitBtn.classList.remove("loading");

            }

        });

    </script>

</body>
